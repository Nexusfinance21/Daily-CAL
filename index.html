<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Daily"/>
<meta name="theme-color" content="#0B1D3A"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>
<title>Daily</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0B1D3A}
body{font-family:'DM Sans',sans-serif;color:#1A1A2E;overscroll-behavior:none}
#app{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;opacity:0;transition:opacity .3s ease}
.app-ready #app{opacity:1}
/* The Baseboard — one solid line the whole app rests on; the iOS strip continues it seamlessly */
html.mode-main #main::after{content:'';position:fixed;left:0;right:0;bottom:0;height:22px;background:#071021;z-index:110;pointer-events:none}
@media(min-width:768px){
  html.mode-main #main::after{height:34px}
}
/* Baseline art — layered echoes of each column sinking into the base */
#baseline-art{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:120;pointer-events:none}
.bl-col{position:absolute;bottom:7px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bl-line{height:5px;border-radius:3px}

/* STEPS TO START — morning ritual spotlight */
.daypick-ov{background:rgba(12,24,54,.30)!important;backdrop-filter:blur(1.5px)!important}
.daypick-ov .ritual-card{box-shadow:0 0 0 1px rgba(255,255,255,.5),0 18px 44px rgba(10,20,45,.30),0 2px 10px rgba(10,20,45,.14)!important}
.ritual-overlay{position:fixed;inset:0;background:rgba(7,16,33,.74);backdrop-filter:blur(7px);z-index:160;display:flex;align-items:center;justify-content:center;padding:24px;animation:ovFade .35s ease}
.ritual-card{width:100%;max-width:400px;background:#F5F2ED;border-radius:26px;padding:28px 22px 22px;box-shadow:0 0 0 6px rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.55),0 0 130px 34px rgba(91,79,233,.22);text-align:center}
.ritual-step{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.25em;color:#B8B0A8;text-transform:uppercase;margin-bottom:10px}
.ritual-q{font-size:20px;font-weight:600;color:#1A1A2E;margin-bottom:20px;line-height:1.35}
.ritual-moods{display:flex;gap:10px;justify-content:center}
.ritual-mood{flex:1;max-width:84px;border-radius:16px;border:1.5px solid #E5DFD6;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .15s;padding:14px 4px;font-family:'DM Sans',sans-serif}
.ritual-mood .face{font-size:26px;line-height:1}
.ritual-mood .lbl{font-size:9px;font-family:'DM Mono',monospace;color:#8A8578;letter-spacing:.04em;text-transform:uppercase}
.ritual-mood:active{transform:scale(.93)}
.ritual-sub{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.ritual-sub .ritual-sub-btn{flex:0 1 auto}
.ritual-sub-btn{padding:11px 20px;border-radius:20px;border:1.5px solid #E0D9CE;background:#fff;font-size:13px;color:#1A1A2E;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}
.ritual-water{display:flex;gap:9px;justify-content:center;margin:4px 0 18px}
.ritual-water .water-glass{font-size:27px}
.ritual-chores{text-align:left;margin-bottom:14px}
.ritual-next{width:100%;padding:14px;border:none;border-radius:14px;background:#1A1A2E;color:#fff;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px}
.ritual-next:active{transform:scale(.97)}
.ritual-skip{margin-top:12px;background:none;border:none;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;color:#B8B0A8;cursor:pointer;text-transform:uppercase}
.ritual-dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.ritual-dot{width:6px;height:6px;border-radius:50%;background:#DDD6CB;transition:background .2s}
.ritual-dot.on{background:#5B4FE9}

/* Download arrow — boxless, glowing, inviting */
.dl-btn{width:44px;height:44px;border:none;background:none;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.dl-btn::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(122,196,240,.5) 0%,rgba(91,79,233,.22) 45%,transparent 72%);animation:dlGlow 2.6s ease-in-out infinite}
.dl-arrow{position:relative;width:18px;height:18px;z-index:1;animation:dlNudge 2.6s ease-in-out infinite}
.dl-arrow::before{content:'';position:absolute;left:50%;top:0;width:3px;height:12px;transform:translateX(-50%);background:#EAF4FF;border-radius:2px}
.dl-arrow::after{content:'';position:absolute;left:50%;top:9px;width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);border-right:3px solid #EAF4FF;border-bottom:3px solid #EAF4FF;border-radius:2px}
@keyframes dlGlow{0%,100%{opacity:.5;transform:scale(.88)}50%{opacity:1;transform:scale(1.08)}}
@keyframes dlNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.dl-btn:active .dl-arrow{transform:scale(.82)}

/* Export menu */
.exp-row{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1.5px solid #E5DFD6;border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;transition:transform .12s}
.exp-row:active{transform:scale(.98)}
.exp-row.locked{opacity:.8}
.exp-ico{font-size:20px}
.exp-t{flex:1}
.exp-title{font-size:14px;font-weight:600;color:#1A1A2E}
.set-card{max-width:420px;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:left}.set-sec{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.22em;color:#B8B0A8;text-transform:uppercase;margin:22px 0 9px;padding-bottom:7px;border-bottom:1px solid #E5DFD6}.set-sec:first-of-type{margin-top:6px}.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #EFEAE2}.set-row:last-child{border-bottom:none}.set-t{flex:1;min-width:0}.set-lbl{font-size:14px;font-weight:600;color:#1A1A2E}.set-sub{font-size:11px;color:#B8B0A8;margin-top:2px;line-height:1.5}.set-inp{width:100%;padding:11px 13px;border:1.5px solid #E5DFD6;border-radius:11px;background:#fff;font-family:inherit;font-size:14px;color:#1A1A2E;margin-top:9px}.set-inp:focus{outline:none;border-color:#3B7BC4}.set-btn{padding:9px 15px;border:1.5px solid #1A1A2E;border-radius:11px;background:#fff;color:#1A1A2E;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0}.set-btn.solid{background:#1A1A2E;color:#fff}.set-btn.danger{border-color:#C4553A;color:#C4553A}.set-seg{display:flex;gap:0;border:1.5px solid #E5DFD6;border-radius:11px;overflow:hidden;flex-shrink:0}.set-seg button{padding:8px 13px;border:none;background:#fff;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;color:#B8B0A8;cursor:pointer;text-transform:uppercase}.set-seg button.on{background:#1A1A2E;color:#fff}.set-sw{width:46px;height:27px;border-radius:14px;border:none;background:#DDD6CC;position:relative;cursor:pointer;flex-shrink:0;transition:background .18s}.set-sw.on{background:#4E9A5E}.set-sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s;display:block;box-shadow:0 1px 3px rgba(0,0,0,.2)}.set-sw.on i{transform:translateX(19px)}.set-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.set-chip{padding:7px 12px;border-radius:20px;border:1.5px solid #E5DFD6;background:#fff;font-family:inherit;font-size:12px;color:#B8B0A8;cursor:pointer;text-transform:capitalize}.set-chip.on{border-color:#3B7BC4;background:#EAF2FB;color:#1F4D80;font-weight:600}
.set-days{margin-left:6px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;color:#6E93BE;text-transform:uppercase}.set-tag{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.14em;color:#9A8B6A;text-transform:uppercase;flex-shrink:0}.set-doc{text-align:left;font-size:12.5px;line-height:1.75;color:#4A4A55;max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}.set-doc h4{font-size:13px;color:#1A1A2E;margin:18px 0 6px}.set-doc h4:first-child{margin-top:0}.set-doc p{margin:0 0 10px}.set-doc a{color:#2E6BB0}
.exp-sub{font-size:11px;color:#B8B0A8;margin-top:2px}
.exp-note{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#C2BAB0;margin-top:6px}
.exp-note b{color:#C97F1B;font-weight:700;letter-spacing:.11em}
.exp-badge{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;padding:5px 10px;border-radius:12px;text-transform:uppercase;flex-shrink:0}
.exp-badge.free{background:#E4F0E4;color:#5B8A5B}
.exp-badge.plus{background:linear-gradient(135deg,#5B4FE9,#8B5CF6);color:#fff}

/* week to-do + goal notes */
/* The day card is visibly tied to the calendar cell you tapped: the same
   selection purple, a date badge, and it slides in when the day changes.
   Transition, not animation — animations are disabled inside #main. */
.todo-card.tc-day{background:linear-gradient(168deg,#FBF4EA 0%,#FDF9F3 58%,#fff 100%);
  border:1.5px solid #E8D8C4;box-shadow:0 6px 20px rgba(150,105,60,.10);position:relative;
  padding-left:19px;overflow:hidden}
.todo-card.tc-day:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#C07A4C,#E0A552)}
/* the date reads like a diary heading, not a metric */
.tc-badge{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
.tc-badge .n{font-family:'Newsreader',Georgia,serif;font-size:34px;font-weight:400;
  color:#9C5F35;line-height:.9;letter-spacing:-.5px}
.tc-badge .m{font-family:'Newsreader',Georgia,serif;font-size:14px;font-style:italic;
  font-weight:300;color:#B08359;letter-spacing:.01em}
.todo-card.tc-day .todo-q{color:#3A2B1E}
.todo-card.tc-day .todo-inp{background:#fff;border-color:#EADCCB}
.todo-card.tc-day .todo-inp:focus{border-color:#C07A4C}
.todo-card.tc-day .todo-add{background:#9C5F35}
.todo-card.tc-day .todo-chk{border-color:#E2D2BE}
.todo-card.tc-day .ev-time{font-size:13px;font-weight:600;color:#9C5F35;min-width:46px;flex-shrink:0;font-variant-numeric:tabular-nums}
.todo-card.tc-day .todo-when{background:#F5EADC;color:#9C7A56}
/* the slide-in when you pick another day */
.tc-day.tc-enter{opacity:0;transform:translateY(10px)}
.tc-day.tc-settle{opacity:1;transform:translateY(0);
  transition:opacity .3s ease,transform .34s cubic-bezier(.25,.7,.3,1)}
.todo-card{background:#fff;border:1px solid #EDE7DD;border-radius:16px;padding:16px 17px;margin-bottom:16px}
.todo-q{font-size:14px;font-weight:600;color:#1A1A2E;margin-bottom:12px}
.todo-q em{font-style:normal;float:right;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;color:#B8B0A8;text-transform:uppercase;font-weight:400}
.todo-row{display:flex;gap:8px}
.todo-inp{flex:1;padding:11px 13px;border:1.5px solid #E0D9CE;border-radius:11px;font-family:'DM Sans',sans-serif;font-size:14px;color:#1A1A2E;outline:none;background:#FAF8F4;min-width:0}
.todo-inp:focus{border-color:#5B4FE9;background:#fff}
.todo-add{padding:11px 18px;border:none;border-radius:11px;background:#1A1A2E;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.todo-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #F2EEE7}
.todo-item:last-of-type{border-bottom:none}
.todo-chk{width:20px;height:20px;border-radius:6px;border:2px solid #E2DDD8;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;background:none;padding:0}
.todo-item.done .todo-chk{background:#8BA888;border-color:#8BA888;color:#fff}
.todo-t{flex:1;font-size:14px;color:#1A1A2E;min-width:0}
.todo-item.done .todo-t{text-decoration:line-through;opacity:.5}
.todo-when{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:#8A8578;background:#F2EEE7;padding:5px 10px;border-radius:9px;white-space:nowrap;border:none;cursor:pointer}
.todo-when:active{background:#E6E0D6}
.todo-when.none{color:#B8B0A8}
.todo-x{background:none;border:none;color:#D0C8C0;font-size:17px;cursor:pointer;padding:2px 4px;line-height:1}
.todo-empty{font-size:13px;color:#B8B0A8;font-style:italic;padding:10px 0}
.gnote{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid #EDE7DD}
.gnote:last-of-type{border-bottom:none}
.gnote .dot{width:5px;height:5px;border-radius:50%;background:#1E5A7A;margin-top:8px;flex-shrink:0}
.gnote .tx{flex:1;font-size:14px;color:#1A1A2E;line-height:1.6;min-width:0;word-break:break-word}
/* Goals */
.goal-trig{width:100%;background:linear-gradient(135deg,#0E2B4A 0%,#1E5A7A 55%,#2E8B8B 100%);border:none;border-radius:16px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;margin-top:10px}
.goal-trig .ic{font-size:22px}
.goal-trig .tx{flex:1;text-align:left}
.goal-trig .ti{font-size:14px;font-weight:600;color:#fff}
.goal-trig .sb{font-size:11px;color:rgba(255,255,255,.72);margin-top:1px}
.goal-trig .ar{color:rgba(255,255,255,.6);font-size:16px}
.goal-trig .badge{background:#E8A87C;color:#2A1B04;font-family:'DM Mono',monospace;font-size:9px;padding:3px 8px;border-radius:9px;font-weight:700}
.gv-ov{position:fixed;inset:0;z-index:170;display:flex;align-items:center;justify-content:center;padding:max(env(safe-area-inset-top,0px),22px) 18px max(env(safe-area-inset-bottom,0px),22px);background:rgba(12,24,54,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:ovFade .22s ease}
.gv-sheet{width:100%;max-width:430px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;background:#F5F2ED;border-radius:24px;box-shadow:0 26px 70px rgba(10,15,40,.5)}
.gv-top{display:flex;align-items:center;gap:12px;padding:15px 18px 13px;background:linear-gradient(135deg,#0E2B4A,#1E5A7A 60%,#2E8B8B);flex-shrink:0}
.gv-t{flex:1;min-width:0}
.gv-h{font-size:19px;font-weight:600;color:#fff;letter-spacing:-.3px}
.gv-s{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.55);text-transform:uppercase;margin-top:4px}
.gv-x{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:17px;cursor:pointer;flex-shrink:0}
.gv-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 22px}
.gv-lbl{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.2em;color:#B8B0A8;text-transform:uppercase;margin:22px 0 11px}
.gv-lbl:first-child{margin-top:0}
.gcard{background:#fff;border-radius:16px;padding:17px 18px;margin-bottom:11px;position:relative;border:1px solid #EDE7DD}
.gcard.review{border:1.5px solid #E8A87C;background:#FFF9F2}
.gcard .gt{font-size:16px;font-weight:600;color:#1A1A2E;padding-right:26px;line-height:1.35}
.gcard .gm{font-family:'DM Mono',monospace;font-size:10px;color:#8A8578;margin-top:6px;letter-spacing:.03em}
.gbar{height:6px;border-radius:4px;background:#EDE7DD;margin-top:13px;overflow:hidden}
.gbar i{display:block;height:6px;border-radius:4px;background:linear-gradient(90deg,#1E5A7A,#2E8B8B)}
.gbar i.warn{background:linear-gradient(90deg,#C4553A,#E8A87C)}
.gfoot{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.gchip{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:9px;background:#F0EDE8;color:#8A8578}
.gchip.on{background:#E4EFF2;color:#1E5A7A}
.gdel{position:absolute;top:12px;right:13px;background:none;border:none;color:#D0C8C0;font-size:17px;cursor:pointer;padding:2px 6px;line-height:1}
.gout{display:inline-block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:9px;font-weight:700}
.gout.won{background:#DFF0E2;color:#2F6B3E}
.gout.part{background:#FBF0DC;color:#8A6420}
.gout.miss{background:#F3E2DE;color:#8E3B2C}
.gv-new{width:100%;padding:15px;border:1.5px dashed #B9CEDA;border-radius:14px;background:#EAF2F5;color:#1E5A7A;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px}
.gv-empty{text-align:center;color:#B8B0A8;font-size:13.5px;font-style:italic;padding:34px 10px}
.gwhen{font-family:'DM Mono',monospace;font-size:11px;color:#1E5A7A;text-align:center;margin:-4px 0 14px;min-height:16px;letter-spacing:.03em}
.gwhen.bad{color:#C4553A}
.ghint{font-size:11px;color:#B8B0A8;text-align:center;margin:-6px 0 14px;line-height:1.6}
.gout-row{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.gout-btn{padding:13px;border-radius:13px;border:1.5px solid #E0D9CE;background:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:#1A1A2E;cursor:pointer}
.gout-btn.win{background:#2F6B3E;border-color:#2F6B3E;color:#fff}
/* 24-hour day view */
.dv-ov{position:fixed;inset:0;z-index:170;background:#F0EDE8;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dv-top{display:flex;align-items:center;gap:12px;padding:14px 18px 12px;background:linear-gradient(180deg,#0B1D3A,#1B3A6B);flex-shrink:0}
.dv-t{flex:1;min-width:0}
.dv-day{font-size:17px;font-weight:600;color:#fff;letter-spacing:-.3px}
.dv-sub{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.5);text-transform:uppercase;margin-top:4px}
.dv-x{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:17px;cursor:pointer;flex-shrink:0}
.dv-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.dv-loose{padding:11px 18px;border-bottom:1px solid #E2DDD8;background:#E9E4DC}
.dv-loose .k{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.16em;color:#9A938A;text-transform:uppercase;margin-bottom:7px}
.dv-loose .it{font-size:13.5px;color:#1A1A2E;padding:4px 0}
.dv-grid{position:relative;padding-bottom:40px}
.dv-hr{position:absolute;left:0;right:0;height:1px;background:#E2DDD8}
.dv-hl{position:absolute;left:0;width:52px;text-align:right;padding-right:9px;font-family:'DM Mono',monospace;font-size:10px;color:#A69E94;transform:translateY(-6px)}
.dv-half{position:absolute;left:52px;right:0;height:1px;background:#EDE8E1}
.dv-ev{position:absolute;border-radius:9px;padding:7px 10px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 2px 8px rgba(26,26,46,.10);min-height:26px}
.dv-ev .lb{font-size:13px;font-weight:600;color:#1A1A2E;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-ev .tm{font-family:'DM Mono',monospace;font-size:9.5px;color:#8A8578;margin-top:3px}
.dv-ev.past{opacity:.5}
.dv-now{position:absolute;left:44px;right:0;height:2px;background:#5B4FE9;z-index:3;border-radius:2px}
.dv-now:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#5B4FE9}

.dv-tap{position:absolute;left:52px;right:0;background:none;border:none;padding:0;cursor:pointer}
.dv-empty{position:absolute;left:52px;right:14px;top:50%;transform:translateY(-50%);text-align:center;color:#B8B0A8;font-size:13px;font-style:italic}
.chip-btn{display:flex;align-items:center;gap:6px;background:#1A1A2E;border:1px solid #1A1A2E;border-radius:18px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:#fff;cursor:pointer;letter-spacing:.02em}
/* period picker for the reports */
.pp-ov{position:fixed;inset:0;z-index:178;display:flex;align-items:center;justify-content:center;

  scrollbar-width:none;position:relative}
.pp-card::-webkit-scrollbar{display:none}
.pp-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;

.pp-sub{font-size:12.5px;color:#8A8578;margin-bottom:16px;line-height:1.55}
.pp-grid{display:flex;flex-wrap:wrap;gap:7px}

.pp-cell.on{background:#5B4FE9;border-color:#5B4FE9;color:#fff;font-weight:600}
.pp-cell.locked{background:#F0EDE8;border-style:dashed;border-color:#DED7CC;color:#B0A99F}
.pp-cell.locked:after{content:" \1F512";font-size:9px}
.pp-cell.today{border-color:#5B4FE9}
.pp-week{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.16em;color:#B8B0A8;
  text-transform:uppercase;margin:14px 0 8px}
.pp-go{width:100%;margin-top:18px;padding:14px;border:none;border-radius:14px;background:#1A1A2E;
  color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer}
.pp-note{font-size:11.5px;color:#8A8578;margin-top:12px;line-height:1.6;text-align:center}
/* lock-screen weather: the temperature opens the week, the place opens a picker */
.lk-tap{background:none;border:none;padding:0;cursor:pointer;text-align:inherit;font:inherit;
  color:inherit;will-change:transform}
/* A slow nudge every few seconds so both blocks read as tappable. It rests
   for most of the cycle — constant motion on a lock screen is exhausting.
   The lock screen is outside the app-wide animation ban, so this is allowed. */
@keyframes lkNudge{
  0%,84%,100%{transform:translateY(0)}
  88%{transform:translateY(-3px)}
  92%{transform:translateY(0)}
  96%{transform:translateY(-1.5px)}
}
.lk-tap{animation:lkNudge 5.2s ease-in-out infinite}
/* offset the second one so they do not move in unison, which reads mechanical */
.lk-tap.lk-b{animation-delay:1.6s}
.lk-tap:active{transform:scale(.97);animation:none}
/* respect a system preference for less movement */
@media(prefers-reduced-motion:reduce){.lk-tap{animation:none}}
/* not yet located: no nudge and no affordance */
.lk-tap.lk-quiet{animation:none;cursor:default;pointer-events:none}
.lk-hint{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:.18em;
  text-transform:uppercase;opacity:.45;margin-top:7px;white-space:nowrap}
/* the lock screen is exempt from the app-wide animation ban, so this can move */
.lk-week{overflow:hidden;max-height:0;opacity:0;
  transition:max-height .42s cubic-bezier(.25,.8,.3,1),opacity .3s ease,margin .42s ease;
  margin-top:0;display:flex;gap:6px;flex-wrap:nowrap;justify-content:space-between}
.lk-week.open{max-height:120px;opacity:1;margin-top:16px}
.lk-week-in{display:flex;gap:6px;flex-wrap:nowrap;width:100%;
  overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;padding-bottom:2px}
.lk-week-in::-webkit-scrollbar{display:none}
.lk-day{flex:1 0 auto;min-width:46px;padding:9px 6px;border-radius:12px;text-align:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.lk-day .d{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:.12em;
  text-transform:uppercase;opacity:.5}
.lk-day .i{font-size:13px;margin:4px 0 2px;line-height:1}
.lk-day .h{font-size:11.5px;font-weight:600}
.lk-day .l{font-size:9.5px;opacity:.5}
.place-ov{position:fixed;inset:0;z-index:180;display:flex;align-items:center;justify-content:center;
  padding:max(env(safe-area-inset-top,0px),26px) 22px max(env(safe-area-inset-bottom,0px),26px);
  background:rgba(8,16,34,.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.place-card{width:100%;max-width:400px;text-align:center}
.place-q{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:300;
  color:rgba(255,255,255,.9);margin-bottom:16px}
.place-field{display:flex;gap:9px;background:#fff;border-radius:15px;padding:8px;
  box-shadow:0 18px 44px rgba(6,12,28,.42)}
.place-field input{flex:1;min-width:0;border:none;outline:none;background:none;padding:12px;
  font-family:'DM Sans',sans-serif;font-size:16px;color:#1A1A2E}
.place-field button{border:none;border-radius:10px;background:#1A1A2E;color:#fff;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;padding:0 18px;cursor:pointer}
.place-note{font-size:12px;color:rgba(255,255,255,.55);margin-top:14px;line-height:1.6}
.place-note b{color:rgba(255,255,255,.85);font-weight:500}
.place-back{margin-top:16px;background:none;border:none;color:rgba(255,255,255,.5);
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;padding:8px}
/* weather inside the app */
.hl-wx{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hl-wx .wline{display:flex;align-items:center;gap:6px}
.hl-wx-go{font-size:15px;color:rgba(255,255,255,.38);margin-left:1px;line-height:1}
.hl-right .header-actions{justify-content:flex-end;margin-bottom:12px}
.hl-wx .city{font-size:13px;color:rgba(255,255,255,.5);letter-spacing:.02em}
.hl-wx .i{font-size:16px;line-height:1}
.hl-wx .t{font-size:19px;font-weight:600;color:#fff;letter-spacing:-.3px;line-height:1}
.hl-wx .c{font-size:13px;color:rgba(255,255,255,.6)}
.wc-wx{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:5px}
.wc-wx .i{font-size:11px;line-height:1}
.wc-wx .h{font-family:'DM Mono',monospace;font-size:9.5px;color:#4A5468;font-weight:500}
.wc-wx .l{font-family:'DM Mono',monospace;font-size:9.5px;color:#A9A297}
.wxrow{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;max-width:100%;
  overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:2px}
.wxrow::-webkit-scrollbar{display:none}
.wxcell{flex:1 0 auto;min-width:52px;background:#fff;border:1px solid #EDE7DD;border-radius:12px;

.wxcell .i{font-size:15px;margin:5px 0 3px;line-height:1}
.wxcell .h{font-size:12px;font-weight:600;color:#1A1A2E}
.wxcell .l{font-size:10px;color:#A9A297;margin-top:1px}
/* Streaks */
.streak-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip-btn{margin-left:auto}
.moodrow{background:#fff;border:1px solid #EDE7DD;border-radius:14px;padding:13px 15px;margin-bottom:16px}
.moodrow .q{font-size:12.5px;font-weight:600;color:#1A1A2E;margin-bottom:11px}
.moodrow .q em{font-style:normal;float:right;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;color:#B8B0A8;text-transform:uppercase;font-weight:400}
.moodfaces{display:flex;gap:7px}
.moodfaces button{flex:1;aspect-ratio:1;max-height:54px;border-radius:13px;border:1.5px solid #EAE5DD;background:#FAF8F4;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.moodfaces button.on{border-color:#5B4FE9;background:#F0EEFF}
.moodset{display:flex;align-items:center;gap:10px}

.streak-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #EDE7DD;border-radius:18px;padding:7px 13px;font-family:'DM Mono',monospace;font-size:10px;color:#8A8578;letter-spacing:.05em;cursor:pointer}
.streak-chip:active{transform:scale(.96)}
.streak-chip.act{border-color:#DCD5CA}
.streak-chip b{color:#1A1A2E;font-size:12px;font-weight:600}
/* Sunday reflection */
.reflect-card{position:relative;overflow:hidden;background:linear-gradient(115deg,#0C1836 0%,#1E2E5A 30%,#3E4C7E 55%,#6B6E96 76%,#C99A78 100%);border-radius:14px;padding:14px 18px 13px;margin-bottom:18px;cursor:pointer;transition:transform .15s;box-shadow:0 8px 26px rgba(12,24,54,.30)}
.reflect-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.reflect-card:active{transform:scale(.985)}
.reflect-card.read::after{display:none}
.reflect-card.read{animation:none}
.reflect-card::after{content:"";position:absolute;top:14px;right:16px;width:9px;height:9px;border-radius:50%;background:#C9704A;box-shadow:0 0 0 3px rgba(201,112,74,.24)}
.reflect-from{font-size:10px;color:rgba(255,255,255,.5);font-style:italic;margin-bottom:5px;font-weight:300}
.reflect-title{font-size:13.5px;font-weight:300;color:rgba(255,255,255,.9);letter-spacing:.015em;line-height:1.5;flex:1;min-width:0;padding-right:26px}
.reflect-sub{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.05em;text-align:right;white-space:nowrap;flex-shrink:0;font-weight:300}
.ltr-ov{background:linear-gradient(180deg,#0B1D3A 0%,#16305A 48%,#1B3A6B 100%)!important;backdrop-filter:none!important;overflow:hidden}
.ltr-card{position:relative;max-width:440px;max-height:84vh;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:left;background:linear-gradient(178deg,#FCFBF8 0%,#F6F2EA 100%);padding:0}

.ltr-in{padding:26px 28px 24px}
.ltr-date{font-size:11.5px;color:#A29A8D;font-style:italic;margin-bottom:20px}
.ltr-hi{font-size:21px;font-weight:300;color:#232B3A;letter-spacing:-.2px;margin-bottom:14px}
.ltr-body{text-align:center}

.ltr-fig .bar{display:block;height:6px;border-radius:4px;background:#E9E1D4;margin-top:12px;overflow:hidden;width:100%}
.ltr-fig .bar i{display:block;height:6px;border-radius:4px;min-width:0}

.ltr-fig.lf1 .bar i{background:linear-gradient(90deg,#2F4C7A,#5B8FD0)}
.ltr-fig.lf1 .l{color:#4A6494}
.ltr-fig.lf2 .bar i{background:linear-gradient(90deg,#2E7FA8,#5AC0DE)}
.ltr-fig.lf2 .l{color:#357C9B}
.ltr-fig.lf3 .bar i{background:linear-gradient(90deg,#4E8C5B,#7FB98A)}
.ltr-fig.lf3 .n{color:#3F7A4C}
.ltr-fig.lf3 .l{color:#4A7A55}
.ltr-tmr{margin-top:17px;padding-top:16px;border-top:1px solid #EAE3D8;font-size:13.5px;color:#4C5566;line-height:1.7}
.ltr-sign{margin-top:20px;padding-top:16px;border-top:1px solid #EAE3D8}
.ltr-name{font-size:15px;color:#1A1A2E;font-style:italic}
.ltr-when{font-size:11px;color:#B0A99C;margin-top:4px;font-style:italic}
.ltr-btn{display:block;width:100%;margin-top:22px;padding:14px;border:none;border-radius:12px;background:#1A1A2E;color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.wr-lbl{font-size:11px;color:#A89680;font-weight:600;letter-spacing:.03em;margin:20px 0 9px}
.wr-cap{color:#B4A892;font-weight:500}
.wr-dl{display:block;width:100%;margin-top:20px;padding:14px;border:1.5px solid #C9A06A;border-radius:12px;background:#FBF3E6;color:#8A6420;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.wr-x{position:absolute;top:12px;right:12px;z-index:3;width:34px;height:34px;border-radius:50%;border:none;background:rgba(20,27,46,.06);color:#6A6560;font-size:17px;line-height:1;cursor:pointer;padding:0}
.wr-pass{display:block;width:100%;margin:2px 0 14px;padding:12px;border:1px dashed #D8CBB6;border-radius:12px;background:none;color:#9A7B4E;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}

.reflect-stats{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}

.rstat-num{font-family:'DM Mono',monospace;font-size:16px;color:#1A1A2E}
.rstat-lbl{font-size:8px;font-family:'DM Mono',monospace;color:#B8B0A8;text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
/* Backup */
.backup-btn{display:block;margin:26px auto 8px;background:none;border:1.5px dashed #D8D0C8;border-radius:14px;padding:12px 22px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;color:#B8B0A8;cursor:pointer;text-transform:uppercase}

/* Water bar — litres slider */
.wbar-wrap{margin:4px 0 10px}
.wbar-val{font-family:'DM Mono',monospace;font-size:24px;color:#1A1A2E;text-align:center;margin-bottom:12px;letter-spacing:-1px}
.wbar-unit{font-size:12px;color:#B8B0A8;letter-spacing:.1em;margin-left:3px}

.wbar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:19px;background:linear-gradient(90deg,#5B9BD5 0%,#4FC3F7 100%);transition:width .12s ease;min-width:12px}
.wbar-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 9px rgba(20,40,80,.3);transition:left .12s ease;pointer-events:none}
.wbar-scale{position:relative;height:28px;margin-top:9px;font-family:'DM Mono',monospace;letter-spacing:.06em}

.wbar-tick:active{color:#4F9FD5;background:rgba(79,159,213,.1)}

/* Target wizard */
.tchip{padding:10px 14px;border-radius:14px;border:1.5px solid #E0D9CE;background:#fff;font-size:12px;font-family:'DM Mono',monospace;cursor:pointer;color:#8A8578;letter-spacing:.04em}
.tchip.on{background:#5B4FE9;color:#fff;border-color:#5B4FE9}
.dchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
.dchip{width:38px;height:36px;border-radius:10px;border:1.5px solid #E0D9CE;background:#fff;font-family:'DM Mono',monospace;font-size:12px;color:#8A8578;cursor:pointer;padding:0}
.dchip.on{background:#5B4FE9;color:#fff;border-color:#5B4FE9}
.tchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.target-card{background:linear-gradient(135deg,#1A1A2E,#2D1B69);border-radius:16px;padding:15px 17px;margin-bottom:10px;position:relative}
.tc-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:3px}
.tc-meta{font-family:'DM Mono',monospace;font-size:10px;color:#A08FFF;letter-spacing:.05em}
.tc-edit{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.34);margin-top:9px}

.target-card:active{transform:scale(.985)}
.tc-del{position:absolute;top:10px;right:12px;background:none;border:none;color:rgba(255,255,255,.35);font-size:16px;cursor:pointer;padding:2px 6px}
.target-new{width:100%;padding:14px;border:1.5px dashed #C9BFDF;border-radius:14px;background:#F3F0FA;color:#5B4FE9;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:16px}
.tstrategy{text-align:left;background:#EDEAFB;border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.7;color:#3A3460;white-space:pre-line;margin-bottom:14px;font-family:'DM Sans',sans-serif}

/* Diary framed answer */
.diary-frame{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:13px;padding:15px 16px;font-style:italic;color:#EDEAF7;line-height:1.65;font-size:14px;font-family:'DM Sans',sans-serif;white-space:pre-line}
.diary-frame::before{content:'✦  ';opacity:.5;font-style:normal}
.diary-edit-btn{margin-top:12px;background:none;border:none;color:rgba(255,255,255,.38);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;cursor:pointer;text-transform:uppercase;padding:4px 2px}
.diary-received{position:absolute;top:-13px;right:16px;background:#8BA888;color:#fff;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;padding:8px 15px;border-radius:16px;text-transform:uppercase;animation:recvPop .55s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 18px rgba(60,90,60,.4);z-index:2}
@keyframes recvPop{0%{opacity:0;transform:scale(.4) translateY(10px)}60%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}

/* Advice line — emphasized */
.advice-line{text-align:center;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;font-style:normal;letter-spacing:.01em;color:#EAF2FF;margin:34px auto 6px;text-transform:none;background:linear-gradient(120deg,#0B1D3A 0%,#1B3A6B 60%,#2E6BB0 100%);border:none;padding:13px 22px;border-radius:16px;width:fit-content;max-width:88%;line-height:1.5;box-shadow:0 6px 18px rgba(11,29,58,.28)}

/* Gideon support chat */
.jchat-box{max-height:210px;overflow-y:auto;text-align:left;margin-bottom:10px}

.econtact-row{display:flex;gap:6px;margin-top:8px}
.econtact-inp{flex:1;padding:9px 12px;border:1.5px solid #E0D9CE;border-radius:10px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;background:#fff}

/* Canvas continuation — any iOS-reserved strip below the app paints in the app's own column colours, exactly like the lock screen's sky trick */
html.mode-main,html.mode-main body{background:#071021!important}

/* LOCK */
#lock{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;display:flex;flex-direction:column}
.sky{position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;transition:background 1.5s ease}
.sky.clear-day{background:linear-gradient(180deg,#1A6BB5 0%,#3A9DD8 50%,#7AC4F0 100%)}
.sky.sun-clouds{background:linear-gradient(180deg,#2E7BC4 0%,#5AA7E8 45%,#9CCBF5 100%)}
.sky.sun-shower{background:linear-gradient(180deg,#5E7FA8 0%,#88A9C9 45%,#C4D6E8 100%)}
.sky.clear-night{background:linear-gradient(180deg,#030712 0%,#0B1D3A 50%,#1B3A6B 100%)}
.sky.cloudy{background:linear-gradient(180deg,#4A5568 0%,#6B7280 40%,#9CA3AF 100%)}
.sky.drizzle{background:linear-gradient(180deg,#2D3748 0%,#4A5568 40%,#718096 100%)}
.sky.rainy{background:linear-gradient(180deg,#1F2937 0%,#374151 40%,#4B5563 100%)}
.sky.heavy-rain{background:linear-gradient(180deg,#111827 0%,#1F2937 40%,#374151 100%)}
.sky.stormy{background:linear-gradient(180deg,#0A0F1A 0%,#111827 50%,#1F2937 100%)}
.sky.snowy{background:linear-gradient(180deg,#CBD5E1 0%,#E2E8F0 50%,#F8FAFC 100%)}
.sky.sunrise{background:linear-gradient(180deg,#2A1E3F 0%,#8A4D76 28%,#E8825A 55%,#F7C873 78%,#FFE3A3 100%)}
.sky.sunset{background:linear-gradient(180deg,#1B2A52 0%,#5A2E5C 30%,#C0552A 58%,#F09A5C 80%,#FFD9A0 100%)}
.sky.dusk{background:linear-gradient(180deg,#0C1836 0%,#1E2E5A 34%,#3E4C7E 60%,#6B6E96 82%,#C99A78 100%)}
/* Smooth theme transitions — every sky layer fades in */
@keyframes skyIn{from{opacity:0}to{opacity:1}}
#lock .sky,#lock .cloud-layer,#lock .star-layer,#lock .rain-layer,#lock .snow-layer,#lock .sun-glow{animation:skyIn .9s ease}
body{transition:background 1s ease}
/* Sun glow */
.sun-glow{position:absolute;top:8%;right:12%;width:180px;height:180px;border-radius:50%;z-index:1;pointer-events:none;background:radial-gradient(circle,rgba(255,236,170,.95) 0%,rgba(255,214,120,.55) 32%,rgba(255,200,100,0) 70%);animation:skyIn .9s ease,sunPulse 6s ease-in-out infinite alternate}
@keyframes sunPulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.12);opacity:1}}
.sun-shower .sun-glow,.theme-sun-shower .sun-glow{opacity:.75}
.cloud-layer{position:absolute;inset:0;z-index:2;pointer-events:none}
.cloud{position:absolute;border-radius:50px;filter:blur(8px);transition:transform .5s cubic-bezier(.22,.61,.36,1),filter .3s,opacity .3s}
.c1{width:220px;height:40px;top:18%;left:-10%;animation:drift1 25s linear infinite}
.c2{width:160px;height:30px;top:28%;right:-5%;animation:drift2 30s linear infinite}
.c3{width:280px;height:50px;top:42%;left:-15%;animation:drift1 35s linear infinite;opacity:.7}
.c4{width:120px;height:25px;top:58%;right:10%;animation:drift2 20s linear infinite;opacity:.5}
.c5{width:200px;height:35px;top:72%;left:-5%;animation:drift1 28s linear infinite;opacity:.4}
.theme-clear-day .cloud{background:rgba(255,255,255,0.45)}
.theme-sun-clouds .cloud{background:rgba(255,255,255,0.85);filter:blur(6px)}
.theme-sun-shower .cloud{background:rgba(255,255,255,0.65);filter:blur(9px)}
.theme-clear-night .cloud{background:rgba(255,255,255,0.06)}
.theme-dusk .cloud{background:rgba(120,130,170,0.5);filter:blur(7px)}
.theme-cloudy .cloud{background:rgba(255,255,255,0.25);filter:blur(12px)}
.theme-drizzle .cloud{background:rgba(200,215,230,0.3);filter:blur(13px)}
.theme-rainy .cloud{background:rgba(180,200,220,0.3);filter:blur(14px)}
.theme-heavy-rain .cloud{background:rgba(150,170,195,0.35);filter:blur(16px)}
.theme-stormy .cloud{background:rgba(100,110,130,0.5);filter:blur(18px)}
.theme-snowy .cloud{background:rgba(255,255,255,0.7);filter:blur(10px)}
.theme-sunrise .cloud{background:rgba(255,180,120,0.3)}
.theme-sunset .cloud{background:rgba(200,100,60,0.25)}
@keyframes drift1{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 300px))}}
@keyframes drift2{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 300px))}}

/* RAIN - 3 intensities */
.rain-layer{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.raindrop{position:absolute;border-radius:2px;animation:fall linear infinite}
.rain-drizzle .raindrop{width:1px;background:linear-gradient(to bottom,transparent,rgba(180,210,240,0.4))}
.rain-rain .raindrop{width:1.5px;background:linear-gradient(to bottom,transparent,rgba(160,200,235,0.65))}
.rain-heavy .raindrop{width:2.5px;background:linear-gradient(to bottom,transparent,rgba(130,180,225,0.85))}
@keyframes fall{from{transform:translateY(-30px) translateX(0)}to{transform:translateY(110vh) translateX(-20px)}}

/* SNOW */
.snow-layer{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.snowflake{position:absolute;border-radius:50%;background:rgba(255,255,255,0.8);animation:snowfall linear infinite}
@keyframes snowfall{from{transform:translateY(-10px) rotate(0deg)}to{transform:translateY(110vh) rotate(360deg)}}

/* STARS */
.star-layer{position:absolute;inset:0;z-index:1;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}

/* LIGHTNING */
@keyframes lightning{0%,92%,100%{opacity:0}94%,98%{opacity:.2}}
.lightning{position:absolute;inset:0;background:#fff;z-index:4;pointer-events:none;animation:lightning 4s infinite}

/* RIPPLE */
.touch-ripple{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,0.5);transform:scale(0);pointer-events:none;z-index:8;animation:rippleOut .7s ease-out forwards}
@keyframes rippleOut{to{transform:scale(1);opacity:0;width:120px;height:120px}}

/* LOCK LAYOUT */
.lock-top{position:relative;z-index:10;padding-top:max(env(safe-area-inset-top,44px),56px);padding-left:28px;padding-right:28px;padding-bottom:0;display:flex;justify-content:space-between;align-items:flex-start}
.lock-city-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:3px;opacity:.6}
.lock-city-name{font-size:15px;font-weight:500}
.lock-temp-big{font-family:'DM Mono',monospace;font-size:38px;font-weight:400;line-height:1;letter-spacing:-2px}
.lock-condition{font-size:11px;margin-top:2px;opacity:.7}
.lock-center{position:absolute;top:50%;left:0;right:0;transform:translateY(-54%);z-index:10;text-align:center;padding:0 28px;pointer-events:none}
.lock-time-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:6px;opacity:.5}
.lock-date-big{font-size:90px;font-weight:300;line-height:1;letter-spacing:-5px}
.lock-weekday{font-size:15px;font-weight:300;margin-top:8px;letter-spacing:.05em;opacity:.75}
.lock-bottom{position:relative;z-index:10;padding:16px 28px max(env(safe-area-inset-bottom,16px),24px);margin-top:auto}
.lock-chore-title{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;opacity:.45}
.lock-chores{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.lock-chore{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:300}
.lock-chore-dot{width:4px;height:4px;border-radius:50%;background:#5B4FE9;flex-shrink:0}
.lock-chore.done .lock-chore-dot{background:#8BA888}
.lock-chore.done span{opacity:.4;text-decoration:line-through}
.lock-open-bar{display:flex;justify-content:center}
.lock-open{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:11px 26px;border-radius:30px;cursor:pointer;backdrop-filter:blur(10px)}

/* MAIN APP — phone: centred column */
#main{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#F0EDE8;overflow:hidden}
@media(max-width:767px){
  /* The date is the title that sets the tone; the weather sits on its
     baseline so the two read as one line, not two floating corners. */
  .hl-date{font-size:40px;letter-spacing:-1.4px;line-height:1.02;margin-top:7px;white-space:nowrap}
  .hl-wx{padding-bottom:4px}
  /* Phone lock screen: three blocks sharing the height evenly.
     The date was absolutely positioned, which left a dead gap above the
     brief on tall screens and crushed it on short ones — it now flows. */
  .lock-top{padding-top:calc(max(env(safe-area-inset-top,44px),56px) + 54px)}
  .lock-center{position:static;transform:none;flex:1;display:flex;
    flex-direction:column;justify-content:center;padding-top:2vh;padding-bottom:0}
  .lock-date-big{font-size:82px;letter-spacing:-4px}
  .lock-brief-wrap{margin-bottom:20px}
  .lock-chores{margin-bottom:22px}
  .lock-open-bar{margin-top:20px}
  .lock-open{padding:13px 30px}
  .lock-bottom{padding-bottom:max(env(safe-area-inset-bottom,14px),18px)}
  /* a day only takes the room it needs; a busy one still grows */
  .week-cube-grid .week-cube{min-height:92px;padding:11px 8px 9px;gap:6px}
  .week-cube-grid .wc-empty-bar{min-height:12px}
  .week-cube-grid .wc-blocks{flex:0 1 auto}
  #main{max-width:none}
  /* Breathing room on mobile */
  .scroll{padding:14px 18px 10px;display:flex;flex-direction:column}
  .scroll > *{flex-shrink:0}
  /* the note sits at the foot, with a guaranteed gap above it */
  .scroll > .advice-line{margin-top:auto;margin-bottom:2px}
  .scroll .add-btn-ghost{margin-bottom:16px}
  .scroll .tabs{margin-bottom:18px;padding:4px}
  .tab{padding:11px 6px}
  .scroll .slbl{margin-top:24px;margin-bottom:12px}
  .citem{padding:16px 16px;margin-bottom:12px;border-radius:14px}
  .ccheck{width:22px;height:22px}
  .ctxt{font-size:15px}
  /* one swipeable row instead of three stacked lines — it was eating the page */
  /* the row scrolls inside itself — it must not push the page sideways */
  .scroll .qbtns{gap:8px;margin:4px 0 14px;padding:2px 0 4px;flex-wrap:nowrap;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    overscroll-behavior-x:contain;max-width:100%}
  .scroll .qbtns::-webkit-scrollbar{display:none}
  .scroll .qbtn{padding:9px 16px;font-size:12.5px;flex:0 0 auto;white-space:nowrap}
  .sadd-btn{padding:15px 16px;margin-top:14px;font-size:14px}
  .scroll .add-btn-ghost{padding:13px;margin-top:10px;font-size:14px}
  /* the mood question is the tallest block — give it just what it needs */
  .scroll .moodrow{padding:10px 14px;margin-bottom:10px}
  .scroll .moodfaces button{max-height:42px}
  .scroll .moodrow .q{margin-bottom:9px}
  .scroll .streak-row{margin-bottom:12px}
  /* the journal box fills the leftover height instead of overflowing */
  .scroll > .jcard{flex:1 1 auto;min-height:190px;margin-bottom:18px;
    display:flex;flex-direction:column}
  .scroll > .jcard textarea{flex:1 1 auto;min-height:96px}
  .scroll > .jcard .slbl,.scroll > .jcard .jq{flex-shrink:0}
  /* Notes gets the same treatment — the box takes what is left */
  .scroll > .thought-input-wrap{flex:0 1 auto;min-height:120px}
  .scroll > .thought-input-wrap textarea{min-height:74px}
  .scroll > .empty{flex:0 1 auto;min-height:0;overflow:hidden}
  .scroll .slbl{margin-top:18px}
  .scroll .qbtns{margin-bottom:10px}
  .sitem{padding:14px 0}
  .intent-banner{padding:20px 20px;margin-bottom:22px}
  .jcard{padding:22px}
  .thought-input-wrap{padding:18px}
  .header{padding-bottom:22px}
  /* lift the tab bar so the baseboard and its three lines can show */

  #main .nlbl{font-size:8.5px}
  html.mode-main #main::after{height:max(env(safe-area-inset-bottom,0px),34px)}
  #baseline-art{height:max(env(safe-area-inset-bottom,0px),34px)}
  /* the bars sit in the upper half of the band, clear of the home indicator */

  .header .hdr-lock-row{margin-bottom:16px}
  .header .week-strip{gap:5px}
  .header .wday{padding:9px 2px}
  .week-strip{margin-top:4px}
}

/* ── TABLET (iPad, ≥768px) ───────────────────────── */

  html,body{background:#0B1D3A}

    position:fixed;

    flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:40px;min-height:0;
    display:flex;flex-direction:column}
  /* the closing note sits at the foot of the page, given room to land */
  #content-area .scroll > .advice-line{margin-top:auto;margin-bottom:14px;flex-shrink:0}

@media(max-width:1199px){
  #right-panel{display:none!important}
}

/* DIRECTIONAL PULL animations — content slides across, tracked all the way */
/* Nothing in the app or its sheets animates. The lock screen keeps its
   weather; reports keep theirs. A single fade as a sheet opens is all. */
#main *,#main *::before,#main *::after,
.ritual-overlay,.ritual-overlay *,.ritual-overlay *::before,.ritual-overlay *::after,
.moverlay,.moverlay *,.moverlay *::before,
.health-modal-overlay,.health-modal-overlay *,.health-modal-overlay *::before,
.confirm-overlay,.confirm-overlay *{animation:none!important;animation-name:none!important}
.ritual-overlay,.moverlay,.health-modal-overlay,.confirm-overlay{animation:ovFade .22s ease!important}

/* PRESSABLE panel cards */
.rp-pressable{cursor:pointer;transition:transform .18s,box-shadow .18s}
.rp-pressable:active{transform:scale(.97)}
.rp-press-hint{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#B8B0A8;margin-top:8px;text-align:center;opacity:.7}

/* WATER TRACKER */
.water-card{background:#fff;border-radius:16px;padding:16px;margin-top:14px}
.water-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#B8B0A8;margin-bottom:4px}
.water-q{font-size:13px;color:#1A1A2E;font-weight:500;margin-bottom:14px;line-height:1.4}
.water-glasses{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.water-glass{font-size:22px;cursor:pointer;transition:transform .15s;filter:grayscale(1) opacity(.35)}
.water-glass.on{filter:none;transform:scale(1.05)}
.water-glass:active{transform:scale(.85)}
.water-count{font-family:'DM Mono',monospace;font-size:11px;color:#5B9BD5;text-align:center;font-weight:500}

/* HEALTH BAR trigger (plan) */
.healthbar-trigger{width:100%;background:linear-gradient(135deg,#5B4FE9 0%,#7B3F9E 100%);border:none;border-radius:16px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;margin-top:8px;transition:transform .15s}
.healthbar-trigger:active{transform:scale(.98)}
.hbt-icon{font-size:22px}
.hbt-text{flex:1;text-align:left}
.hbt-title{font-size:14px;font-weight:600;color:#fff}
.hbt-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.hbt-arrow{color:rgba(255,255,255,.6);font-size:16px}

/* HEALTH POPUP MODAL */
.health-modal-overlay{position:fixed;inset:0;background:rgba(11,29,58,.6);display:flex;align-items:center;justify-content:center;z-index:150;backdrop-filter:blur(10px);padding:max(env(safe-area-inset-top,0px),30px) 24px max(env(safe-area-inset-bottom,0px),26px);animation:ovFade .3s ease}
.health-modal{width:100%;max-width:400px;max-height:100%;overflow-y:auto;background:#F5F2ED;border-radius:26px;padding:24px 20px;box-shadow:0 30px 80px rgba(10,15,40,.5)}
.health-modal::-webkit-scrollbar{display:none}
.hm-close{position:sticky;top:0;float:right;width:32px;height:32px;border-radius:50%;border:none;background:#E7E2DA;color:#1A1A2E;font-size:16px;cursor:pointer;z-index:2}
.hm-title{font-size:20px;font-weight:600;color:#1A1A2E;margin-bottom:3px}
.hm-sub{font-size:12px;color:#B8B0A8;margin-bottom:20px;font-family:'DM Mono',monospace;letter-spacing:.03em}

/* HEADER */
.header{background:linear-gradient(180deg,#0B1D3A 0%,#1B3A6B 100%);padding-left:20px;padding-right:20px;padding-bottom:14px;padding-top:max(env(safe-area-inset-top,44px),48px);position:relative;overflow:hidden;flex-shrink:0}
.header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:20px;background:#F0EDE8;border-radius:20px 20px 0 0}
.header-sky-clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hc{position:absolute;background:rgba(255,255,255,.08);border-radius:40px;filter:blur(6px)}
.hc1{width:160px;height:28px;top:30%;left:-20px;animation:drift1 20s linear infinite}
.hc2{width:120px;height:22px;top:55%;right:-10px;animation:drift2 25s linear infinite}
.header-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;margin-bottom:12px}
.header-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.4);text-transform:uppercase}
.header-actions{display:flex;gap:8px}
.ibtn{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#fff;backdrop-filter:blur(10px);transition:background .15s}
.ibtn:active{background:rgba(255,255,255,.2)}
/* Weather pill */
.header-weather{display:flex;align-items:center;position:relative;z-index:2;margin-bottom:12px;padding:10px 12px;background:rgba(255,255,255,.07);border-radius:14px;border:1px solid rgba(255,255,255,.1)}
.hw-left{display:flex;align-items:center;gap:10px;flex:1}
.hw-temp{font-family:'DM Mono',monospace;font-size:24px;color:#fff;letter-spacing:-1px;line-height:1}
.hw-info{display:flex;flex-direction:column;gap:1px}
.hw-city{font-size:13px;color:#fff;font-weight:500}
.hw-date{font-size:10px;color:rgba(255,255,255,.45);font-family:'DM Mono',monospace}
.hw-icon{font-size:24px}
.hw-right{display:flex;align-items:center;gap:6px}
.hw-cond{font-size:10px;color:rgba(255,255,255,.45);font-family:'DM Mono',monospace}
.wx-card{width:100%;max-width:400px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#FBFAF7;border-radius:24px;overflow:hidden;box-shadow:0 26px 70px rgba(10,15,40,.5)}
.wx-head{background:linear-gradient(150deg,#1E4E7A 0%,#2E7DB0 55%,#4FA3D0 100%);padding:22px 24px 20px;color:#fff}
.wx-city{font-size:13px;font-weight:600;letter-spacing:.02em;opacity:.88}
.wx-nowrow{display:flex;align-items:baseline;gap:12px;margin-top:6px}
.wx-temp{font-family:'DM Mono',monospace;font-size:40px;letter-spacing:-2px;line-height:1}
.wx-cond{font-size:13px;opacity:.85}
.wx-list{padding:8px 10px 4px}
.wx-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #F1EDE6}
.wx-row:last-child{border-bottom:none}
.wx-day{flex:1;font-size:14px;color:#2A2E38;font-weight:500}
.wx-ic{font-size:18px;width:26px;text-align:center}
.wx-hi{font-family:'DM Mono',monospace;font-size:14px;color:#1F2A44;font-weight:600;min-width:40px;text-align:right}
.wx-lo{font-family:'DM Mono',monospace;font-size:13px;color:#AEA79C;min-width:38px;text-align:right}
.wx-empty{padding:26px;text-align:center;color:#AEA79C;font-size:13px}
.wx-loc{display:block;width:100%;padding:13px;background:none;border:none;border-top:1px solid #EFEAE2;color:#7C879A;font-family:inherit;font-size:12.5px;cursor:pointer;letter-spacing:.02em}
.wx-loc:active{color:#2E7DB0;background:#F3F0EA}
.wx-done{display:block;width:100%;padding:15px;background:#1A2436;border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
/* Week strip */
.week-strip{display:flex;gap:4px;position:relative;z-index:2}
.wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:10px;cursor:pointer;border:1.5px solid transparent;transition:all .2s}
/* Saved health profile summary */
.hprofile{display:flex;gap:8px;margin-bottom:12px}
.hp-cell{flex:1;background:#fff;border-radius:13px;padding:12px 8px;text-align:center}
.hp-n{font-size:16px;font-weight:700;color:#1A1A2E}
.hp-l{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;color:#B8B0A8;text-transform:uppercase;margin-top:3px}
.hp-edit{display:block;margin:0 auto 16px;background:none;border:none;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;color:#8A8578;cursor:pointer;text-transform:uppercase;padding:6px}

/* Past days dimmed — focus forward */
.wday.past{opacity:.4}
.sw-day.past{opacity:.42}
.week-cube.past{opacity:.5}
/* Future days glow — look ahead */
.wday.future{background:rgba(122,196,240,.09)}
.wday.future .wday-num{color:#CDE6FF;text-shadow:0 0 10px rgba(122,196,240,.45)}
.sw-day.future .sw-num{color:#BFDCFF}
.week-cube.future{box-shadow:0 3px 14px rgba(46,107,176,.13);border-color:#D3E2F0}
.week-cube.future .wc-num{color:#2E6BB0}
.mg-day.future{box-shadow:0 3px 11px rgba(46,107,176,.12)}
.mg-day.future .mg-num{color:#2E6BB0}
.mg-day.mg-weekend.future .mg-num{color:#C07A4C}
.wday.sel{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25)}
.wday.tod:not(.sel){border-color:rgba(91,79,233,.7);background:rgba(91,79,233,.1)}
.wday-lbl{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);font-family:'DM Mono',monospace}
.wday.sel .wday-lbl,.wday.tod .wday-lbl{color:rgba(255,255,255,.85)}
.wday-num{font-size:16px;font-weight:500;color:rgba(255,255,255,.6);line-height:1}
.wday.sel .wday-num{color:#fff;font-weight:600}
.wday.tod:not(.sel) .wday-num{color:#A8D8FF}
.wday-dot{width:4px;height:4px;border-radius:50%;background:#E8A87C;margin-top:1px}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;-webkit-overflow-scrolling:touch;min-height:0;overscroll-behavior-x:none}
.scroll::-webkit-scrollbar{display:none}

/* INTENTION BANNER */
.intent-banner{background:linear-gradient(135deg,#1A1A2E,#2D1B69);border-radius:16px;padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.intent-banner::before{content:'✦';position:absolute;right:16px;top:12px;font-size:24px;color:rgba(255,255,255,.1)}
.intent-lbl{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.03em;color:rgba(255,255,255,.5);text-transform:none;margin-bottom:7px;font-weight:500}
.intent-quote{font-size:14px;font-weight:300;color:#fff;line-height:1.6;font-style:italic}

/* TABS — refined */
.tabs{display:flex;background:#E5E0D8;border-radius:12px;padding:3px;margin-bottom:16px;gap:2px}
.tab{flex:1;padding:8px 6px;border:none;background:none;border-radius:9px;font-size:11px;font-weight:500;color:#B8B0A8;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap}
.tab.on{background:#fff;color:#1A1A2E;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tab:active{transform:scale(.96)}

/* LABELS */
.slbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#B8B0A8;margin-bottom:10px;margin-top:16px}
.slbl:first-child{margin-top:0}

/* SCHEDULE */
.sched-list{position:relative}
.sched-list::before{content:'';position:absolute;left:40px;top:10px;bottom:10px;width:1px;background:linear-gradient(to bottom,#5B4FE944,#E2DDD888,transparent)}
.sitem{display:flex;align-items:center;gap:14px;padding:10px 0;cursor:pointer}
.stime{font-family:'DM Mono',monospace;font-size:11px;color:#B8B0A8;width:40px;flex-shrink:0}
.sdot{width:9px;height:9px;border-radius:50%;background:#F0EDE8;border:2px solid #D8D0C8;flex-shrink:0;position:relative;z-index:1}
.sitem.now .sdot{background:#5B4FE9;border-color:#5B4FE9;box-shadow:0 0 0 3px #5B4FE922}
.sitem.past .sdot{background:#8BA888;border-color:#8BA888}
.slabel{font-size:14px;color:#1A1A2E;flex:1}
.sitem.now .slabel{font-weight:600;color:#5B4FE9}
.sitem.past .slabel{color:#B8B0A8}
/* inline tap actions */
.sitem-btns{display:flex;gap:6px;padding:2px 0 10px 54px}
.sitem-btn{padding:6px 14px;border-radius:8px;border:1px solid #E0DCD6;background:#F7F4F0;color:#1A1A2E;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500}
.sadd-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px dashed #D8D0C8;border-radius:12px;background:none;color:#B8B0A8;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;width:100%}

/* add a chore: the app falls away, only the field and the ideas remain */
.warp{position:fixed;inset:0;z-index:175;display:flex;align-items:center;justify-content:center;padding:max(env(safe-area-inset-top,0px),26px) 22px max(env(safe-area-inset-bottom,0px),26px);background:rgba(12,20,40,.52);backdrop-filter:blur(22px) saturate(.85);-webkit-backdrop-filter:blur(22px) saturate(.85);animation:ovFade .22s ease}
.warp-in{width:100%;max-width:430px;max-height:100%;overflow-y:auto;text-align:center;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.warp-in::-webkit-scrollbar{display:none}
.warp-q{font-family:'DM Sans',sans-serif;font-size:19px;font-weight:300;color:rgba(255,255,255,.9);letter-spacing:-.2px;margin-bottom:18px}
.warp-field{display:flex;gap:9px;background:#fff;border-radius:16px;padding:9px;box-shadow:0 20px 50px rgba(6,12,28,.45)}
.warp-field input{flex:1;min-width:0;border:none;outline:none;background:none;padding:13px 12px;font-family:'DM Sans',sans-serif;font-size:17px;color:#1A1A2E}
.warp-field input::placeholder{color:#C0B9AF}
.warp-field button{flex-shrink:0;border:none;border-radius:11px;background:#1A1A2E;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;padding:0 20px;cursor:pointer}
.warp-hint{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.42);margin:22px 0 12px}
.warp-ideas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.warp-idea{padding:9px 15px;border-radius:20px;border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.09);font-family:'DM Sans',sans-serif;font-size:13.5px;color:rgba(255,255,255,.86);cursor:pointer;white-space:nowrap;transition:background .15s}
.warp-idea:active{background:rgba(255,255,255,.24)}
.warp-x{position:absolute;top:max(env(safe-area-inset-top,0px),18px);right:20px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.10);color:#fff;font-size:19px;line-height:1;cursor:pointer;padding:0}
@media(max-width:400px){.warp-idea{font-size:12.5px;padding:8px 13px}.warp-q{font-size:17px}}
/* CHORES */
.citem{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:12px;margin-bottom:8px;cursor:pointer;border:1.5px solid transparent}
.citem.done{opacity:.5}
.ccheck{width:20px;height:20px;border-radius:6px;border:2px solid #E2DDD8;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;transition:all .15s}
.citem.done .ccheck{background:#8BA888;border-color:#8BA888;color:#fff}
.ctxt{font-size:14px;flex:1}
.citem.done .ctxt{text-decoration:line-through}
.add-row{display:flex;gap:8px;margin-top:4px}
.add-inp{flex:1;padding:10px 14px;border:1.5px solid #5B4FE9;border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:#fff;color:#1A1A2E}
.add-save{padding:10px 16px;background:#5B4FE9;color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}
.add-btn-ghost{width:100%;padding:11px;border:1.5px dashed #D8D0C8;border-radius:12px;background:none;color:#B8B0A8;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px}

/* JOURNAL */
.jcard{background:#1A1A2E;border-radius:16px;padding:18px;margin-bottom:22px}
.jlbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:10px}
.jta{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 14px;font-size:14px;color:#fff;font-family:'DM Sans',sans-serif;resize:none;outline:none;min-height:80px;line-height:1.6}
.jta::placeholder{color:rgba(255,255,255,.3)}
.jsave{display:block;width:100%;margin-top:14px;padding:13px 20px;background:#5B4FE9;color:#fff;border:none;border-radius:12px;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600}

/* RIGHT PANEL week cards */
.wcard{background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s}
.wcard.today{border-color:#5B4FE9}
.wcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.wcard-name{font-size:13px;font-weight:600;color:#1A1A2E}
.wcard-sub{font-family:'DM Mono',monospace;font-size:10px;color:#B8B0A8;margin-left:5px}
.wcard-done{font-family:'DM Mono',monospace;font-size:10px;color:#8BA888;margin-top:5px}
.badge{font-size:9px;background:#5B4FE9;color:#fff;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:16px;background:#F0EDE8;color:#B8B0A8}
.empty{text-align:center;color:#B8B0A8;font-size:13px;padding:24px 0}

/* WEEK VIEW — intention banner */
.week-intent-banner{
  background:linear-gradient(135deg,#1A1A2E 0%,#2D1B69 100%);
  border-radius:16px;padding:18px 20px;margin-bottom:20px;
  position:relative;overflow:hidden;cursor:default;
}
.week-intent-banner::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top right,rgba(91,79,233,.25),transparent 60%);pointer-events:none}
.wib-icon{font-size:16px;display:block;margin-bottom:8px;opacity:.6}
.wib-text{font-size:15px;font-weight:300;color:#fff;line-height:1.6;font-style:italic;margin-bottom:8px}
.wib-day{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.wib-cta{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#A08FFF;cursor:pointer;margin-top:6px}

/* WEEK VIEW — 7-cube grid */
.week-cube-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  margin-bottom:16px;
}
@media(max-width:600px){
  .week-cube-grid{grid-template-columns:repeat(4,1fr)}
}
.week-cube{
  background:#fff;border-radius:14px;
  padding:12px 8px 10px;
  cursor:pointer;border:1.5px solid transparent;
  transition:all .2s;
  display:flex;flex-direction:column;gap:8px;
  min-height:160px;
}
.week-cube:hover{border-color:#D8D0C8;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.wc-today{border-color:#5B4FE9!important;background:linear-gradient(160deg,#faf9ff 0%,#f0eeff 100%)}
.wc-sel{box-shadow:0 0 0 2px #5B4FE9}
.wc-top{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.wc-day{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.18em;color:#B8B0A8;text-transform:uppercase}
.wc-num{font-size:20px;font-weight:600;color:#1A1A2E;line-height:1}
.wc-today .wc-num{color:#5B4FE9}
.wc-today-dot{width:4px;height:4px;border-radius:50%;background:#5B4FE9;position:absolute;bottom:-4px;left:50%;transform:translateX(-50%)}
/* 6 time-block strips */
.wc-blocks{
  display:flex;flex-direction:column;gap:3px;flex:1;
}
.wc-ev-chip{display:flex;flex-direction:column;gap:1px;background:#F7F4EF;border-radius:5px;padding:3px 5px;overflow:hidden}
.wc-ev-chip-time{font-family:'DM Mono',monospace;font-size:7px;color:#8B93B8;letter-spacing:.03em;line-height:1}
.wc-ev-chip-label{font-size:9px;color:#1A1A2E;font-weight:500;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc-empty-bar{flex:1;display:flex;align-items:center;justify-content:center;color:#D8D0C8;font-size:12px;min-height:24px}
.wc-block{
  height:100%;min-height:12px;border-radius:4px;
  background:#F0EDE8;
  transition:all .2s;flex:1;
}
.wc-block-filled{
  border-radius:4px;
}
/* Footer */
.wc-footer{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:2px}
.wc-chore-pill{font-family:'DM Mono',monospace;font-size:8px;color:#8BA888;background:#F0EDE8;padding:2px 6px;border-radius:8px}
.wc-intent-dot{width:6px;height:6px;border-radius:50%;background:#A08FFF;flex-shrink:0}
.wc-ev-count{font-family:'DM Mono',monospace;font-size:8px;color:#B8B0A8}

/* PLAN VIEW */

/* healthy weight band for a height, widened by 3kg either side */
/* Height is stored in cm, but people type 1.68 meaning metres — that read as
   1.68cm and produced a BMI of 290,532. Normalise once, use everywhere. */
function heightCm(v){
  var s=String(v==null?"":v).trim().toLowerCase().replace(",",".");
  if(!s)return 0;
  var m;
  /* Feet and inches, however people write them:
     5'9  |  5'9"  |  5 ft 9 in  |  5-9  |  5 9  */
  m=s.match(/^(\d{1,2})\s*(?:'|ft|feet|f)\s*(\d{1,2}(?:\.\d+)?)?\s*(?:"|in|inch|inches|'')?$/);
  if(!m)m=s.match(/^(\d)\s*[-\s]\s*(\d{1,2}(?:\.\d+)?)$/);
  if(m){
    var ft=parseFloat(m[1]), inch=m[2]?parseFloat(m[2]):0;
    if(ft>=1&&ft<=8&&inch>=0&&inch<12){
      var cmF=Math.round((ft*12+inch)*2.54);
      return (cmF>=50&&cmF<=260)?cmF:0;
    }
    return 0;
  }
  /* Decimal feet, written as 5.9ft — only when the unit is explicit,
     because a bare 5.9 is ambiguous and 5'9 is the common way to write it */
  m=s.match(/^(\d(?:\.\d+)?)\s*(?:ft|feet)$/);
  if(m){
    var cmD=Math.round(parseFloat(m[1])*30.48);
    return (cmD>=50&&cmD<=260)?cmD:0;
  }
  var n=parseFloat(s.replace(/(cm|m)$/,""));
  if(!(n>0))return 0;
  if(n<3)n=n*100;          /* 1.68 metres -> 168 */
  else if(n<30)return 0;   /* 16.8 is a typo, not a person */
  if(n<50||n>260)return 0; /* outside any plausible human height */
  return Math.round(n);
}
/* how tall that is, in the unit the user prefers */
function heightLabel(v){
  var cm=heightCm(v);
  if(!cm)return "";
  if(ls("dc2-units","c")==="f"){
    var tot=cm/2.54, ft=Math.floor(tot/12), inch=Math.round(tot-ft*12);
    if(inch===12){ft++;inch=0;}
    return ft+"'" + inch + "\"";
  }
  return cm+" cm";
}
function bmiOf(weight,height){
  var w=parseFloat(weight), cm=heightCm(height);
  if(!(w>0)||!cm)return null;
  if(w<20||w>400)return null;   /* a weight that cannot be right */
  var b=w/Math.pow(cm/100,2);
  return (b>=5&&b<=100)?b:null; /* anything outside this is bad input */
}
function healthyBand(cm){
  cm=heightCm(cm);
  if(!cm)return {lo:0,hi:0};
  var m2=Math.pow(cm/100,2);
  return {lo:18.5*m2-3, hi:25*m2+3};
}

function playReceive(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [783.99,1046.5].forEach(function(f,i){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      const t=ctx.currentTime+i*0.08;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.13,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      o.start(t);o.stop(t+0.45);
    });
  }catch(e){}
}

/* ===== REVIEW MOMENTS (Sunday + end of month) ======================
   The moment lasts through the last day of the period and into the next
   day until noon, because people open the app at different hours. The
   figures stay anchored to the period that ended, not to today's clock. */
/* Keyed to the real clock, not the cached T — a PWA resumed the next
   morning has a stale "today", and this moment lives exactly on that
   overnight boundary, so it must read the live date. */
function weekReviewActive(){
  var now=new Date();
  if(now.getDay()===reflectDow())return true;                       /* all of the last day */
  return ((now.getDay()+6)%7)===reflectDow() && now.getHours()<12;  /* next morning, till noon */
}
function weekReviewAnchor(){   /* last day of the week under review */
  var now=new Date();
  return (now.getDay()===reflectDow())?pad(now):addDays(pad(now),-1);
}
function monthReviewActive(){
  var now=new Date();
  if(now.getDate()===lastDayOf(now.getFullYear(),now.getMonth()))return true;
  return now.getDate()===1 && now.getHours()<12;
}
function monthReviewAnchor(){  /* last day of the month under review */
  var now=new Date(),tk=pad(now);
  return (now.getDate()===lastDayOf(now.getFullYear(),now.getMonth()))?tk:addDays(tk,-1);
}
/* the seven days ending at, or the whole calendar month containing, an anchor */
function statsOver(keys){
  var doneC=0,totC=0,lit=0,litDays=0,moods=[],logged=0;
  keys.forEach(function(k){
    var dd=S.data[k], any=false;
    if(dd&&(dd.chores||[]).length){dd.chores.forEach(function(_,ix){totC++;if(done(k,ix)){doneC++;any=true;}});}
    if(S.waterL[k]){lit+=S.waterL[k];litDays++;any=true;}
    if(S.health.moods&&S.health.moods[k]){moods.push(S.health.moods[k]);any=true;}
    if(dd&&((dd.schedule||[]).length||dd.journal))any=true;
    if(any)logged++;
  });
  return{doneC:doneC,totC:totC,avgL:litDays?(lit/litDays):0,moods:moods,logged:logged,span:keys.length};
}
function weekStatsAnchor(anchor){
  var keys=[],d=new Date(anchor+"T12:00:00");
  for(var i=0;i<7;i++){keys.push(pad(d));d.setDate(d.getDate()-1);}
  return statsOver(keys);
}
function monthStatsAnchor(anchor){

/* one press: carry everything you didn't finish into the next period */
function passUndoneForward(mode,anchor){
  var undone=reviewList(mode,anchor).filter(function(t){return !t.done;});
  if(!undone.length){showToast("Nothing left undone \u2726");return;}
  var all=todos(),bucket=aheadBucket(mode,anchor),seen={};
  all.forEach(function(t){if(t.week===bucket)seen[t.text.toLowerCase()]=true;});
  var n=0;
  undone.forEach(function(t){

    all.push({id:Date.now()+(n++),text:t.text,week:bucket,days:[],time:"",done:false});
  });

/* ===== PAINTED CALENDAR (table layout, renders everywhere) ===== */
var DailyPaintedCalendar=(function(){
  'use strict';
  var DAYS=dowLabels("l");
  var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function isLeap(y){return (y%4===0&&y%100!==0)||y%400===0;}
  function daysInMonth(y,m){return [31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m];}
  function firstWeekday(y,m){return dowIdx(new Date(y,m,1));}
  function clampLevel(v){v=Math.round(Number(v));if(!isFinite(v)||v<0)return 0;if(v>4)return 4;return v;}
  function buildHTML(y,m,score,counts){
    var total=daysInMonth(y,m),lead=firstWeekday(y,m),rows=Math.ceil((lead+total)/7);
    var h='<table class="dc2pc-tbl"><thead><tr>';
    for(var i=0;i<7;i++)h+='<th scope="col">'+DAYS[i]+'</th>';
    h+='</tr></thead><tbody>';
    for(var r=0;r<rows;r++){
      h+='<tr>';
      for(var c=0;c<7;c++){
        var day=r*7+c-lead+1;
        if(day<1||day>total){h+='<td class="dc2pc-pad" aria-hidden="true"></td>';}
        else{
          var lvl=clampLevel(score(y,m,day));
          if(lvl>0)counts.active++;
          if(lvl===4)counts.perfect++;
          h+='<td class="dc2pc-l'+lvl+'"><span class="dc2pc-n">'+day+'</span>';
          if(lvl===4)h+='<span class="dc2pc-star">\u2605</span>';
          h+='</td>';
        }
      }
      h+='</tr>';
    }
    h+='</tbody></table>';
    counts.total=total;
    var leg='<ul class="dc2pc-legend">';
    ['Nothing logged','A little','Steady','Strong','Perfect day'].forEach(function(l,i){
      leg+='<li><span class="dc2pc-sw dc2pc-sw'+i+'"></span>'+l+'</li>';
    });
    leg+='</ul>';
    return '<div class="dc2pc"><div class="dc2pc-panel"><div class="dc2pc-head">'+
      '<p class="dc2pc-title">'+MN[m]+' '+y+'</p>'+
      '<p class="dc2pc-sub">'+counts.total+' days \u00b7 '+counts.active+' active \u00b7 '+counts.perfect+' perfect</p>'+
      '</div>'+h+leg+'</div></div>';
  }
  return {buildHTML:buildHTML,isLeap:isLeap,daysInMonth:daysInMonth};
})();

/* ===== scoring: 0 none | 1 little | 2 steady | 3 strong | 4 perfect =====
   Gold requires ALL: every chore done + water >= 1.5L + mood Good/Great */
function monthDayScore(y,m,d){
  var k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  var dd=S.data[k];
  var chores=(dd&&dd.chores)?dd.chores:[];
  var total=chores.length,doneN=0;
  for(var i=0;i<total;i++){if(done(k,i))doneN++;}
  var waterOK=(S.waterL[k]||0)>=prefWaterTarget();
  var mv=(S.health.moods&&S.health.moods[k])?S.health.moods[k]:null;
  var moodOK=(mv==="4"||mv==="5");
  var hasMood=!!mv, hasWater=(S.waterL[k]||0)>0;
  if(doneN===0&&!hasWater&&!hasMood)return 0;
  var ratio=total?(doneN/total):0;
  if(ratio===1&&waterOK&&moodOK)return 4;
  if(ratio>=0.66)return 3;
  if(ratio>=0.33)return 2;
  if(ratio>0||waterOK||hasMood)return 1;
  return 0;
}

function buildMonthlyReport(){
  var mk2=(S.planMonth||T.slice(0,7));
  var y=parseInt(mk2.slice(0,4)),m=parseInt(mk2.slice(5,7))-1;
  var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var monthName=MN[m];
  var dim=DailyPaintedCalendar.daysInMonth(y,m);
  var monthsLeft=11-m;

  function key(d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}

  /* ---- calendar ---- */
  var counts={total:0,active:0,perfect:0};
  var calHTML=DailyPaintedCalendar.buildHTML(y,m,monthDayScore,counts);

  /* ---- numbers ---- */
  var doneTotal=0,choreTotal=0,ratioSum=0,ratioDays=0;
  for(var d=1;d<=dim;d++){
    var k=key(d);var dd=S.data[k];
    if(dd&&dd.chores&&dd.chores.length){
      var t=dd.chores.length,dn=0;
      for(var i=0;i<t;i++){if(done(k,i))dn++;}
      doneTotal+=dn;choreTotal+=t;
      ratioSum+=dn/t;ratioDays++;
    }
  }
  var consistency=ratioDays?Math.round(ratioSum/ratioDays*100):0;

  /* ---- weather from recorded history ---- */
  var wh=ls("dc2-weather",{});
  var wDays=0,tSum=0,hi=null,lo=null,buckets={clear:0,partly:0,rain:0,storm:0};
  for(var d2=1;d2<=dim;d2++){
    var w=wh[key(d2)];
    if(!w)continue;
    wDays++;tSum+=w.t;
    if(hi===null||w.hi>hi)hi=w.hi;
    if(lo===null||w.lo<lo)lo=w.lo;
    var c=w.c;
    if(c===0)buckets.clear++;
    else if(c<=3)buckets.partly++;
    else if(c<=67)buckets.rain++;
    else if(c<=77)buckets.rain++;
    else buckets.storm++;

  var avgT=wDays?Math.round(tSum/wDays):null;
  var wthHTML="";
  if(wDays>0){
    var rows=[["Clear",buckets.clear,"\u2600\ufe0f","linear-gradient(90deg,#F5D083,#E8A03C)"],
              ["Partly cloudy",buckets.partly,"\u26c5","linear-gradient(90deg,#E0A552,#C98A5E)"],
              ["Rainy",buckets.rain,"\ud83c\udf27","linear-gradient(90deg,#5D9BD1,#3B7BC4)"],
              ["Stormy",buckets.storm,"\u26c8","linear-gradient(90deg,#C4553A,#8E3B2C)"]];
    var maxB=Math.max(1,buckets.clear,buckets.partly,buckets.rain,buckets.storm);
    var rHTML="";
    rows.forEach(function(r){
      var pct=Math.round(r[1]/maxB*100);
      rHTML+='<div class="wthrow"><span class="wthic">'+r[2]+'</span><span class="wthname">'+r[0]+'</span>'+
        '<div class="wthtrack"><div class="wthfill" style="width:'+pct+'%;background:'+r[3]+'"></div></div>'+
        '<span class="wthn">'+r[1]+'</span></div>';
    });
    var rainDays=buckets.rain+buckets.storm;
    wthHTML='<div class="wthpanel"><div class="wthinner">'+
      '<div class="wthtag">\u25c8 Monthly weather report</div>'+
      '<div class="wthtop">'+
      '<div class="wthstat"><div class="n">'+fmtTemp(avgT)+'<small>'+tempUnit()+'</small></div><div class="l">Average</div></div>'+
      '<div class="wthstat"><div class="n"><span class="warm">'+fmtTemp(hi)+'\u00b0</span> <span style="color:rgba(245,239,230,.25)">/</span> <span class="cool">'+fmtTemp(lo)+'\u00b0</span></div><div class="l">High / Low</div></div>'+
      '<div class="wthstat"><div class="n">'+rainDays+'<small> days</small></div><div class="l">Rainfall</div></div>'+
      '</div>'+rHTML+
      '<div class="wthline">Recorded across '+wDays+' day'+(wDays===1?'':'s')+' this month.</div>'+
      '</div></div>';
  } else {
    wthHTML='<div class="wthpanel"><div class="wthinner">'+
      '<div class="wthtag">\u25c8 Monthly weather report</div>'+
      '<div class="wthline" style="margin-top:0;padding-top:0;border:none">Weather history begins recording from today. Next month\u2019s report will include a full summary.</div>'+
      '</div></div>';
  }

  /* ---- weekday rhythm ---- */
  var wdSum=[0,0,0,0,0,0,0],wdN=[0,0,0,0,0,0,0];
  for(var d3=1;d3<=dim;d3++){
    var k3=key(d3);var dd3=S.data[k3];
