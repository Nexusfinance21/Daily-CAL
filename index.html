      });
    }
    const tNew=mk("button","target-new");tx(tNew,TMARK+"  Set a new target");
    tNew.addEventListener("click",function(){set({targetWiz:1,tEditId:null,tTitle:"",tDeadline:"",tDays:[],tTime:"08:00",tStrategy:""});});
    scroll.appendChild(tNew);

    // Month header + navigation
    const mh=mk("div","month-hdr");
    const mhLeft=mk("div","");
    const mTitle=mk("div","month-title");tx(mTitle,MONTHS[mDate.getMonth()]+" "+mDate.getFullYear());
    const mSub=mk("div","month-sub");tx(mSub,"Tap twice a day to plan it");
    ap(mhLeft,mTitle,mSub);
    const mNav=mk("div","month-nav");
    const prevB=mk("button","mnav-btn");tx(prevB,"‹");
    prevB.addEventListener("click",function(){
      const d2=new Date(mkey+"-15T12:00:00");d2.setMonth(d2.getMonth()-1);
      set({planMonth:d2.getFullYear()+"-"+z(d2.getMonth()+1)});
    });
    const nextB=mk("button","mnav-btn");tx(nextB,"›");
    nextB.addEventListener("click",function(){
      const d2=new Date(mkey+"-15T12:00:00");d2.setMonth(d2.getMonth()+1);
      set({planMonth:d2.getFullYear()+"-"+z(d2.getMonth()+1)});
    });
    ap(mNav,prevB,nextB);ap(mh,mhLeft,mNav);scroll.appendChild(mh);

    // Calendar grid — workdays highlighted, weekends warm & relaxing
    const grid=mk("div","month-grid");
    dowLabels("n").forEach(function(dw,di){
      const dd2=mk("div","mg-dow"+(isWeekendIdx(di)?" we":""));tx(dd2,dw);
      grid.appendChild(dd2);
    });
    const first=new Date(mkey+"-01T12:00:00");
    const firstDow=dowIdx(first);
    const daysInMonth=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
    for(let e2=0;e2<firstDow;e2++){grid.appendChild(mk("div","mg-day mg-empty"));}
    for(let dn=1;dn<=daysInMonth;dn++){
      const cellDate=new Date(first.getFullYear(),first.getMonth(),dn,12);
      const k=pad(cellDate);
      const dow=dowIdx(cellDate);
      const isWE=isWeekendIdx(dow);
      const isTod=k===T;
      const isPast=k<T;
      const cell=mk("div","mg-day "+(isWE?"mg-weekend":"mg-work")+(isTod?" mg-today":"")+(k===planDay?" mg-sel":"")+(isPast?" mg-past":"")+(k>T?" future":""));
      const num=mk("div","mg-num");tx(num,String(dn));
      cell.appendChild(num);
      const dData=S.data[k];
      const dots=mk("div","mg-dots");
      if(dData&&(dData.schedule||[]).length){const d1=mk("div","mg-dot");d1.style.background="#5B4FE9";dots.appendChild(d1);}
      if(dData&&(dData.chores||[]).length){const d2=mk("div","mg-dot");d2.style.background="#8BA888";dots.appendChild(d2);}
      if(dData&&dData.journal){const d3=mk("div","mg-dot");d3.style.background="#A08FFF";dots.appendChild(d3);}
      cell.appendChild(dots);
      cell.addEventListener("click",function(){
        const now=Date.now();
        if(lastCellTap.k===k&&now-lastCellTap.t<340){
          lastCellTap={k:null,t:0};
          set({sel:k,nav:"today",tab:"chores"});return;
        }
        lastCellTap={k:k,t:now};
        set({planDay:k});
      });
      grid.appendChild(cell);
    }
    scroll.appendChild(grid);

    const pd=day(planDay);
    const planDateObj=new Date(planDay+"T12:00:00");
    const ph=mk("div","plan-header");
    const ptitle=mk("div","plan-title");tx(ptitle,DAYS[planDateObj.getDay()]+", "+planDateObj.getDate()+" "+MONTHS[planDateObj.getMonth()]);
    const psub=mk("div","plan-sub");tx(psub,"Planning this day");
    ap(ph,ptitle,psub);scroll.appendChild(ph);

    /* Two lists here, doing different jobs: the day panel collects what has
       to happen on THAT day (each becomes an event), and below it a month
       list holds the things that just have to happen sometime this month. */
    buildWeekTodo(scroll,"day");
    buildWeekTodo(scroll,"month");

    if(!isDesktop()){
      const sl4=mk("div","slbl");tx(sl4,"health");scroll.appendChild(sl4);
      const hbTrig=mk("button","healthbar-trigger");
      const hbi=mk("span","hbt-icon");tx(hbi,"❤️");
      const hbt=mk("div","hbt-text");
      const hbtt=mk("div","hbt-title");tx(hbtt,"Open Health Bar");
      const hbts=mk("div","hbt-sub");tx(hbts,"Log weight, mood & more");
      ap(hbt,hbtt,hbts);
      const hba=mk("span","hbt-arrow");tx(hba,"→");
      ap(hbTrig,hbi,hbt,hba);
      hbTrig.addEventListener("click",function(){healthScrollTop=0;set({healthModal:true});});
      scroll.appendChild(hbTrig);
      buildGoalTrigger(scroll);
    }

    const sl5=mk("div","slbl");tx(sl5,"intention for "+MONTHS[mDate.getMonth()]);scroll.appendChild(sl5);
    const mset=String(S.mIntent[mkey]||"").trim();
    const mEditing=(!mset)||S.mEdit===mkey;
    const mcard=mk("div","mcard");
    const mlbl=mk("div","mcard-lbl");tx(mlbl,"Theme for the month");
    mcard.appendChild(mlbl);
    const mq=mk("div","mcard-q");
    tx(mq,"What's the bigger picture this "+MONTHS[mDate.getMonth()]+"?");
    mcard.appendChild(mq);
    if(mEditing){
      const mta=mk("textarea","mcard-ta");mta.placeholder="Take your time…";mta.rows=3;
      mta.value=S.mDraft[mkey]!==undefined?S.mDraft[mkey]:mset;
      mta.addEventListener("input",function(e){S.mDraft[mkey]=e.target.value;});
      mcard.appendChild(mta);
      const msave=mk("button","mcard-save");
      tx(msave,mset?"Update theme ✦":"Set month theme ✦");
      msave.addEventListener("click",function(){saveMonthIntent(mkey);});
      mcard.appendChild(msave);
    } else {
      const fr=mk("div","mcard-frame");tx(fr,mset);mcard.appendChild(fr);
      const eb=mk("button","mcard-edit");tx(eb,"✎ edit");
      eb.addEventListener("click",function(){S.mDraft[mkey]=mset;set({mEdit:mkey});});
      mcard.appendChild(eb);
    }
    scroll.appendChild(mcard);
  }

  target.appendChild(scroll);

  if(contentArea)wrap.appendChild(contentArea);

  // ── DESKTOP RIGHT PANEL — contextual per view ──
  if(isDesktop()){
    const rp=mk("div","");rp.id="right-panel";

    if(nav==="today"){
      // Weekly view (pressable → Week) + water
      const rpHdr=mk("div","rp-hdr");tx(rpHdr,"This week");rp.appendChild(rpHdr);
      const wkWrap=mk("div","rp-pressable");
      wd.forEach(function(d){
        const k=pad(d);const data=S.data[k]||{chores:defaultsFor(k),schedule:[],journal:"",temp:"--"};const isT=k===T;
        const card=mk("div","wcard"+(isT?" today":""));
        card.style.marginBottom="8px";card.style.pointerEvents="none";
        const top2=mk("div","wcard-top");
        const left=mk("div","");
        const wname=mk("span","wcard-name");tx(wname,DAYS[d.getDay()]);
        const wsub=mk("span","wcard-sub");tx(wsub,String(d.getDate()));
        ap(left,wname,wsub);
        if(isT){const badge=mk("span","badge");tx(badge,"Today");left.appendChild(badge);}
        ap(top2,left);card.appendChild(top2);
        if((data.schedule||[]).length){
          const tgs=mk("div","tags");
          (data.schedule||[]).slice(0,2).forEach(function(s){const t=mk("span","tag");tx(t,s.time+" "+s.label);tgs.appendChild(t);});
          card.appendChild(tgs);
        }
        const dnCnt=(data.chores||[]).filter(function(_,i){return done(k,i);}).length;
        if((data.chores||[]).length){const wcd=mk("div","wcard-done");tx(wcd,"✓ "+dnCnt+"/"+(data.chores||[]).length);card.appendChild(wcd);}
        wkWrap.appendChild(card);
      });
      const hint=mk("div","rp-press-hint");tx(hint,"Tap to open week →");
      wkWrap.appendChild(hint);
      wkWrap.addEventListener("click",function(){navTo("week");});
      rp.appendChild(wkWrap);
      const mh=mk("div","rp-hdr");mh.style.marginTop="18px";tx(mh,"Mood");rp.appendChild(mh);
      buildMoodRow(rp,true);
      buildWaterCard(rp);

    } else if(nav==="week"){
      // Monthly calendar (pressable → Plan) + hero only
      const rpHdr=mk("div","rp-hdr");tx(rpHdr,"This month");rp.appendChild(rpHdr);
      const calWrap=mk("div","rp-pressable");
      buildMiniMonth(calWrap);
      const hint=mk("div","rp-press-hint");tx(hint,"Tap to open plan →");
      calWrap.appendChild(hint);
      calWrap.addEventListener("click",function(){navTo("plan");});
      rp.appendChild(calWrap);
      // hero only — opens health popup
      const hero=mk("div","health-hero");hero.style.marginTop="16px";
      const hl=mk("div","hh-lbl");tx(hl,"Year in Health");
      const ht=mk("div","hh-title");tx(ht,"Your body, tracked all year");
      const hs=mk("div","hh-sub");tx(hs,"Log daily. Get a full performance report every December.");
      const hc=mk("div","hh-cta");tx(hc,"Start tracking →");
      ap(hero,hl,ht,hs,hc);
      hero.addEventListener("click",function(){healthScrollTop=0;set({healthModal:true});});
      rp.appendChild(hero);

    } else if(nav==="plan"){
      // Day preview
      const pdd=day(planDay);
      const pdDate=new Date(planDay+"T12:00:00");
      const dph=mk("div","dp-hdr");tx(dph,"The day ahead");rp.appendChild(dph);
      const dpt=mk("div","dp-title");tx(dpt,DAYS[pdDate.getDay()]+", "+pdDate.getDate()+" "+MONTHS[pdDate.getMonth()]);rp.appendChild(dpt);
      const dps=mk("div","dp-sub");
      var nEv=(pdd.schedule||[]).length, nCh=(pdd.chores||[]).length;
      tx(dps,nEv+" event"+(nEv===1?"":"s")+" · "+nCh+" chore"+(nCh===1?"":"s"));
      rp.appendChild(dps);
      if((pdd.schedule||[]).length){
        const s1=mk("div","dp-sec");tx(s1,"On the schedule");rp.appendChild(s1);
        pdd.schedule.forEach(function(ev){
          const row=mk("div","dp-ev");
          const t=mk("span","dp-ev-time");tx(t,ev.time||"·");
          const l=mk("span","dp-ev-label");tx(l,ev.label);
          ap(row,t,l);rp.appendChild(row);
        });
      }
      if((pdd.chores||[]).length){
        const s2=mk("div","dp-sec");tx(s2,"Chores");rp.appendChild(s2);
        pdd.chores.forEach(function(c){
          const row=mk("div","dp-chore");
          const dot=mk("div","dp-chore-dot");const s=mk("span","");tx(s,c);
          ap(row,dot,s);rp.appendChild(row);
        });
      }
      if(!(pdd.schedule||[]).length&&!(pdd.chores||[]).length){
        const em=mk("div","dp-empty");tx(em,"Nothing planned yet. Tap ＋ to start.");rp.appendChild(em);
      }
      // Health bar trigger in right panel
      const hbTrigger=mk("button","healthbar-trigger");hbTrigger.style.marginTop="20px";
      const hbIcon=mk("span","hbt-icon");tx(hbIcon,"❤️");
      const hbText=mk("div","hbt-text");
      const hbTitle=mk("div","hbt-title");tx(hbTitle,"Open Health Bar");
      const hbSub=mk("div","hbt-sub");tx(hbSub,"Log weight, mood & more");
      ap(hbText,hbTitle,hbSub);
      const hbArrow=mk("span","hbt-arrow");tx(hbArrow,"→");
      ap(hbTrigger,hbIcon,hbText,hbArrow);
      hbTrigger.addEventListener("click",function(){healthScrollTop=0;set({healthModal:true});});
      rp.appendChild(hbTrigger);
      buildGoalTrigger(rp);
    }
    wrap.appendChild(rp);
  }

  // ── PHONE BOTTOM NAV ──
  if(!isTablet()){
    const bnav=mk("div","");bnav.id="bnav";
    [["today","📅","Today"],["week","🗓","Week"],["plan","✏️","Month"]].forEach(function(item){
      const btn=mk("button","nbtn"+(nav===item[0]?" on":""));
      const iconWrap=mk("div","nbtn-icon");
      const icon=mk("span","");tx(icon,item[1]);
      iconWrap.appendChild(icon);
      const lbl=mk("span","nlbl");tx(lbl,item[2]);
      ap(btn,iconWrap,lbl);
      btn.addEventListener("click",function(){navTo(item[0]);});
      bnav.appendChild(btn);
    });
    wrap.appendChild(bnav);
  }
  buildBaselineArt(wrap);
  return wrap;
}

/* Weather menu: opened from the sidebar widget. The week's forecast, with a
   quiet secondary option to view somewhere else. */
function renderWxMenu(){
  var w=S.weather;
  var ov=mk("div","ritual-overlay daypick-ov");
  ov.addEventListener("click",function(){set({wxMenu:false});});
  var card=mk("div","wx-card");
  card.addEventListener("click",function(e){e.stopPropagation();});

  var head=mk("div","wx-head");
  var hcity=mk("div","wx-city");tx(hcity,w.ok?w.city:"\u2014");
  var hrow=mk("div","wx-nowrow");
  var htemp=mk("div","wx-temp");tx(htemp,w.ok?(fmtTemp(w.temp)+"\u00b0"):"\u2014");
  var hcond=mk("div","wx-cond");tx(hcond,w.ok?(w.icon+"  "+w.cond):"");
  ap(hrow,htemp,hcond);ap(head,hcity,hrow);card.appendChild(head);

  if(w.ok&&w.daily&&w.daily.length){
    var list=mk("div","wx-list");
    w.daily.slice(0,7).forEach(function(f){
      var dd=new Date(f.day+"T12:00:00");
      var row=mk("div","wx-row");
      var dl=mk("span","wx-day");tx(dl,f.day===T?"Today":DAYFULL[dd.getDay()]);
      var ic=mk("span","wx-ic");tx(ic,wIcon(f.code));
      var hi=mk("span","wx-hi");tx(hi,f.hi!=null?(fmtTemp(f.hi)+"\u00b0"):"\u2014");
      var lo=mk("span","wx-lo");tx(lo,f.lo!=null?(fmtTemp(f.lo)+"\u00b0"):"");
      ap(row,dl,ic,hi,lo);list.appendChild(row);
    });
    card.appendChild(list);
  } else {
    var em=mk("div","wx-empty");tx(em,w.ok?"No forecast yet.":"Locating\u2026");card.appendChild(em);
  }

  var loc=mk("button","wx-loc");tx(loc,"Change location");
  loc.addEventListener("click",function(){set({wxMenu:false,placePick:true,placeQuery:"",placeErr:""});});
  card.appendChild(loc);

  var done=mk("button","wx-done");tx(done,"Done");
  done.addEventListener("click",function(){set({wxMenu:false});});
  card.appendChild(done);

  ov.appendChild(card);
  return ov;
}

  const tlbl=mk("div","");tlbl.style.cssText="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;color:#B8B0A8;text-transform:uppercase;margin-bottom:6px;text-align:left";
  tx(tlbl,"Starts · optional");

  tx(elbl,"Ends · optional");

  const menu=mk("div","action-menu");

  items.forEach(function(item,i){
    if(i>0){menu.appendChild(mk("div","action-menu-divider"));}
    const btn=mk("button","action-menu-item"+(item.danger?" danger":""));
    tx(btn,item.icon+" "+item.label);
    btn.addEventListener("click",function(){set({actionMenu:null});item.action();});
    menu.appendChild(btn);
  });
  frag.appendChild(ov);frag.appendChild(menu);
  return frag;
}

/* Sheets are rebuilt on every render, so their scroll position has to be
   remembered outside the DOM — otherwise a toast throws you back to the top. */
var setScrollTop=0,healthScrollTop=0;
function render(){
  const root=document.getElementById("app");
  const prevScroll=root.querySelector(".scroll");
  const savedTop=prevScroll?prevScroll.scrollTop:0;
  const prevSet=root.querySelector(".set-card");
  if(prevSet)setScrollTop=prevSet.scrollTop;
  const prevHealth=root.querySelector(".health-modal");
  if(prevHealth)healthScrollTop=prevHealth.scrollTop;
  root.innerHTML="";
  const mainEl=S.view==="lock"?renderLock():renderMain();
  if(S.navAnim){mainEl.classList.add("nav-animating");}
  if(S.navEntering==="right"){mainEl.classList.add("nav-entering");}
  if(S.navEntering==="left"){mainEl.classList.add("nav-entering-left");}
  root.appendChild(mainEl);
  if(S.modal)root.appendChild(renderModal());
  if(S.wxMenu)root.appendChild(renderWxMenu());
  if(S.ritual)root.appendChild(renderRitual());
  if(S.targetWiz)root.appendChild(renderTargetWiz());
  if(S.exportMenu){
    const eov=mk("div","ritual-overlay");
    eov.addEventListener("click",function(){set({exportMenu:false});});
    const ecard=mk("div","ritual-card");
    ecard.addEventListener("click",function(e){e.stopPropagation();});
    const elb=mk("div","ritual-step");tx(elb,"⬇ Download your data");
    ecard.appendChild(elb);
    const eq=mk("div","ritual-q");eq.style.fontSize="17px";tx(eq,"Choose your report");
    ecard.appendChild(eq);
    function expRow(ico,title,sub,badge,badgeCls,locked,fn,note){
      const r=mk("button","exp-row"+(locked?" locked":""));
      const i=mk("span","exp-ico");tx(i,ico);
      const t=mk("div","exp-t");
      const tt=mk("div","exp-title");tx(tt,title);
      const ts=mk("div","exp-sub");tx(ts,sub);
      ap(t,tt,ts);
      if(note){const nn=mk("div","exp-note");tx(nn,note[0]+" ");
        const nb=mk("b","");tx(nb,note[1]);nn.appendChild(nb);t.appendChild(nn);}
      const b=mk("span","exp-badge "+badgeCls);tx(b,badge);
      ap(r,i,t,b);
      r.addEventListener("click",fn);
      return r;
    }
    ecard.appendChild(expRow("🩺","Health Report","For your doctor · PDF","Free","free",false,function(){
      set({exportMenu:false});buildHealthReport();
    }));
    ecard.appendChild(expRow("📄","Daily","Pick a day · PDF","Free","free",false,function(){
      set({exportMenu:false});openPeriodPicker("daily");
    }));
    ecard.appendChild(expRow("📊","Monthly","Pick a month · trends & habits","Plus","plus",true,function(){
      set({exportMenu:false});openPeriodPicker("monthly");
    }));
    ecard.appendChild(expRow("🏆","Yearly","Pick a year · arc, weather, patterns, letter","Plus","plus",true,function(){
      set({exportMenu:false});openPeriodPicker("yearly");
    },["Issued","Dec to Feb"]));
    const ecl=mk("button","ritual-skip");tx(ecl,"Close");
    ecl.addEventListener("click",function(){set({exportMenu:false});});
    ecard.appendChild(ecl);
    eov.appendChild(ecard);
    root.appendChild(eov);
  }
  if(S.settingsMenu){buildSettings(root);}
  if(S.goalsOpen)buildGoalsView(root);
  if(S.goalWiz)root.appendChild(renderGoalWiz());
  if(S.todoWhen)root.appendChild(renderTodoWhen());
  if(S.dayView)buildDayView(root);
  if(S.waterSheet){
    const wov=mk("div","ritual-overlay daypick-ov");
    wov.addEventListener("click",function(){set({waterSheet:false});});
    const wc=mk("div","ritual-card");
    wc.addEventListener("click",function(e){e.stopPropagation();});
    const ws2=mk("div","ritual-step");tx(ws2,"\u25c8 Hydration");wc.appendChild(ws2);
    const wq=mk("div","ritual-q");tx(wq,"How much water so far?");wc.appendChild(wq);
    buildWaterBar(wc);
    const wfb=waterFeedback(S.waterL[T]||0);
    const wn=mk("div","");
    wn.style.cssText="text-align:center;font-size:12px;font-style:italic;margin-bottom:14px;color:"+wfb.col;
    tx(wn,wfb.msg);wc.appendChild(wn);
    const wd=mk("button","ritual-next");tx(wd,"Done");
    wd.addEventListener("click",function(){set({waterSheet:false});});
    wc.appendChild(wd);
    wov.appendChild(wc);root.appendChild(wov);
  }
  if(S.emailAsk)root.appendChild(renderEmailAsk());
  if(S.periodPick)root.appendChild(renderPeriodPicker());
  if(S.placePick)root.appendChild(renderPlacePick());
  if(S.adding)buildAddWarp(root);
  if(S.moodSheet){
    const mov=mk("div","ritual-overlay daypick-ov");
    mov.addEventListener("click",function(){set({moodSheet:false});});
    const mc=mk("div","ritual-card");
    mc.addEventListener("click",function(e){e.stopPropagation();});
    const ms=mk("div","ritual-step");tx(ms,"◈ Mood");mc.appendChild(ms);
    const mq=mk("div","ritual-q");
    tx(mq,"How are you feeling"+(S.userName?", "+S.userName:"")+"?");mc.appendChild(mq);
    const mrow=mk("div","ritual-moods");
    [["1","😞","Very bad"],["2","😕","Bad"],["3","😐","I'm okay"],
     ["4","🙂","Good"],["5","😄","Great"]].forEach(function(m){
      const b=mk("button","ritual-mood");
      const f=mk("span","face");tx(f,m[1]);
      const l=mk("span","lbl");tx(l,m[2]);
      ap(b,f,l);
      b.addEventListener("click",function(){setMood(m[0]);});
      mrow.appendChild(b);
    });
    mc.appendChild(mrow);
    const msk=mk("button","ritual-skip");tx(msk,"Not now");
    msk.addEventListener("click",function(){set({moodSheet:false});});
    mc.appendChild(msk);
    mov.appendChild(mc);root.appendChild(mov);
  }
  if(S.dayPick){
    const dp=S.dayPick;
    const dov=mk("div","ritual-overlay daypick-ov");
    dov.addEventListener("click",function(){set({dayPick:null,settingsMenu:(dp.edit&&!dp.rename)?true:false});});
    const dcard=mk("div","ritual-card");
    dcard.addEventListener("click",function(e){e.stopPropagation();});
    const dstep=mk("div","ritual-step");
    tx(dstep,dp.rename?"\u25c8 Edit chore":dp.edit?"\u25c8 Chore days":"\u25c8 New chore");
    dcard.appendChild(dstep);
    const dq=mk("div","ritual-q");
    tx(dq,dp.rename?"Rename it, or change its days":"Which days for \u201c"+dp.name+"\u201d?");
    dcard.appendChild(dq);
    if(dp.rename){
      const nin=mk("input","minput");nin.type="text";nin.value=dp.name;nin.placeholder="Chore name";
      nin.addEventListener("input",function(e){dp.name=e.target.value;});
      dcard.appendChild(nin);
    }

    /* chips follow the user\u2019s week start */
    const dnames=dowLabels("n");
    const dchips=mk("div","tchips");
    for(let i=0;i<7;i++){
      const real=(prefWeekStart()==="sun")?i:((i+1)%7);
      const on=dp.days.indexOf(real)>=0;
      const c=mk("button","tchip"+(on?" on":""));tx(c,dnames[i]);
      c.addEventListener("click",function(){
        const j=dp.days.indexOf(real);
        if(j>=0)dp.days.splice(j,1);else dp.days.push(real);
        render();
      });
      dchips.appendChild(c);
    }
    dcard.appendChild(dchips);

    const dall=mk("button","ritual-sub-btn");
    dall.style.cssText="display:block;margin:0 auto 16px";
    tx(dall,dp.days.length===7?"Clear all":"Every day");
    dall.addEventListener("click",function(){
      dp.days=(dp.days.length===7)?[]:[0,1,2,3,4,5,6];render();
    });
    dcard.appendChild(dall);

    const dgo=mk("button","ritual-next");
    tx(dgo,dp.rename?"Save changes":dp.edit?"Save days":"Add on these days");
    dgo.addEventListener("click",function(){
      if(dp.rename){
        if(!String(dp.name||"").trim()){showToast("Name can't be empty");return;}
        editChoreSave(dp.srcDay,dp.orig,dp.name,dp.days);
        return;
      }
      if(!dp.days.length){showToast("Pick at least one day");return;}
      applyChoreDays(dp.name,dp.days,dp.edit?T:dp.dest);
      set({dayPick:null,settingsMenu:dp.edit?true:false});
      showToast(dp.days.length===7?"Added to every day \u2713"
        :"Added on "+dp.days.length+" day"+(dp.days.length===1?"":"s")+" \u2713");
    });
    dcard.appendChild(dgo);

    if(!dp.edit){
      const donce=mk("button","ritual-sub-btn");
      donce.style.cssText="display:block;width:100%;margin-top:9px;text-align:center";
      tx(donce,"Just this day");
      donce.addEventListener("click",function(){
        putChore(dp.dest,dp.name);
        set({dayPick:null});showToast("Added \u2713");
      });
      dcard.appendChild(donce);
    }

    const dcx=mk("button","ritual-skip");tx(dcx,"Cancel");
    dcx.addEventListener("click",function(){set({dayPick:null,settingsMenu:(dp.edit&&!dp.rename)?true:false});});
    dcard.appendChild(dcx);
    dov.appendChild(dcard);root.appendChild(dov);
  }
  if(S.reviewMode){
    const rmode=S.reviewMode, rstep=S.reviewStep||1;
    const ranchor=(rmode==="month")?monthReviewAnchor():weekReviewAnchor();
    const rst=reviewStats(rmode,ranchor);
    const rov=mk("div","ritual-overlay ltr-ov");
    rov.addEventListener("click",function(){set({reviewMode:null,reviewStep:1});});
    const rcard=mk("div","ritual-card ltr-card");
    rcard.addEventListener("click",function(e){e.stopPropagation();});
    rcard.appendChild(mk("div","ltr-seal"));

    const xb=mk("button","wr-x");tx(xb,"\u00d7");
    xb.addEventListener("click",function(){set({reviewMode:null,reviewStep:1});});
    rcard.appendChild(xb);

    const rin=mk("div","ltr-in");

    const rdate=mk("div","ltr-date");
    if(rmode==="month"){
      const md=new Date(ranchor+"T12:00:00");
      tx(rdate,MONTHS[md.getMonth()]+" "+md.getFullYear());
    } else {
      const s=new Date(addDays(ranchor,-6)+"T12:00:00"), e=new Date(ranchor+"T12:00:00");
      tx(rdate,s.getDate()+(s.getMonth()===e.getMonth()?"":" "+MONTHS[s.getMonth()].slice(0,3))+
        " \u2013 "+e.getDate()+" "+MONTHS[e.getMonth()]);
    }
    rin.appendChild(rdate);

    if(rstep===1){
      /* ---- PART 1: the review, and only this ---- */
      const rhi=mk("div","ltr-hi");
      tx(rhi,rmode==="month"?"Your month, reviewed":"Your week, reviewed");
      rin.appendChild(rhi);

      const wtgt=prefWaterTarget();
      const daysDen=rst.span;
      const figs=[
        ["lf1",String(rst.doneC),"/"+rst.totC,"chores done",rst.totC?rst.doneC/rst.totC:0],
        ["lf2",rst.avgL.toFixed(1),"L","water a day",Math.min(1,rst.avgL/wtgt)],
        ["lf3",String(rst.logged),"/"+daysDen,"days logged",rst.logged/daysDen]
      ];
      const rfg=mk("div","ltr-figs");
      figs.forEach(function(f){
        const fw=mk("div","ltr-fig "+f[0]);
        const fn=mk("div","n");tx(fn,f[1]);
        const fe=mk("em","");tx(fe,f[2]);fn.appendChild(fe);
        const fb=mk("div","bar");
        const fi=mk("i","");fi.style.width=Math.round(Math.max(0,Math.min(1,f[4]))*100)+"%";
        fb.appendChild(fi);
        const fl=mk("div","l");tx(fl,f[3]);
        ap(fw,fn,fb,fl);rfg.appendChild(fw);
      });
      rin.appendChild(rfg);

      const review=reviewList(rmode,ranchor);
      const revDone=review.filter(function(t){return t.done;}).length;
      const rlbl=mk("div","wr-lbl");tx(rlbl,"What you set out to do");
      if(review.length){const cap=mk("span","wr-cap");tx(cap," \u00b7 "+revDone+" of "+review.length+" done");rlbl.appendChild(cap);}
      rin.appendChild(rlbl);
      if(review.length){
        review.forEach(function(t){
          const row=mk("div","todo-item"+(t.done?" done":""));
          row.style.cursor="pointer";
          const chk=mk("div","todo-chk");tx(chk,t.done?"\u2713":"");
          const txt=mk("span","todo-t");tx(txt,t.text);
          ap(row,chk,txt);
          row.addEventListener("click",function(){todoToggle(t.id);});
          rin.appendChild(row);
        });
      } else {
        const em=mk("div","todo-empty");
        tx(em,rmode==="month"?"No plans were set for this month.":"No plans were set for this week.");
        rin.appendChild(em);
      }

      const cont=mk("button","ltr-btn");
      tx(cont,rmode==="month"?"Plan the month ahead \u2192":"Plan the week ahead \u2192");
      cont.addEventListener("click",function(){set({reviewStep:2});});
      rin.appendChild(cont);

    } else {
      /* ---- PART 2: the period ahead ---- */
      const rhi=mk("div","ltr-hi");
      tx(rhi,rmode==="month"?"The month ahead":"The week ahead");
      rin.appendChild(rhi);

      const review=reviewList(rmode,ranchor);
      const undone=review.filter(function(t){return !t.done;}).length;
      if(undone){
        const pass=mk("button","wr-pass");
        tx(pass,"\u21b3  Pass "+undone+" undone to "+(rmode==="month"?"next month":"next week"));
        pass.addEventListener("click",function(){passUndoneForward(rmode,ranchor);});
        rin.appendChild(pass);
      }

      const ahead=aheadList(rmode,ranchor);
      ahead.forEach(function(t){
        const row=mk("div","gnote");
        row.appendChild(mk("div","dot"));
        const tt=mk("div","tx");tx(tt,t.text);
        const x=mk("button","todo-x");tx(x,"\u00d7");
        x.addEventListener("click",function(){todoRemove(t.id);});
        ap(row,tt,x);rin.appendChild(row);
      });
      const arow=mk("div","todo-row");arow.style.marginTop="10px";
      const ainp=mk("input","todo-inp");ainp.type="text";
      ainp.placeholder=rmode==="month"?"Add something for next month\u2026":"Add something for next week\u2026";
      ainp.value=S.reviewDraft||"";
      ainp.addEventListener("input",function(e){S.reviewDraft=e.target.value;});
      function addAhead(){
        if(reviewPlanAdd(rmode,ranchor,S.reviewDraft)){S.reviewDraft="";render();}
        else showToast("Type it first");
      }
      ainp.addEventListener("keydown",function(e){if(e.key==="Enter")addAhead();});
      const aadd=mk("button","todo-add");tx(aadd,"Add");
      aadd.addEventListener("click",addAhead);
      ap(arow,ainp,aadd);rin.appendChild(arow);

      const dl=mk("button","wr-dl");
      tx(dl,rmode==="month"?"\u2193  Download monthly review":"\u2193  Download weekly report");
      dl.addEventListener("click",function(){buildPeriodReport(rmode,ranchor);});
      rin.appendChild(dl);

      const thanks=mk("button","ltr-btn");tx(thanks,"Thank you");
      thanks.addEventListener("click",function(){set({reviewMode:null,reviewStep:1});});
      rin.appendChild(thanks);

      const back=mk("button","ritual-skip");tx(back,"\u2190 Back");
      back.addEventListener("click",function(){set({reviewStep:1});});
      rin.appendChild(back);
    }

    rcard.appendChild(rin);
    rov.appendChild(rcard);
    root.appendChild(rov);
  }
  if(S.healthModal){
    const ov=mk("div","health-modal-overlay");
    ov.addEventListener("click",function(){
      if(S.backToSettings)set({healthModal:false,backToSettings:false,settingsMenu:true});
      else set({healthModal:false});
    });
    ov.appendChild(buildHealthModalContent());
    root.appendChild(ov);
  }
  if(S.actionMenu)root.appendChild(renderActionMenu());
  if(S.confirmMsg)root.appendChild(renderConfirm());
  if(S.toast){const t=mk("div","toast");tx(t,S.toast);root.appendChild(t);}
  if(savedTop>0&&!S.navAnim){const ns=root.querySelector(".scroll");if(ns)ns.scrollTop=savedTop;}
  if(setScrollTop>0){const nsc=root.querySelector(".set-card");if(nsc)nsc.scrollTop=setScrollTop;}
  if(healthScrollTop>0){const nhm=root.querySelector(".health-modal");if(nhm)nhm.scrollTop=healthScrollTop;}
}

let resizeTimer=null;
let lastW=window.innerWidth;
window.addEventListener("resize",function(){
  var w=window.innerWidth;
  var crossed=(lastW<768)!==(w<768)||(lastW<1200)!==(w<1200);
  lastW=w;
  if(!crossed)return;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(render,150);
});

// ── TRUE VIEWPORT HEIGHT ──
// Measure the device's real visible height in pixels and drive all layout from it.
// window.innerHeight is always correct — no vh/dvh guessing, no gaps.
// Rebuild cleanly when returning from another app (iOS restore fix)
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){setTimeout(render,80);}
});
window.addEventListener("pageshow",function(){setTimeout(render,80);});

render();
fetchWeather();
startClock();
// Reveal once first paint has settled
setTimeout(function(){document.documentElement.classList.add("app-ready");},160);
// One-time self-heal: force a fresh layout pass after iOS finishes settling
setTimeout(render,450);
</script>
</body>
