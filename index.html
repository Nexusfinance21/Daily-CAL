/* ===== YEARLY REPORT (Plus) =====================================
   Issued December\u2013February only. Dec -> the year now ending;
   Jan/Feb -> the year that just ended. Needs >= 6 months of data.
   ================================================================ */

function escH(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* which year a yearly report covers right now, or null if out of window */
function yearlyWindow(){
  var d=new Date(T+"T12:00:00");
  var m=d.getMonth(), y=d.getFullYear();
  if(m===11)return y;
  if(m===0||m===1)return y-1;
  return null;
}
function yearlyOpen(){return yearlyWindow()!==null;}

function buildYearlyReport(){
  var W=yearlyWindow();
  var nowY=new Date(T+"T12:00:00").getFullYear();
  /* in window: that year. Outside: Plus sees this year in progress,
     everyone else sees last complete year as a locked preview. */
  var Y=(W!==null)?W:(isPlus()?nowY:nowY-1);

  var MN=["January","February","March","April","May","June",
          "July","August","September","October","November","December"];
  var MI=["J","F","M","A","M","J","J","A","S","O","N","D"];
  var WD=dowLabels("n");
  var SEASON=[
    "linear-gradient(180deg,#7FB6E4,#4A78B8)","linear-gradient(180deg,#7FB6E4,#4A78B8)",
    "linear-gradient(180deg,#6FD4C0,#35A08C)","linear-gradient(180deg,#6FD4C0,#35A08C)",
    "linear-gradient(180deg,#6FD4C0,#35A08C)","linear-gradient(180deg,#F7DE9C,#E09B3C)",
    "linear-gradient(180deg,#F7DE9C,#E09B3C)","linear-gradient(180deg,#F7DE9C,#E09B3C)",
    "linear-gradient(180deg,#E5A06A,#C4653A)","linear-gradient(180deg,#E5A06A,#C4653A)",
    "linear-gradient(180deg,#E5A06A,#C4653A)","linear-gradient(180deg,#7FB6E4,#4A78B8)"
  ];

  function isLeapY(y){return (y%4===0&&y%100!==0)||y%400===0;}
  function dimY(y,m){return [31,isLeapY(y)?29:28,31,30,31,30,31,31,30,31,30,31][m];}
  function kY(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
  var totalDays=isLeapY(Y)?366:365;

  /* ---------- per-month + yearly totals ---------- */
  var mPct=[],mPerfect=[],mHas=[],monthsWithData=0;
  var doneTotal=0,daysLogged=0,perfectTotal=0,ratioSum=0,ratioDays=0;

  for(var m=0;m<12;m++){
    var rs=0,rn=0,pf=0,any=0;
    for(var d=1;d<=dimY(Y,m);d++){
      var k=kY(Y,m,d), dd=S.data[k];
      var sc=monthDayScore(Y,m,d);
      if(sc>0){daysLogged++;any++;}
      if(sc===4){pf++;perfectTotal++;}
      if(dd&&dd.chores&&dd.chores.length){
        var t=dd.chores.length,dn=0;
        for(var i=0;i<t;i++){if(done(k,i))dn++;}
        doneTotal+=dn;rs+=dn/t;rn++;ratioSum+=dn/t;ratioDays++;
      }
    }
    mPct[m]=rn?Math.round(rs/rn*100):0;
    mPerfect[m]=pf;
    mHas[m]=any>0;
    if(any>0)monthsWithData++;
  }
  var yearPct=ratioDays?Math.round(ratioSum/ratioDays*100):0;

  var thinMode=(monthsWithData<6);

  /* ---------- longest streak (same rule as the app's flame chip) ---------- */
  var streak=0,run=0;
  for(var m2=0;m2<12;m2++){
    for(var d2=1;d2<=dimY(Y,m2);d2++){
      if(choreDayComplete(kY(Y,m2,d2))){run++;if(run>streak)streak=run;}
      else run=0;
    }
  }

  /* ---------- best / hardest month ---------- */
  var bestM=-1,worstM=-1;
  for(var m3=0;m3<12;m3++){
    if(!mHas[m3])continue;
    if(bestM<0||mPct[m3]>mPct[bestM])bestM=m3;
    if(worstM<0||mPct[m3]<mPct[worstM])worstM=m3;
  }
  if(bestM<0){bestM=0;worstM=0;}

  /* ---------- weather ---------- */
  var wh=ls("dc2-weather",{});
  var wDays=0,hiV=null,hiD="",loV=null,loD="";
  var bk={clear:0,partly:0,rain:0,storm:0};
  var tSum=[],tN=[];
  for(var z=0;z<12;z++){tSum[z]=0;tN[z]=0;}
  for(var m4=0;m4<12;m4++){
    for(var d4=1;d4<=dimY(Y,m4);d4++){
      var w=wh[kY(Y,m4,d4)];
      if(!w)continue;
      wDays++;tSum[m4]+=w.t;tN[m4]++;
      if(hiV===null||w.hi>hiV){hiV=w.hi;hiD=d4+" "+MN[m4];}
      if(loV===null||w.lo<loV){loV=w.lo;loD=d4+" "+MN[m4];}
      var c=w.c;
      if(c===0)bk.clear++;
      else if(c<=3)bk.partly++;
      else if(c<=77)bk.rain++;
      else bk.storm++;
    }
  }
  var rainDays=bk.rain+bk.storm;
  var tAvgAll=0,tAvgN=0;
  for(var z2=0;z2<12;z2++){if(tN[z2]){tAvgAll+=tSum[z2]/tN[z2];tAvgN++;}}
  var avgT=tAvgN?Math.round(tAvgAll/tAvgN):null;

  /* ---------- mood ---------- */
  var moodM=[],moodSum=0,moodN=0;
  for(var m5=0;m5<12;m5++){
    var ms=0,mn=0;
    for(var d5=1;d5<=dimY(Y,m5);d5++){
      var mv=(S.health.moods||{})[kY(Y,m5,d5)];
      if(mv){ms+=parseInt(mv,10);mn++;moodSum+=parseInt(mv,10);moodN++;}
    }
    moodM[m5]=mn?ms/mn:null;
  }
  var moodAvg=moodN?(moodSum/moodN).toFixed(1):"\u2014";

  /* ---------- water ---------- */
  var wtM=[],wtSum=0,wtN=0;
  for(var m6=0;m6<12;m6++){
    var ws=0,wn=0;
    for(var d6=1;d6<=dimY(Y,m6);d6++){
      var v=S.waterL[kY(Y,m6,d6)];
      if(v){ws+=v;wn++;wtSum+=v;wtN++;}
    }
    wtM[m6]=wn?ws/wn:null;
  }
  var waterAvg=wtN?(wtSum/wtN).toFixed(1):"0.0";
  var firstW=null,firstWM=-1;
  for(var z3=0;z3<12;z3++){if(wtM[z3]!==null){firstW=wtM[z3];firstWM=z3;break;}}

  /* ---------- habits ---------- */
  var hm={};
  for(var m7=0;m7<12;m7++){
    for(var d7=1;d7<=dimY(Y,m7);d7++){
      var k7=kY(Y,m7,d7),dd7=S.data[k7];
      if(!dd7||!dd7.chores)continue;
      dd7.chores.forEach(function(c7,i7){
        if(!hm[c7])hm[c7]={d:0,t:0};
        hm[c7].t++;
        if(done(k7,i7))hm[c7].d++;
      });
    }
  }
  var habits=Object.keys(hm).map(function(n){
    return {n:n,p:Math.round(hm[n].d/hm[n].t*100)};
  }).sort(function(a,b){return b.p-a.p;}).slice(0,6);

  /* ---------- weekday rhythm ---------- */
  var wdS=[0,0,0,0,0,0,0],wdN=[0,0,0,0,0,0,0];
  for(var m8=0;m8<12;m8++){
    for(var d8=1;d8<=dimY(Y,m8);d8++){
      var k8=kY(Y,m8,d8),dd8=S.data[k8];
      if(!dd8||!dd8.chores||!dd8.chores.length)continue;
      var t8=dd8.chores.length,dn8=0;
      for(var i8=0;i8<t8;i8++){if(done(k8,i8))dn8++;}
      var wd=dowIdx(new Date(Y,m8,d8));
      wdS[wd]+=dn8/t8;wdN[wd]++;
    }
  }
  var wdP=[],bW=0,wW=0;
  for(var q=0;q<7;q++)wdP[q]=wdN[q]?Math.round(wdS[q]/wdN[q]*100):0;
  for(var q2=1;q2<7;q2++){if(wdP[q2]>wdP[bW])bW=q2;if(wdP[q2]<wdP[wW])wW=q2;}

  /* ---------- reflections: up to 4, spread across the year ---------- */
  var diary=ls("dc2-diary",{}),all=[];
  for(var m9=0;m9<12;m9++){
    for(var d9=1;d9<=dimY(Y,m9);d9++){
      var e=diary[kY(Y,m9,d9)];
      if(e&&e.a)all.push({d:d9,m:m9,q:e.q,a:e.a});
    }
  }
  var refl=[];
  if(all.length<=4)refl=all;
  else{
    for(var r=0;r<4;r++)refl.push(all[Math.floor(r*(all.length-1)/3)]);
  }

  /* ---------- builders ---------- */
  function arcHTML(){
    var maxP=1;
    for(var a=0;a<12;a++)if(mPerfect[a]>maxP)maxP=mPerfect[a];
    var h='<table class="arctbl"><tr>';
    for(var a2=0;a2<12;a2++){
      var op=(0.34+(mPerfect[a2]/maxP)*0.55).toFixed(2);
      h+='<td><span class="barpct">'+(mHas[a2]?mPct[a2]:"")+'</span>'+
         '<span class="bartrack">'+(mHas[a2]
           ?'<span class="bar" style="height:'+Math.max(3,mPct[a2])+'%;background:'+SEASON[a2]+'"></span>'
           :'<span class="bar ghost" style="height:100%"></span>')+
         '</span><span class="barlab">'+MI[a2]+'</span>'+
         '<span class="pd" style="opacity:'+(mPerfect[a2]?op:0)+'">'+(mPerfect[a2]||"")+'</span></td>';
    }
    return h+'</tr></table>';
  }

  function polyline(vals,lo,hi,W,H){
    var pts=[],n=vals.length,seen=0;
    for(var i=0;i<n;i++){
      if(vals[i]===null||vals[i]===undefined)continue;
      var x=(n>1?i/(n-1):0)*W;
      var yy=H-((vals[i]-lo)/((hi-lo)||1)*H);
      pts.push(x.toFixed(1)+","+Math.max(2,Math.min(H-2,yy)).toFixed(1));
      seen++;
    }
    return seen>1?pts.join(" "):"";
  }

  var tVals=[];
  for(var z4=0;z4<12;z4++)tVals[z4]=tN[z4]?tSum[z4]/tN[z4]:null;
  var tMin=null,tMax=null;
  for(var z5=0;z5<12;z5++){
    if(tVals[z5]===null)continue;
    if(tMin===null||tVals[z5]<tMin)tMin=tVals[z5];
    if(tMax===null||tVals[z5]>tMax)tMax=tVals[z5];
  }

  var wthHTML;
  if(wDays>0){
    var rows=[["Clear",bk.clear,"linear-gradient(90deg,#F5D083,#E8A03C)"],
              ["Partly cloudy",bk.partly,"linear-gradient(90deg,#E0A552,#C98A5E)"],
              ["Rainy",bk.rain,"linear-gradient(90deg,#5D9BD1,#3B7BC4)"],
              ["Stormy",bk.storm,"linear-gradient(90deg,#C4553A,#8E3B2C)"]];
    var maxB=Math.max(1,bk.clear,bk.partly,bk.rain,bk.storm);
    var rH="";
    rows.forEach(function(rr){
      rH+='<div class="wrow"><span class="wname">'+rr[0]+'</span>'+
        '<span class="wtrack"><span class="wfill" style="width:'+
        Math.round(rr[1]/maxB*100)+'%;background:'+rr[2]+'"></span></span>'+
        '<span class="wn">'+rr[1]+'</span></div>';
    });
    var curveP=polyline(tVals,(tMin===null?0:tMin-1),(tMax===null?1:tMax+1),520,74);
    var curveH=curveP
      ?'<div class="curve"><svg width="100%" height="74" viewBox="0 0 520 74" preserveAspectRatio="none" aria-hidden="true">'+
        '<defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">'+
        '<stop offset="0%" stop-color="#7FB6E4"/><stop offset="25%" stop-color="#4FC3A8"/>'+
        '<stop offset="55%" stop-color="#F0C067"/><stop offset="80%" stop-color="#D4763F"/>'+
        '<stop offset="100%" stop-color="#7FB6E4"/></linearGradient></defs>'+
        '<polyline points="'+curveP+'" fill="none" stroke="url(#tg)" stroke-width="2.5" '+
        'stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        '<div class="curvelbl"><span>'+(tVals[0]!==null?"JAN "+fmtTemp(tVals[0])+"\u00b0":"")+'</span>'+
        '<span>AVG '+(avgT===null?"\u2014":fmtTemp(avgT)+"\u00b0")+'</span>'+
        '<span>'+(tVals[11]!==null?"DEC "+fmtTemp(tVals[11])+"\u00b0":"")+'</span></div></div>'
      :'';
    wthHTML='<div class="slab"><div class="slabin">'+
      '<div class="slabtag">\u25c8 Recorded across '+wDays+' day'+(wDays===1?"":"s")+'</div>'+
      '<div class="extremes">'+
      '<div class="ex hot"><div class="t">'+fmtTemp(hiV)+'<small>'+tempUnit()+'</small></div><div class="d">'+hiD+'</div><div class="l">Hottest</div></div>'+
      '<div class="ex cold"><div class="t">'+fmtTemp(loV)+'<small>'+tempUnit()+'</small></div><div class="d">'+loD+'</div><div class="l">Coldest</div></div>'+
      '<div class="ex rain"><div class="t">'+rainDays+'<small> days</small></div><div class="d">'+
        Math.round(rainDays/Math.max(1,wDays)*100)+'% of recorded days</div><div class="l">Rainfall</div></div>'+
      '</div>'+curveH+rH+
      '<div class="slabline">Weather was recorded on '+wDays+' of your '+daysLogged+' logged days.</div>'+
      '</div></div>';
  } else {
    wthHTML='<div class="slab"><div class="slabin">'+
      '<div class="slabtag">\u25c8 Monthly weather report</div>'+
      '<div class="slabline" style="margin-top:0;padding-top:0;border:none">'+
      'No weather was recorded for '+Y+'. Daily starts logging the sky the first time you open it each day.'+
      '</div></div></div>';
  }

  var habitHTML="";
  habits.forEach(function(hh){
    habitHTML+='<div class="hrow"><span class="hname">'+escH(hh.n)+'</span>'+
      '<span class="hbar"><i style="width:'+hh.p+'%"></i></span>'+
      '<span class="hpct">'+hh.p+'%</span></div>';
  });
  if(!habitHTML)habitHTML='<div class="hrow"><span class="hname" style="color:rgba(255,255,255,.4)">No chores logged</span></div>';

  var moodP=polyline(moodM,1,5,520,62);
  var moodHTML=moodP
    ?'<div style="position:relative;z-index:1">'+
      '<svg width="100%" height="62" viewBox="0 0 520 62" preserveAspectRatio="none" aria-hidden="true">'+
      '<defs><linearGradient id="mgy" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0%" stop-color="#4A78B8"/><stop offset="45%" stop-color="#4FC3A8"/>'+
      '<stop offset="100%" stop-color="#F0C067"/></linearGradient></defs>'+
      '<polyline points="'+moodP+'" fill="none" stroke="url(#mgy)" stroke-width="2.5" '+
      'stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '<div class="curvelbl" style="color:rgba(255,255,255,.32)">'+
      '<span>JAN</span><span>AVG '+moodAvg+'</span><span>DEC</span></div></div>'
    :'<div class="subnote" style="padding:10px 0">Not enough mood entries to draw a year.</div>';

  var reflHTML="";
  refl.forEach(function(rr){
    reflHTML+='<div class="ref"><div class="refmeta">'+rr.d+' '+MN[rr.m]+'</div>'+
      '<div class="refq">'+escH(rr.q)+'</div>'+
      '<div class="refa">'+escH(rr.a)+'</div></div>';
  });
  if(!reflHTML)reflHTML='<div class="ref"><div class="refa" style="color:rgba(255,255,255,.45)">No journal entries this year.</div></div>';

  var yGoals=goalsInWindow(function(by){return by.slice(0,4)===String(Y);});
  var yGoalsHTML=yGoals.length
    ?('<div class="sec"><span>The year\u2019s goals</span></div>'+goalRowsHTML(yGoals))
    :'';

  /* ---------- Jarvis letter ---------- */
  var lowH=habits.length?habits[habits.length-1]:null;
  var L=[];
  L.push('<p>You finished '+Y+' at <b>'+yearPct+'%</b> across '+daysLogged+
    ' logged days. '+MN[bestM]+' was your strongest month at <b>'+mPct[bestM]+'%</b>'+
    (mPerfect[bestM]?' with '+mPerfect[bestM]+' perfect day'+(mPerfect[bestM]===1?'':'s'):'')+
    '; '+MN[worstM]+' was the hardest at '+mPct[worstM]+'%. Both are part of the same year.</p>');
  if(streak>1){
    L.push('<p>Your longest unbroken run was <b>'+streak+' days</b> \u2014 every chore, every day. '+
      'That is the clearest evidence you have of what you can hold when the conditions are right.</p>');
  }
  if(lowH){
    L.push('<p><b>'+escH(lowH.n)+'</b> finished at '+lowH.p+
      '%, the lowest of your habits. It is the one that did not yield this year, and probably still the lever.</p>');
  }
  L.push('<p>'+perfectTotal+' day'+(perfectTotal===1?'':'s')+' this year you finished whole'+
    (wdP[bW]>0?', and '+WD[bW]+' carried you more than any other day of the week':'')+
    '. Whatever next year asks, you now have evidence of what you are capable of.</p>');

  /* ---------- Plus, but outside the December\u2013February window ---------- */
  if(W===null&&isPlus()&&!thinMode){
    var soon='<div class="wrap"><div class="page">'+
      '<div class="head"><div class="mark">'+DOC_LOGO_LIGHT+'<span class="wordmark">Daily</span></div>'+
      '<div class="kicker">Yearly Report<span class="plus">Plus</span></div></div>'+
      '<div class="yearblock">'+
        '<svg class="yearsvg" viewBox="0 0 280 88" role="img" aria-label="'+Y+'">'+
        '<defs><linearGradient id="yng" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0%" stop-color="#8FB8E4"/><stop offset="40%" stop-color="#EFEFF6"/>'+
        '<stop offset="100%" stop-color="#F0C067"/></linearGradient></defs>'+
        '<text x="0" y="70" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="86" '+
        'font-weight="200" letter-spacing="-3" fill="url(#yng)">'+Y+'</text></svg>'+
        '<div class="yearlbl">Still being written</div>'+
        '<div class="theme">Your yearly report is issued each December. Everything you log '+
        'between now and then becomes part of it.</div>'+
      '</div>'+
      '<div class="sec"><span>'+Y+' so far</span></div>'+
      '<div class="figs">'+
        '<div class="fig"><div class="rule"></div><div class="n">'+doneTotal.toLocaleString()+'</div><div class="l">Chores<br>completed</div></div>'+
        '<div class="fig"><div class="rule"></div><div class="n">'+daysLogged+'</div><div class="l">Days<br>logged</div></div>'+
        '<div class="fig"><div class="rule"></div><div class="n gold">'+perfectTotal+'</div><div class="l">Perfect<br>days</div></div>'+
        '<div class="fig"><div class="rule"></div><div class="n">'+streak+'</div><div class="l">Longest<br>streak</div></div>'+
      '</div>'+
      '<div class="sec"><span>Your arc so far</span></div>'+
      '<div class="arc">'+arcHTML()+'</div>'+
      '<div class="coverage">Yearly reports are issued <span style="color:#F0C067;font-weight:600">Dec to Feb</span>.</div>'+
      '<div class="foot">\u2726 DAILY \u00b7 '+Y+'</div>'+
    '</div></div>';
    openMonthlyDoc(soon,YEARLY_CSS,"yearly-report-"+Y+"-progress.html",
      {forceOpen:true,toast:"Your year is still being written \u2726"});
    return;
  }

  /* ---------- assemble ---------- */
  var covered=monthsWithData===12
    ? 'This report covers all 12 months of '+Y+'.'
    : 'This report covers '+monthsWithData+' of 12 months of '+Y+' \u2014 only the months you logged.';

  var inner='<div class="wrap">'+

  /* ---- page 1 ---- */
  '<div class="page">'+
    '<div class="head"><div class="mark">'+DOC_LOGO_LIGHT+'<span class="wordmark">Daily</span></div>'+
    '<div class="kicker">Yearly Report<span class="plus">Plus</span></div></div>'+
    '<div class="yearblock">'+
      '<svg class="yearsvg" viewBox="0 0 280 88" role="img" aria-label="'+Y+'">'+
      '<defs><linearGradient id="yng" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0%" stop-color="#8FB8E4"/><stop offset="40%" stop-color="#EFEFF6"/>'+
      '<stop offset="100%" stop-color="#F0C067"/></linearGradient></defs>'+
      '<text x="0" y="70" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="86" '+
      'font-weight="200" letter-spacing="-3" fill="url(#yng)">'+Y+'</text></svg>'+
      '<div class="yearlbl">'+(totalDays===366?"Three hundred and sixty-six days":"Three hundred and sixty-five days")+'</div>'+
      '<div class="theme">A year of being alive is not a small thing. Here is what you did with yours.</div>'+
    '</div>'+
    '<div class="sec"><span>The year in figures</span></div>'+
    '<div class="figs">'+
      '<div class="fig"><div class="rule"></div><div class="n">'+doneTotal.toLocaleString()+'</div><div class="l">Chores<br>completed</div></div>'+
      '<div class="fig"><div class="rule"></div><div class="n">'+daysLogged+'<em>/'+totalDays+'</em></div><div class="l">Days<br>logged</div></div>'+
      '<div class="fig"><div class="rule"></div><div class="n gold">'+perfectTotal+'</div><div class="l">Perfect<br>days</div></div>'+
      '<div class="fig"><div class="rule"></div><div class="n">'+streak+'</div><div class="l">Longest<br>streak</div></div>'+
    '</div>'+
    '<div class="sec"><span>Your arc</span></div>'+
    '<div class="lead">Twelve months, each carrying its own season. Height is how much of the month you completed; '+
      'the gold numeral beneath is how many days you finished whole \u2014 brighter where there were more.</div>'+
    '<div class="arc">'+arcHTML()+
      '<div class="arckey">'+MN[bestM]+' was your strongest month at <b>'+mPct[bestM]+'%</b>, '+
      MN[worstM]+' your hardest at <b>'+mPct[worstM]+'%</b>. Across the year you held <b>'+yearPct+'%</b>.'+
      '<div class="seasonkey">'+
        '<span class="sk"><i style="background:linear-gradient(90deg,#7FB6E4,#4A78B8)"></i>Winter</span>'+
        '<span class="sk"><i style="background:linear-gradient(90deg,#6FD4C0,#35A08C)"></i>Spring</span>'+
        '<span class="sk"><i style="background:linear-gradient(90deg,#F7DE9C,#E09B3C)"></i>Summer</span>'+
        '<span class="sk"><i style="background:linear-gradient(90deg,#E5A06A,#C4653A)"></i>Autumn</span>'+
      '</div></div>'+
    '</div>'+
  '</div>'+

  /* ---- page 2 ---- */
  '<div class="page">'+
    '<div class="head"><div class="mark">'+DOC_LOGO_LIGHT+'<span class="wordmark">Daily</span></div>'+
    '<div class="kicker">'+Y+' \u00b7 Page 2</div></div>'+
    '<div class="sec"><span>The year in weather</span></div>'+
    '<div class="lead">Every day you opened Daily, it recorded the sky above you. This is what a year of that looks like.</div>'+

function playChime(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [523.25,659.25,783.99].forEach(function(f,i){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      const t=ctx.currentTime+i*0.09;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.16,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.62);
      o.start(t);o.stop(t+0.68);
    });
  }catch(e){}
}

/* ===== GOALS =========================================================
   A goal is the year-sized sibling of a target: longer horizon, looser
   cadence (weekly or monthly rather than daily), and it closes with an
   honest outcome instead of just expiring.
   ==================================================================== */
function goals(){var g=ls("dc2-goals",[]);return Array.isArray(g)?g:[];}
function saveGoals(g){ss("dc2-goals",g);}
/* days of the month a goal runs on. Older goals stored a single dom. */
function goalDoms(g){
  if(g.doms&&g.doms.length)return g.doms;
  return [g.dom||1];
}
function goalDue(g){return !g.outcome&&g.by&&g.by<=T;}
function dueGoals(){return goals().filter(goalDue);}
function daysLeft(iso){
  if(!iso)return null;
  return Math.ceil((new Date(iso+"T12:00:00")-new Date(T+"T12:00:00"))/86400000);
}
function fmtWhen(iso){
  if(!iso)return "";
  var d=new Date(iso+"T12:00:00");
  return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
}
var MONTHNAMES=["january","february","march","april","may","june","july",
  "august","september","october","november","december"];
function lastDayOf(y,m){return new Date(y,m+1,0).getDate();}
/* Understands "december", "end of year", "in 6 months", "march 2027",
   "31/12/2026" and plain ISO. Returns YYYY-MM-DD or null. */
function parseWhen(text){
  var s=String(text||"").toLowerCase().trim();
  if(!s)return null;
  var now=new Date(T+"T12:00:00"),y=now.getFullYear();
  var m;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m)return s;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    var yy=parseInt(m[3],10); if(yy<100)yy+=2000;
    return yy+"-"+z(parseInt(m[2],10))+"-"+z(parseInt(m[1],10));
  }
  if(/end of (the )?year|this year|by december|year end/.test(s))return y+"-12-31";
  if(/end of (the )?month/.test(s))return y+"-"+z(now.getMonth()+1)+"-"+z(lastDayOf(y,now.getMonth()));
  m=s.match(/in\s+(\d{1,3})\s*(day|week|month|year)s?/);
  if(m){
    var n=parseInt(m[1],10),d=new Date(now);
    if(m[2]==="day")d.setDate(d.getDate()+n);
    if(m[2]==="week")d.setDate(d.getDate()+n*7);
    if(m[2]==="month")d.setMonth(d.getMonth()+n);
    if(m[2]==="year")d.setFullYear(d.getFullYear()+n);
    return pad(d);
  }
  if(/next year/.test(s))return (y+1)+"-12-31";
  if(/next month/.test(s)){
    var nm=new Date(now);nm.setMonth(nm.getMonth()+1);
    return nm.getFullYear()+"-"+z(nm.getMonth()+1)+"-"+z(lastDayOf(nm.getFullYear(),nm.getMonth()));
  }
  /* a month name, with an optional year and an optional day */
  for(var i=0;i<12;i++){
    if(s.indexOf(MONTHNAMES[i])>=0||s.indexOf(MONTHNAMES[i].slice(0,3))===0||
       new RegExp("\\b"+MONTHNAMES[i].slice(0,3)+"\\b").test(s)){
      var ym=s.match(/(20\d{2})/);
      var yr=ym?parseInt(ym[1],10):y;
      if(!ym&&i<now.getMonth())yr=y+1;           /* a month already gone means next year */
      var dm=s.match(/\b(\d{1,2})(st|nd|rd|th)?\b/);
      var day=(dm&&parseInt(dm[1],10)<=lastDayOf(yr,i))?parseInt(dm[1],10):lastDayOf(yr,i);
      return yr+"-"+z(i+1)+"-"+z(day);
    }
  }
  return null;
}
/* put the working sessions on the calendar, like a target but sparser */
function goalSchedule(g){
  if(!g.cadence)return 0;
  var d=Object.assign({},S.data);
  var cur=new Date(T+"T12:00:00");cur.setDate(cur.getDate()+1);
  var end=new Date(g.by+"T12:00:00");
  var count=0;
  while(cur<=end&&count<120){
    var hit=false;
    if(g.cadence==="weekly")hit=(g.days||[]).indexOf(cur.getDay())>=0;
    if(g.cadence==="monthly")hit=goalDoms(g).indexOf(cur.getDate())>=0;
    if(hit){
      var k=pad(cur);
      if(!d[k])d[k]={chores:defaultsFor(k),schedule:[],journal:"",temp:"--"};
      d[k]=Object.assign({},d[k]);
      d[k].schedule=(d[k].schedule||[]).concat([{time:"09:00",label:"\u26F0 "+g.title,end:"10:00"}])
        .sort(function(a,b){return String(a.time).localeCompare(String(b.time));});
      count++;
    }
    cur.setDate(cur.getDate()+1);
  }
  ss("dc2-data",d);S.data=d;
  return count;
}

function goalsInWindow(pred){

}

  var g={id:Date.now(),title:S.gTitle.trim(),by:S.gBy,horizon:S.gHorizon||"",cadence:S.gCadence||"",

function minsNow(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function minsOf(iso){if(!iso)return null;const t=iso.split("T")[1];if(!t)return null;const p=t.split(":");return parseInt(p[0])*60+parseInt(p[1]);}
function getTheme(code,hour){
  const now=minsNow();
  const rise=minsOf(SUN.rise), set=minsOf(SUN.set);
  let phase; // day / sunrise / sunset / dusk / night
  if(rise!=null&&set!=null){
    if(now>=rise-35&&now<rise+35)phase="sunrise";
    else if(now>=set-40&&now<set+15)phase="sunset";
    else if(now>=set+15&&now<set+75)phase="dusk";
    else if(now<rise-35||now>=set+75)phase="night";
    else phase="day";
  } else {
    // fallback to clock if sun times not loaded yet
    if(hour>=5&&hour<7)phase="sunrise";
    else if(hour>=19&&hour<20)phase="sunset";
    else if(hour>=20&&hour<21)phase="dusk";
    else if(hour<5||hour>=21)phase="night";
    else phase="day";
  }
  if(phase==="sunrise")return"sunrise";
  if(phase==="sunset")return"sunset";
  if(phase==="dusk")return"dusk";
  if(phase==="night")return"clear-night";
  // daytime — weather-driven
  const daylight=true;
  if(code===0)return"clear-day";
  if(code<=2)return"sun-clouds";
  if(code===3)return"cloudy";
  if(code<=55)return"sun-shower";
  if(code<=67)return"rainy";
  if(code<=77)return"snowy";
  if(code<=82)return"heavy-rain";
  return"stormy";
}

function buildWaterBar(parent){
  const MAX=3;
  const cur=S.waterL[T]||0;
  const wrap=mk("div","wbar-wrap");
  function fmt(n){
    const v=Math.round(n*20)/20;
    let s=v.toFixed(2);
    s=s.replace(/0$/,"").replace(/\.0$/,"").replace(/\.$/,"");
    return s;
  }
  const val=mk("div","wbar-val");
  const num=mk("span","");tx(num,fmt(cur));
  const unit=mk("span","wbar-unit");tx(unit,"L");
  ap(val,num,unit);
  const bar=mk("div","wbar");
  const fill=mk("div","wbar-fill");
  const thumb=mk("div","wbar-thumb");
  function setUI(n){
    const p=Math.max(0,Math.min(1,n/MAX));
    fill.style.width=(p*100)+"%";
    thumb.style.left=(p*100)+"%";
    tx(num,fmt(n));
  }
  setUI(cur);
  function xToVal(clientX){
    const r=bar.getBoundingClientRect();
    let n=(clientX-r.left)/r.width*MAX;
    n=Math.max(0,Math.min(MAX,n));
    return Math.round(n*20)/20;
  }
  let dragging=false;
  bar.addEventListener("touchstart",function(e){
    dragging=true;setUI(xToVal(e.touches[0].clientX));
    if(navigator.vibrate)navigator.vibrate(4);
  },{passive:true});
  bar.addEventListener("touchmove",function(e){
    if(dragging)setUI(xToVal(e.touches[0].clientX));
  },{passive:true});
  bar.addEventListener("touchend",function(e){
    dragging=false;
    setWaterL(xToVal(e.changedTouches[0].clientX));
  },{passive:true});
  bar.addEventListener("mousedown",function(e){setUI(xToVal(e.clientX));});
  bar.addEventListener("click",function(e){setWaterL(xToVal(e.clientX));});
  ap(bar,fill,thumb);
  const scale=mk("div","wbar-scale");
  ["0","1L","2L","3L"].forEach(function(t){const s=mk("span","");tx(s,t);scale.appendChild(s);});
  ap(wrap,val,bar,scale);
  parent.appendChild(wrap);
}

/* mood can be logged whenever — not only during the morning ritual */
/* ---- 24-hour day view -------------------------------------------------
   Events store a start and an optional end. Anything without an end is
   drawn as one hour, which is a guess — that is why the end field exists. */
function evMins(t){
  if(!t)return null;
  var p=String(t).split(":");
  var h=parseInt(p[0],10),m=parseInt(p[1],10);
  if(isNaN(h)||isNaN(m))return null;
  return h*60+m;
}
function fmtMins(n){return z(Math.floor(n/60)%24)+":"+z(n%60);}
/* side-by-side placement for anything that overlaps */
function packEvents(list){
  var out=list.slice().sort(function(a,b){return a.s-b.s;});
  var groups=[],cur=[];
  out.forEach(function(e){
    if(!cur.length){cur=[e];groups.push(cur);return;}
    var overlaps=cur.some(function(o){return e.s<o.e&&o.s<e.e;});
    if(overlaps)cur.push(e);else{cur=[e];groups.push(cur);}
  });
  groups.forEach(function(g){
    g.forEach(function(e,i){e.col=i;e.cols=g.length;});
  });
  return out;
}


/* ===== WEEK TO-DO =====================================================
   A loose list for the week. A day is optional and a time is optional on
   top of that — pick a day and it also lands on that day's schedule. */
function todos(){var t=ls("dc2-todos",[]);return Array.isArray(t)?t:[];}
function saveTodos(t){ss("dc2-todos",t);}
function weekKeyOf(dateKey){return pad(weekOf(dateKey)[0]);}
function weekTodos(dateKey){
  var wk=weekKeyOf(dateKey);
  return todos().filter(function(t){return t.week===wk;});
}
function todoAdd(text,dayKey,time){
  var all=todos();
  var item={id:Date.now(),text:String(text).trim(),week:weekKeyOf(S.sel||T),
            day:dayKey||"",time:time||"",done:false};
  if(item.day){
    /* a dated to-do is also an event, so it shows up in the day and the timeline */
    ensure(item.day);
    var d=Object.assign({},S.data);
    var ev={time:item.time||"",label:item.text};
    if(item.time)ev.end="";
    d[item.day]=Object.assign({},day(item.day),{
      schedule:day(item.day).schedule.concat([ev]).sort(function(a,b){
        if(!a.time&&!b.time)return 0;
        if(!a.time)return 1;
        if(!b.time)return -1;
        return a.time.localeCompare(b.time);
      })});
    ss("dc2-data",d);S.data=d;
  }
  all.push(item);saveTodos(all);
}
function todoToggle(id){
  saveTodos(todos().map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t;}));
  render();
}
function todoRemove(id){
  var t=todos().filter(function(x){return x.id===id;})[0];
  if(t&&t.day&&S.data[t.day]){
    var d=Object.assign({},S.data);
    d[t.day]=Object.assign({},d[t.day],{
      schedule:(d[t.day].schedule||[]).filter(function(ev){return ev.label!==t.text;})});
    ss("dc2-data",d);S.data=d;
  }
  saveTodos(todos().filter(function(x){return x.id!==id;}));
  render();
}
function todoWhen(t){

  var d=new Date(t.day+"T12:00:00");

  return {txt:t.time?(lbl+" \u00b7 "+t.time):lbl,none:false};
}

    c0.addEventListener("click",function(){set({goalWiz:0});});
    card.appendChild(c0);
  }

  if(S.goalWiz===1){

      :"Think bigger than a task \u2014 something the year is about.");

    inp.addEventListener("input",function(e){S.gTitle=e.target.value;});
    card.appendChild(inp);
    var n=mk("button","ritual-next");tx(n,"Next \u2192");
    n.addEventListener("click",function(){if(S.gTitle.trim())set({goalWiz:2});});
    card.appendChild(n);

  }

  if(S.goalWiz===2){
    var q2=mk("div","ritual-q");tx(q2,"By when?");card.appendChild(q2);
    var h2=mk("div","ghint");
    tx(h2,"Write it however you think of it \u2014 "+(S.gHorizon==="short"
      ?"\u201cin 3 months\u201d, \u201cMarch\u201d, \u201cend of month\u201d."
      :"\u201cend of year\u201d, \u201cnext year\u201d, \u201cin 18 months\u201d."));
    card.appendChild(h2);
    var wi=mk("input","minput");wi.type="text";wi.placeholder=S.gHorizon==="short"?"in 3 months":"end of year";
    /* prefilled so Next accepts the suggestion without retyping it */
    wi.value=S.gWhenText?S.gWhenText
      :(S.gBy?"":(S.gHorizon==="short"?"in 3 months":"end of year"));
    var shown=mk("div","gwhen");
    function refresh(v){
      var iso=parseWhen(v);
      S.gWhenText=v;S.gBy=iso||"";
      if(!v.trim()){tx(shown,"");shown.className="gwhen";}
      else if(iso){tx(shown,"\u2192 "+fmtWhen(iso));shown.className="gwhen";}
      else {tx(shown,"Couldn\u2019t read that \u2014 try a date below");shown.className="gwhen bad";}
    }
    wi.addEventListener("input",function(e){S.gTyped=true;refresh(e.target.value);});
    card.appendChild(wi);card.appendChild(shown);
    refresh(wi.value);
    var dl=mk("div","ghint");tx(dl,"or pick it");card.appendChild(dl);
    var di=mk("input","minput");di.type="date";di.min=addDays(T,1);di.value=S.gBy||"";
    di.addEventListener("input",function(e){
      S.gBy=e.target.value;S.gWhenText="";
      wi.value="";tx(shown,e.target.value?"\u2192 "+fmtWhen(e.target.value):"");
      shown.className="gwhen";
    });
    card.appendChild(di);
    var n2=mk("button","ritual-next");tx(n2,"Next \u2192");
    n2.addEventListener("click",function(){
      if(!S.gBy){showToast("Give it a date first");return;}
      if(S.gBy<=T){showToast("Pick a date in the future");return;}
      set({goalWiz:3});
    });
    card.appendChild(n2);
    var b2=mk("button","ritual-skip");tx(b2,"\u2190 Back");
    b2.addEventListener("click",function(){set({goalWiz:1});});
    card.appendChild(b2);
  }

  if(S.goalWiz===3){
    var q3=mk("div","ritual-q");tx(q3,"Will you work on it on a rhythm?");card.appendChild(q3);
    var h3=mk("div","ghint");tx(h3,"Optional. Sessions go straight into your calendar.");
    card.appendChild(h3);
    var chips=mk("div","tchips");
    [["weekly","Weekly"],["monthly","Monthly"],["","No fixed rhythm"]].forEach(function(o){
      var c=mk("button","tchip"+(S.gCadence===o[0]?" on":""));tx(c,o[1]);
      c.addEventListener("click",function(){set({gCadence:o[0]});});
      chips.appendChild(c);
    });
    card.appendChild(chips);
    var n3=mk("button","ritual-next");tx(n3,S.gCadence?"Next \u2192":"Create the goal \u26F0");
    n3.addEventListener("click",function(){
      if(!S.gCadence){goalCreate();return;}
      set({goalWiz:4});
    });
    card.appendChild(n3);
    var b3=mk("button","ritual-skip");tx(b3,"\u2190 Back");
    b3.addEventListener("click",function(){set({goalWiz:2});});
    card.appendChild(b3);
  }

  if(S.goalWiz===4){
    if(S.gCadence==="weekly"){
      var q4=mk("div","ritual-q");tx(q4,"Which days each week?");card.appendChild(q4);
      var names=dowLabels("n");
      var wc=mk("div","tchips");
      for(var i=0;i<7;i++){
        (function(idx){
          var real=(prefWeekStart()==="sun")?idx:((idx+1)%7);
          var on=(S.gDays||[]).indexOf(real)>=0;
          var c=mk("button","tchip"+(on?" on":""));tx(c,names[idx]);
          c.addEventListener("click",function(){
            var j=S.gDays.indexOf(real);
            if(j>=0)S.gDays.splice(j,1);else S.gDays.push(real);
            render();
          });
          wc.appendChild(c);
        })(i);
      }
      card.appendChild(wc);
    } else {
      var q5=mk("div","ritual-q");tx(q5,"Which days each month?");card.appendChild(q5);
      var h5=mk("div","ghint");tx(h5,"Pick as many as you like. 1 to 28, so every month has them.");
      card.appendChild(h5);
      var dc=mk("div","dchips");
      for(var dnum=1;dnum<=28;dnum++){
        (function(n){
          var on=(S.gDoms||[]).indexOf(n)>=0;
          var c=mk("button","dchip"+(on?" on":""));tx(c,String(n));
          c.addEventListener("click",function(){
            var j=S.gDoms.indexOf(n);
            if(j>=0)S.gDoms.splice(j,1);else S.gDoms.push(n);
            render();
          });
          dc.appendChild(c);
        })(dnum);
      }
      card.appendChild(dc);
    }
    var n4=mk("button","ritual-next");tx(n4,"Create the goal \u26F0");
    n4.addEventListener("click",function(){
      if(S.gCadence==="weekly"&&!(S.gDays||[]).length){showToast("Pick at least one day");return;}
      if(S.gCadence==="monthly"&&!(S.gDoms||[]).length){showToast("Pick at least one day");return;}
      goalCreate();
    });
    card.appendChild(n4);
    var b4=mk("button","ritual-skip");tx(b4,"\u2190 Back");
    b4.addEventListener("click",function(){set({goalWiz:3});});
    card.appendChild(b4);
  }

  /* step 1 has nothing to go back to, so it gets Cancel; the rest get Back */
  if(S.goalWiz===1){
    var sk=mk("button","ritual-skip");tx(sk,"\u2190 Back");
    sk.addEventListener("click",function(){set({goalWiz:0.5});});
    card.appendChild(sk);
  }
  ov.appendChild(card);
  return ov;
}

function buildDayView(root){
  var k=S.sel||T, HH=60;
  var dd=day(k);
  var ov=mk("div","dv-ov");
  var top=mk("div","dv-top");
  var tw=mk("div","dv-t");
  var dObj=new Date(k+"T12:00:00");
  var dTitle=mk("div","dv-day");
  tx(dTitle,dObj.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}));
  var timed=(dd.schedule||[]).filter(function(e){return evMins(e.time)!==null;});
  var loose=(dd.schedule||[]).filter(function(e){return evMins(e.time)===null;});
  var dSub=mk("div","dv-sub");
  tx(dSub,(dd.schedule||[]).length+" event"+((dd.schedule||[]).length===1?"":"s")+
    " \u00b7 "+(dd.chores||[]).length+" chores");
  ap(tw,dTitle,dSub);
  var x=mk("button","dv-x");tx(x,"\u00d7");
  x.addEventListener("click",function(){set({dayView:false});});
  ap(top,tw,x);ov.appendChild(top);

  var sc=mk("div","dv-scroll");
  if(loose.length){
    var lw=mk("div","dv-loose");
    var lk=mk("div","k");tx(lk,"No time set");lw.appendChild(lk);
    loose.forEach(function(e){
      var it=mk("div","it");tx(it,e.label);lw.appendChild(it);
    });
    sc.appendChild(lw);
  }
  var grid=mk("div","dv-grid");
  grid.style.height=(24*HH+40)+"px";

  for(var h=0;h<24;h++){
    var line=mk("div","dv-hr");line.style.top=(h*HH)+"px";grid.appendChild(line);
    var lbl=mk("div","dv-hl");tx(lbl,z(h)+":00");lbl.style.top=(h*HH)+"px";grid.appendChild(lbl);
    var half=mk("div","dv-half");half.style.top=(h*HH+HH/2)+"px";grid.appendChild(half);
    (function(hour){
      var tap=mk("button","dv-tap");
      tap.style.top=(hour*HH)+"px";tap.style.height=HH+"px";
      tap.addEventListener("click",function(){
        set({dayView:false,modal:true,mdest:k,mtime:z(hour)+":00",mval:"",mend:z((hour+1)%24)+":00",meditIdx:null});
      });
      grid.appendChild(tap);
    })(h);
  }

  var nowMin=null;
  if(k===T){
    var n=new Date();nowMin=n.getHours()*60+n.getMinutes();
    var nl=mk("div","dv-now");nl.style.top=nowMin+"px";grid.appendChild(nl);
    var nlb=mk("div","dv-nowlbl");tx(nlb,fmtMins(nowMin));nlb.style.top=nowMin+"px";
    grid.appendChild(nlb);
  }

  var items=timed.map(function(e,i){
    var s=evMins(e.time);
    var en=evMins(e.end);
    if(en===null||en<=s)en=Math.min(s+60,24*60);
    return {s:s,e:en,label:e.label,idx:(dd.schedule||[]).indexOf(e)};
  });
  packEvents(items).forEach(function(e){
    var b=mk("div","dv-ev"+((nowMin!==null&&e.e<=nowMin)?" past":""));
    var colW=100/(e.cols||1);
    b.style.top=(e.s+2)+"px";
    b.style.height=Math.max(26,(e.e-e.s)-4)+"px";
    b.style.left="calc(52px + "+(e.col*colW)+"% * 0.86)";
    b.style.width="calc("+colW+"% * 0.86 - 8px)";
    b.style.borderLeft="3px solid "+["#5B4FE9","#E8A87C","#8BA888","#A08FFF","#4A90D9"][e.idx%5];
    var lb=mk("div","lb");tx(lb,e.label);
    var tm=mk("div","tm");tx(tm,fmtMins(e.s)+" \u2013 "+fmtMins(e.e));
    ap(b,lb,tm);
    b.addEventListener("click",function(ev){
      ev.stopPropagation();
      set({dayView:false});editEvent(k,e.idx);
    });
    grid.appendChild(b);
  });

  if(!timed.length&&!loose.length){
    var em=mk("div","dv-empty");tx(em,"Nothing scheduled. Tap an hour to add.");
    grid.appendChild(em);
  }

  sc.appendChild(grid);ov.appendChild(sc);root.appendChild(ov);
  /* open where the day actually is */
  var focus=(nowMin!==null)?nowMin:(items.length?items[0].s:8*60);
  sc.scrollTop=Math.max(0,focus-140);
}

  const box=mk("div","moodrow"+(fade?" fading":""));
  if(cur){
    const r=mk("div","moodset");

    tx(clbl,"Or pick your own");

    cinp.value=presets.indexOf(S.tTime)<0?S.tTime:"";

    cinp.addEventListener("input",function(e){if(e.target.value)set({tTime:e.target.value});});
    ap(customWrap,clbl,cinp);card.appendChild(customWrap);
    const nxt=mk("button","ritual-next");tx(nxt,"Build my winning plan");
    nxt.addEventListener("click",targetCreate);
    card.appendChild(nxt);

  if(S.targetWiz===5){
    const q=mk("div","ritual-q");tx(q,S.tLoading?"Jarvis is building your strategy…":"Your plan is in the calendar ✦");card.appendChild(q);
    if(!S.tLoading&&S.tStrategy){

    }

    skip.addEventListener("click",function(){set({targetWiz:0});});

  ov.appendChild(card);

function renderRitual(){

  function backTo(step){
    const b=mk("button","ritual-skip");tx(b,"← Back");
    b.addEventListener("click",function(){set({ritual:step});});
    return b;
  }
  const stepNames={0.9:"Welcome",1:"Step 1 · Feeling",1.5:"Step 1 · Feeling",1.6:"Step 1 · Support",1.7:"Jarvis · Here with you",2:"Step 2 · Hydration",3:"Step 3 · Today's chores"};

  if(S.ritual===0.9){

    const inp=mk("input","minput");inp.type="text";inp.placeholder="Your name";inp.value=S.userName||"";
    let nd=S.userName||"";
    inp.addEventListener("input",function(e){nd=e.target.value;});
    card.appendChild(inp);
    const nxt=mk("button","ritual-next");tx(nxt,"Continue →");
    nxt.addEventListener("click",function(){
      const nm=(nd||"").trim()||"friend";
      ss("dc2-name",nm);ss("dc2-nameok","1");

    });
    card.appendChild(nxt);
    const back=mk("button","ritual-skip");tx(back,"← Back to lock screen");
    back.addEventListener("click",function(){set({ritual:0,view:"lock"});});
    card.appendChild(back);
    setTimeout(function(){inp.focus();},140);
  }

  if(S.ritual===1.6){
    const q=mk("div","ritual-q");tx(q,"Do you want to talk about it?");card.appendChild(q);
    const sub=mk("div","ritual-sub");
    const b1=mk("button","ritual-sub-btn");tx(b1,"💬 Talk with Team");
    b1.style.cssText="background:#5B4FE9;color:#fff;border-color:#5B4FE9";
    b1.addEventListener("click",function(){
      set({ritual:1.7,supportMsg:null,supportLoading:true,teamMode:true,teamSent:false});
      fetchSupportMsg();
    });
    const b2=mk("button","ritual-sub-btn");tx(b2,"I'm okay, continue →");
    b2.addEventListener("click",function(){logSupport(false);
      set(S.moodOnly?{ritual:0,moodOnly:false}:{ritual:2});});
    ap(sub,b1,b2);card.appendChild(sub);
    card.appendChild(backTo(1.5));
  }

  if(S.ritual===1.7){
    // One caring message from Jarvis
    const box=mk("div","jchat-box");
    const jb=mk("div","jmsg a");
    tx(jb,S.supportLoading?"…":(S.supportMsg||""));
    box.appendChild(jb);
    card.appendChild(box);

    // Optional one-time message to the team
    if(S.teamSent){
      const okLine=mk("div","");
      okLine.style.cssText="font-size:12px;color:#8BA888;font-weight:600;margin-bottom:10px";
      tx(okLine,"✓ Your message was sent to the team.");
      card.appendChild(okLine);
    } else if(S.teamMode){
      const ta=mk("textarea","support-ta");ta.placeholder="Write a short message for the team…";ta.value=S.teamDraft;
      ta.addEventListener("input",function(e){S.teamDraft=e.target.value;});
      card.appendChild(ta);
      const send=mk("button","support-send");tx(send,"Send to team");
      send.addEventListener("click",sendTeamMsg);
      card.appendChild(send);
    } else {
      const teamBtn=mk("button","ritual-sub-btn");tx(teamBtn,"✉ Leave a message for the team");
      teamBtn.style.cssText="font-size:11px;padding:9px 16px";
      teamBtn.addEventListener("click",function(){set({teamMode:true});});
      card.appendChild(teamBtn);
    }

    // Warm suggestion — their own contacts, not us
    const reach=mk("div","support-reach");
    tx(reach,"If it feels heavy, open your Contacts and call someone you trust — a familiar voice helps more than we think. You don't have to carry this alone.");
    card.appendChild(reach);

    const nxt=mk("button","ritual-next");tx(nxt,"Continue →");
    nxt.addEventListener("click",function(){logSupport(true);
      set(S.moodOnly?{ritual:0,moodOnly:false}:{ritual:2});});
    card.appendChild(nxt);
    card.appendChild(backTo(1.6));
  }

  if(S.ritual===1){
    const q=mk("div","ritual-q");tx(q,"How are you feeling today"+(S.userName?", "+S.userName:"")+"?");card.appendChild(q);
    const row=mk("div","ritual-moods");
    [["1","😞","Very bad"],["2","😕","Bad"],["3","😐","I'm okay"],["4","🙂","Good"],["5","😄","Great"]].forEach(function(m){
      const b=mk("button","ritual-mood");
      const f=mk("span","face");tx(f,m[1]);
      const l=mk("span","lbl");tx(l,m[2]);
      ap(b,f,l);
      b.addEventListener("click",function(){
        const h=Object.assign({},S.health);
        const moods=Object.assign({},h.moods);moods[T]=m[0];h.moods=moods;
        ss("dc2-health",h);S.health=h;
        if(m[0]==="1"||m[0]==="2"){set({ritual:1.5,ritualMood:m[0]});}
        else{set({ritual:2});}
      });
      row.appendChild(b);
    });
    card.appendChild(row);
    if(ls("dc2-nameok","")){
      const mback=mk("button","ritual-skip");tx(mback,"← Back");
      mback.addEventListener("click",function(){set({ritual:0.9});});
      card.appendChild(mback);
    }
  }

  if(S.ritual===1.5){
    const q=mk("div","ritual-q");tx(q,"I'm sorry. What's weighing on you?");card.appendChild(q);
    const sub=mk("div","ritual-sub");
    ["Sickness","Stress","Sad","Other"].forEach(function(r){
      const b=mk("button","ritual-sub-btn");tx(b,r);
      b.addEventListener("click",function(){ritualMoodNote(r);});
      sub.appendChild(b);
    });
    card.appendChild(sub);
    card.appendChild(backTo(1));
  }

  if(S.ritual===2){
    const q=mk("div","ritual-q");tx(q,"How much water so far?");card.appendChild(q);
    buildWaterBar(card);
    const fb2=waterFeedback(S.waterL[T]||0);
    const note2=mk("div","");
    note2.style.cssText="text-align:center;font-size:12px;font-family:'DM Sans',sans-serif;margin-bottom:12px;font-style:italic;color:"+fb2.col;
    tx(note2,fb2.msg);
    card.appendChild(note2);
    const nxt=mk("button","ritual-next");tx(nxt,"Log & continue →");
    nxt.addEventListener("click",function(){set({ritual:3});});
    card.appendChild(nxt);
    const wskip=mk("button","ritual-skip");wskip.style.cssText="margin-top:10px;opacity:.75";tx(wskip,"Skip · I'll log later");
    wskip.addEventListener("click",function(){set({ritual:3});});
    card.appendChild(wskip);
    card.appendChild(backTo(1));
  }

  if(S.ritual===3){
    const q=mk("div","ritual-q");tx(q,"Today's chores");card.appendChild(q);
    const list=mk("div","ritual-chores");
    const dd=day(T);
    dd.chores.forEach(function(c,i){
      const row=mk("div","citem"+(done(T,i)?" done":""));
      row.addEventListener("click",function(){toggleDone(T,i);});
      const chk=mk("div","ccheck");tx(chk,done(T,i)?"✓":"");
      const ctxt=mk("span","ctxt");tx(ctxt,c);
      ap(row,chk,ctxt);list.appendChild(row);
    });
    card.appendChild(list);
    const nxt=mk("button","ritual-next");tx(nxt,"Start my day →");
    nxt.addEventListener("click",finishRitual);
    card.appendChild(nxt);
    card.appendChild(backTo(2));
  }

  const dots=mk("div","ritual-dots");
  [1,2,3].forEach(function(n){
    const d=mk("div","ritual-dot"+(Math.floor(S.ritual)>=n?" on":""));dots.appendChild(d);
  });
  card.appendChild(dots);
  const skip=mk("button","ritual-skip");tx(skip,"Skip for today");
  skip.addEventListener("click",finishRitual);
  card.appendChild(skip);
  ov.appendChild(card);
  return ov;
}

function buildBaselineArt(wrap){
  const art=mk("div","");art.id="baseline-art";
  function group(styleStr,colors){
    const g=mk("div","bl-col");g.style.cssText+=styleStr;
    const widths=["92%","82%","72%"];const ops=[".95",".65",".4"];
    colors.forEach(function(c,i){
      const l=mk("div","bl-line");
      l.style.cssText="width:"+widths[i]+";background:"+c+";opacity:"+ops[i];
      g.appendChild(l);
    });
    art.appendChild(g);
  }
  if(isDesktop()){
    group("left:0;width:260px",["#26395F","#1A2947","#111C34"]);
    group("left:260px;right:300px",["#EFE8DC","#CFC7BA","#ABA294"]);
    group("right:0;width:300px",["#E0D8CC","#C2B9AC","#9C9285"]);
  }else if(isTablet()){
    group("left:0;width:240px",["#26395F","#1A2947","#111C34"]);
    group("left:240px;right:0",["#EFE8DC","#CFC7BA","#ABA294"]);
  }else{
    group("left:0;right:0",["#EFE8DC","#CFC7BA","#ABA294"]);
  }
  wrap.appendChild(art);
}

    mcard.appendChild(mlbl);
    const mq=mk("div","mcard-q");
    tx(mq,"What's the bigger picture this "+MONTHS[mDate.getMonth()]+"?");
    mcard.appendChild(mq);
    if(mEditing){
      const mta=mk("textarea","mcard-ta");mta.placeholder="Take your time…";mta.rows=3;
      mta.value=S.mDraft[mkey]!==undefined?S.mDraft[mkey]:mset;
      mta.addEventListener("input",function(e){S.mDraft[mkey]=e.target.value;});
      mcard.appendChild(mta);
      const msave=mk("button","mcard-save");
      tx(msave,mset?"Update theme ✦":"Set month theme ✦");
      msave.addEventListener("click",function(){saveMonthIntent(mkey);});
      mcard.appendChild(msave);
    } else {
      const fr=mk("div","mcard-frame");tx(fr,mset);mcard.appendChild(fr);
      const eb=mk("button","mcard-edit");tx(eb,"✎ edit");
      eb.addEventListener("click",function(){S.mDraft[mkey]=mset;set({mEdit:mkey});});
      mcard.appendChild(eb);
    }
    scroll.appendChild(mcard);
  }

  target.appendChild(scroll);

  if(contentArea)wrap.appendChild(contentArea);

  // ── DESKTOP RIGHT PANEL — contextual per view ──
  if(isDesktop()){
    const rp=mk("div","");rp.id="right-panel";

    if(nav==="today"){
      // Weekly view (pressable → Week) + water
      const rpHdr=mk("div","rp-hdr");tx(rpHdr,"This week");rp.appendChild(rpHdr);
      const wkWrap=mk("div","rp-pressable");
      wd.forEach(function(d){
        const k=pad(d);const data=S.data[k]||{chores:defaultsFor(k),schedule:[],journal:"",temp:"--"};const isT=k===T;
        const card=mk("div","wcard"+(isT?" today":""));
        card.style.marginBottom="8px";card.style.pointerEvents="none";
        const top2=mk("div","wcard-top");
        const left=mk("div","");
        const wname=mk("span","wcard-name");tx(wname,DAYS[d.getDay()]);
        const wsub=mk("span","wcard-sub");tx(wsub,String(d.getDate()));
        ap(left,wname,wsub);
        if(isT){const badge=mk("span","badge");tx(badge,"Today");left.appendChild(badge);}
        ap(top2,left);card.appendChild(top2);
        if((data.schedule||[]).length){
          const tgs=mk("div","tags");
          (data.schedule||[]).slice(0,2).forEach(function(s){const t=mk("span","tag");tx(t,s.time+" "+s.label);tgs.appendChild(t);});
          card.appendChild(tgs);
        }
        const dnCnt=(data.chores||[]).filter(function(_,i){return done(k,i);}).length;
        if((data.chores||[]).length){const wcd=mk("div","wcard-done");tx(wcd,"✓ "+dnCnt+"/"+(data.chores||[]).length);card.appendChild(wcd);}
        wkWrap.appendChild(card);
      });
      const hint=mk("div","rp-press-hint");tx(hint,"Tap to open week →");
      wkWrap.appendChild(hint);
      wkWrap.addEventListener("click",function(){navTo("week");});
      rp.appendChild(wkWrap);
      const mh=mk("div","rp-hdr");mh.style.marginTop="18px";tx(mh,"Mood");rp.appendChild(mh);
      buildMoodRow(rp,true);
      buildWaterCard(rp);

    } else if(nav==="week"){
      // Monthly calendar (pressable → Plan) + hero only
      const rpHdr=mk("div","rp-hdr");tx(rpHdr,"This month");rp.appendChild(rpHdr);
      const calWrap=mk("div","rp-pressable");
      buildMiniMonth(calWrap);
      const hint=mk("div","rp-press-hint");tx(hint,"Tap to open plan →");
      calWrap.appendChild(hint);
      calWrap.addEventListener("click",function(){navTo("plan");});
      rp.appendChild(calWrap);
      // hero only — opens health popup
      const hero=mk("div","health-hero");hero.style.marginTop="16px";
      const hl=mk("div","hh-lbl");tx(hl,"Year in Health");
      const ht=mk("div","hh-title");tx(ht,"Your body, tracked all year");
      const hs=mk("div","hh-sub");tx(hs,"Log daily. Get a full performance report every December.");
      const hc=mk("div","hh-cta");tx(hc,"Start tracking →");
      ap(hero,hl,ht,hs,hc);
      hero.addEventListener("click",function(){healthScrollTop=0;set({healthModal:true});});
      rp.appendChild(hero);

    } else if(nav==="plan"){
      // Day preview
      const pdd=day(planDay);
      const pdDate=new Date(planDay+"T12:00:00");
      const dph=mk("div","dp-hdr");tx(dph,"Day preview");rp.appendChild(dph);
      const dpt=mk("div","dp-title");tx(dpt,DAYS[pdDate.getDay()]+", "+pdDate.getDate()+" "+MONTHS[pdDate.getMonth()]);rp.appendChild(dpt);
      const dps=mk("div","dp-sub");tx(dps,(pdd.schedule||[]).length+" events · "+(pdd.chores||[]).length+" chores");rp.appendChild(dps);
      if((pdd.schedule||[]).length){
        const s1=mk("div","dp-sec");tx(s1,"Schedule");rp.appendChild(s1);
        pdd.schedule.forEach(function(ev){
          const row=mk("div","dp-ev");
          const t=mk("span","dp-ev-time");tx(t,ev.time||"·");
          const l=mk("span","dp-ev-label");tx(l,ev.label);
          ap(row,t,l);rp.appendChild(row);
        });
      }
      if((pdd.chores||[]).length){
        const s2=mk("div","dp-sec");tx(s2,"Chores");rp.appendChild(s2);
        pdd.chores.forEach(function(c){
          const row=mk("div","dp-chore");
          const dot=mk("div","dp-chore-dot");const s=mk("span","");tx(s,c);
          ap(row,dot,s);rp.appendChild(row);
        });
      }
      if(!(pdd.schedule||[]).length&&!(pdd.chores||[]).length){
        const em=mk("div","dp-empty");tx(em,"Nothing planned yet. Tap ＋ to start.");rp.appendChild(em);
      }
      // Health bar trigger in right panel
      const hbTrigger=mk("button","healthbar-trigger");hbTrigger.style.marginTop="20px";
      const hbIcon=mk("span","hbt-icon");tx(hbIcon,"❤️");
      const hbText=mk("div","hbt-text");
      const hbTitle=mk("div","hbt-title");tx(hbTitle,"Open Health Bar");
      const hbSub=mk("div","hbt-sub");tx(hbSub,"Log weight, mood & more");
      ap(hbText,hbTitle,hbSub);
      const hbArrow=mk("span","hbt-arrow");tx(hbArrow,"→");
      ap(hbTrigger,hbIcon,hbText,hbArrow);
      hbTrigger.addEventListener("click",function(){healthScrollTop=0;set({healthModal:true});});
      rp.appendChild(hbTrigger);
      buildGoalTrigger(rp);
    }
    wrap.appendChild(rp);
  }

  // ── PHONE BOTTOM NAV ──
  if(!isTablet()){
    const bnav=mk("div","");bnav.id="bnav";
    [["today","📅","Today"],["week","🗓","Week"],["plan","✏️","Month"]].forEach(function(item){
      const btn=mk("button","nbtn"+(nav===item[0]?" on":""));
      const iconWrap=mk("div","nbtn-icon");
      const icon=mk("span","");tx(icon,item[1]);
      iconWrap.appendChild(icon);
      const lbl=mk("span","nlbl");tx(lbl,item[2]);
      ap(btn,iconWrap,lbl);
      btn.addEventListener("click",function(){navTo(item[0]);});
      bnav.appendChild(btn);
    });
    wrap.appendChild(bnav);
  }
  buildBaselineArt(wrap);
  return wrap;
}

function renderModal(){
  const isEdit=S.meditIdx!==null&&S.meditIdx!==undefined;
  const ov=mk("div","moverlay");ov.addEventListener("click",function(){set({modal:false});});
  const sheet=mk("div","msheet");sheet.addEventListener("click",function(e){e.stopPropagation();});
  const handle=mk("div","mhandle");
  const mtitle=mk("div","mtitle");tx(mtitle,isEdit?"Edit event":"Add event");
  const msub=mk("div","msub");tx(msub,fmtDate(S.mdest));
  const ti=mk("input","minput");ti.type="time";ti.value=S.mtime;ti.addEventListener("input",function(e){S.mtime=e.target.value;});
  const tlbl=mk("div","");tlbl.style.cssText="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;color:#B8B0A8;text-transform:uppercase;margin-bottom:6px;text-align:left";
  tx(tlbl,"Starts · optional");
  const elbl=mk("div","");elbl.style.cssText=tlbl.style.cssText;elbl.style.marginTop="10px";
  tx(elbl,"Ends · optional");
  const ei=mk("input","minput");ei.type="time";ei.value=S.mend||"";
  ei.addEventListener("input",function(e){S.mend=e.target.value;});
  const vi=mk("input","minput");vi.type="text";vi.placeholder="What's happening?";vi.value=S.mval;
  vi.addEventListener("input",function(e){S.mval=e.target.value;});
  vi.addEventListener("keydown",function(e){if(e.key==="Enter")saveEvent();});
  const mr=mk("div","mrow");
  const cancelBtn=mk("button","mbtn sec");tx(cancelBtn,"Cancel");cancelBtn.addEventListener("click",function(){set({modal:false});});
  const saveBtn=mk("button","mbtn pri");tx(saveBtn,isEdit?"Update":"Save");saveBtn.addEventListener("click",saveEvent);
  ap(mr,cancelBtn,saveBtn);ap(sheet,handle,mtitle,msub,vi,tlbl,ti,elbl,ei,mr);ov.appendChild(sheet);
  setTimeout(function(){vi.focus();},100);
  return ov;
}

function renderConfirm(){
  const ov=mk("div","confirm-overlay");ov.addEventListener("click",function(){set({confirmMsg:null,confirmAction:null});});
  const box=mk("div","confirm-box");box.addEventListener("click",function(e){e.stopPropagation();});
  const msg=mk("div","confirm-msg");tx(msg,S.confirmMsg);
  const row=mk("div","confirm-row");
  const cancelBtn=mk("button","confirm-cancel");tx(cancelBtn,"Cancel");cancelBtn.addEventListener("click",function(){set({confirmMsg:null,confirmAction:null});});
  const okBtn=mk("button","confirm-ok");tx(okBtn,"Delete");
  okBtn.addEventListener("click",function(){const fn=S.confirmAction;set({confirmMsg:null,confirmAction:null});if(fn)fn();});
  ap(row,cancelBtn,okBtn);ap(box,msg,row);ov.appendChild(box);
  return ov;
}

function renderActionMenu(){
  const x=S.actionMenu.x,y=S.actionMenu.y,items=S.actionMenu.items;
  const frag=document.createDocumentFragment();
  const ov=mk("div","menu-overlay");ov.addEventListener("click",function(){set({actionMenu:null});});
  const menu=mk("div","action-menu");
  menu.style.left=x+"px";menu.style.top=Math.min(y,window.innerHeight-220)+"px";
  items.forEach(function(item,i){
    if(i>0){menu.appendChild(mk("div","action-menu-divider"));}
    const btn=mk("button","action-menu-item"+(item.danger?" danger":""));
    tx(btn,item.icon+" "+item.label);
    btn.addEventListener("click",function(){set({actionMenu:null});item.action();});
    menu.appendChild(btn);
  });
  frag.appendChild(ov);frag.appendChild(menu);
  return frag;
}

/* Sheets are rebuilt on every render, so their scroll position has to be
   remembered outside the DOM — otherwise a toast throws you back to the top. */
var setScrollTop=0,healthScrollTop=0;
function render(){
  const root=document.getElementById("app");
  const prevScroll=root.querySelector(".scroll");
  const savedTop=prevScroll?prevScroll.scrollTop:0;
  const prevSet=root.querySelector(".set-card");
  if(prevSet)setScrollTop=prevSet.scrollTop;
  const prevHealth=root.querySelector(".health-modal");
  if(prevHealth)healthScrollTop=prevHealth.scrollTop;
  root.innerHTML="";
  const mainEl=S.view==="lock"?renderLock():renderMain();
  if(S.navAnim){mainEl.classList.add("nav-animating");}
  if(S.navEntering==="right"){mainEl.classList.add("nav-entering");}
  if(S.navEntering==="left"){mainEl.classList.add("nav-entering-left");}
  root.appendChild(mainEl);
  if(S.modal)root.appendChild(renderModal());
  if(S.ritual)root.appendChild(renderRitual());
  if(S.targetWiz)root.appendChild(renderTargetWiz());
  if(S.exportMenu){
    const eov=mk("div","ritual-overlay");
    eov.addEventListener("click",function(){set({exportMenu:false});});
    const ecard=mk("div","ritual-card");
    ecard.addEventListener("click",function(e){e.stopPropagation();});
    const elb=mk("div","ritual-step");tx(elb,"⬇ Download your data");
    ecard.appendChild(elb);
    const eq=mk("div","ritual-q");eq.style.fontSize="17px";tx(eq,"Choose your report");
    ecard.appendChild(eq);
    function expRow(ico,title,sub,badge,badgeCls,locked,fn,note){
      const r=mk("button","exp-row"+(locked?" locked":""));
      const i=mk("span","exp-ico");tx(i,ico);
      const t=mk("div","exp-t");
      const tt=mk("div","exp-title");tx(tt,title);
      const ts=mk("div","exp-sub");tx(ts,sub);
      ap(t,tt,ts);
      if(note){const nn=mk("div","exp-note");tx(nn,note[0]+" ");
        const nb=mk("b","");tx(nb,note[1]);nn.appendChild(nb);t.appendChild(nn);}
      const b=mk("span","exp-badge "+badgeCls);tx(b,badge);
      ap(r,i,t,b);
      r.addEventListener("click",fn);
      return r;
    }
    ecard.appendChild(expRow("🩺","Health Report","For your doctor · PDF","Free","free",false,function(){
      set({exportMenu:false});buildHealthReport();
    }));
    ecard.appendChild(expRow("📄","Daily","Today's report · PDF","Free","free",false,function(){
      set({exportMenu:false});buildDailyReport();
    }));
    ecard.appendChild(expRow("📊","Monthly","Full month · trends & habits","Plus","plus",true,function(){
      set({exportMenu:false});buildMonthlyReport();
    }));
    ecard.appendChild(expRow("🏆","Yearly","Your year in full · arc, weather, patterns, letter","Plus","plus",true,function(){
      set({exportMenu:false});buildYearlyReport();
    },["Issued","Dec to Feb"]));
    const ecl=mk("button","ritual-skip");tx(ecl,"Close");
    ecl.addEventListener("click",function(){set({exportMenu:false});});
    ecard.appendChild(ecl);
    eov.appendChild(ecard);
    root.appendChild(eov);
  }
  if(S.settingsMenu){buildSettings(root);}
  if(S.goalsOpen)buildGoalsView(root);
  if(S.goalWiz)root.appendChild(renderGoalWiz());
  if(S.todoWhen)root.appendChild(renderTodoWhen());
  if(S.dayView)buildDayView(root);
  if(S.waterSheet){
    const wov=mk("div","ritual-overlay daypick-ov");
    wov.addEventListener("click",function(){set({waterSheet:false});});
    const wc=mk("div","ritual-card");
    wc.addEventListener("click",function(e){e.stopPropagation();});
    const ws2=mk("div","ritual-step");tx(ws2,"\u25c8 Hydration");wc.appendChild(ws2);
    const wq=mk("div","ritual-q");tx(wq,"How much water so far?");wc.appendChild(wq);
    buildWaterBar(wc);
    const wfb=waterFeedback(S.waterL[T]||0);
    const wn=mk("div","");
    wn.style.cssText="text-align:center;font-size:12px;font-style:italic;margin-bottom:14px;color:"+wfb.col;
    tx(wn,wfb.msg);wc.appendChild(wn);
    const wd=mk("button","ritual-next");tx(wd,"Done");
    wd.addEventListener("click",function(){set({waterSheet:false});});
    wc.appendChild(wd);
    wov.appendChild(wc);root.appendChild(wov);
  }
  if(S.moodSheet){
    const mov=mk("div","ritual-overlay daypick-ov");
    mov.addEventListener("click",function(){set({moodSheet:false});});
    const mc=mk("div","ritual-card");
    mc.addEventListener("click",function(e){e.stopPropagation();});
    const ms=mk("div","ritual-step");tx(ms,"◈ Mood");mc.appendChild(ms);
    const mq=mk("div","ritual-q");
    tx(mq,"How are you feeling"+(S.userName?", "+S.userName:"")+"?");mc.appendChild(mq);
    const mrow=mk("div","ritual-moods");
    [["1","😞","Very bad"],["2","😕","Bad"],["3","😐","I'm okay"],
     ["4","🙂","Good"],["5","😄","Great"]].forEach(function(m){
      const b=mk("button","ritual-mood");
      const f=mk("span","face");tx(f,m[1]);
      const l=mk("span","lbl");tx(l,m[2]);
      ap(b,f,l);
      b.addEventListener("click",function(){setMood(m[0]);});
      mrow.appendChild(b);
    });
    mc.appendChild(mrow);
    const msk=mk("button","ritual-skip");tx(msk,"Not now");
    msk.addEventListener("click",function(){set({moodSheet:false});});
    mc.appendChild(msk);
    mov.appendChild(mc);root.appendChild(mov);
  }
  if(S.dayPick){
    const dp=S.dayPick;
    const dov=mk("div","ritual-overlay daypick-ov");
    dov.addEventListener("click",function(){set({dayPick:null,settingsMenu:dp.edit?true:false});});
    const dcard=mk("div","ritual-card");
    dcard.addEventListener("click",function(e){e.stopPropagation();});
    const dstep=mk("div","ritual-step");
    tx(dstep,dp.edit?"\u25c8 Chore days":"\u25c8 New chore");
    dcard.appendChild(dstep);
    const dq=mk("div","ritual-q");tx(dq,"Which days for \u201c"+dp.name+"\u201d?");
    dcard.appendChild(dq);

    /* chips follow the user\u2019s week start */
    const dnames=dowLabels("n");
    const dchips=mk("div","tchips");
    for(let i=0;i<7;i++){
      const real=(prefWeekStart()==="sun")?i:((i+1)%7);
      const on=dp.days.indexOf(real)>=0;
      const c=mk("button","tchip"+(on?" on":""));tx(c,dnames[i]);
      c.addEventListener("click",function(){
        const j=dp.days.indexOf(real);
        if(j>=0)dp.days.splice(j,1);else dp.days.push(real);
        render();
      });
      dchips.appendChild(c);
    }
    dcard.appendChild(dchips);

    const dall=mk("button","ritual-sub-btn");
    dall.style.cssText="display:block;margin:0 auto 16px";
    tx(dall,dp.days.length===7?"Clear all":"Every day");
    dall.addEventListener("click",function(){
      dp.days=(dp.days.length===7)?[]:[0,1,2,3,4,5,6];render();
    });
    dcard.appendChild(dall);

    const dgo=mk("button","ritual-next");
    tx(dgo,dp.edit?"Save days":"Add on these days");
    dgo.addEventListener("click",function(){
      if(!dp.days.length){showToast("Pick at least one day");return;}
      applyChoreDays(dp.name,dp.days,dp.edit?T:dp.dest);
      set({dayPick:null,settingsMenu:dp.edit?true:false});
      showToast(dp.days.length===7?"Added to every day \u2713"
        :"Added on "+dp.days.length+" day"+(dp.days.length===1?"":"s")+" \u2713");
    });
    dcard.appendChild(dgo);

    if(!dp.edit){
      const donce=mk("button","ritual-sub-btn");
      donce.style.cssText="display:block;width:100%;margin-top:9px;text-align:center";
      tx(donce,"Just this day");
      donce.addEventListener("click",function(){
        putChore(dp.dest,dp.name);
        set({dayPick:null});showToast("Added \u2713");
      });
      dcard.appendChild(donce);
    }

    const dcx=mk("button","ritual-skip");tx(dcx,"Cancel");
    dcx.addEventListener("click",function(){set({dayPick:null,settingsMenu:dp.edit?true:false});});
    dcard.appendChild(dcx);
    dov.appendChild(dcard);root.appendChild(dov);
  }
  if(S.reflectOpen){
    const rov=mk("div","ritual-overlay ltr-ov");
    rov.addEventListener("click",function(){set({reflectOpen:false});});
    const rcard=mk("div","ritual-card ltr-card");
    rcard.addEventListener("click",function(e){e.stopPropagation();});
    rcard.appendChild(mk("div","ltr-seal"));
    const rin=mk("div","ltr-in");

    const rdate=mk("div","ltr-date");
    tx(rdate,new Date(T+"T12:00:00").toLocaleDateString("en-GB",
      {weekday:"long",day:"numeric",month:"long"}));
    rin.appendChild(rdate);

    const rhi=mk("div","ltr-hi");tx(rhi,"Your week starts today");
    rin.appendChild(rhi);

    /* the numbers, shown as fill so a weak week reads as weak */
    const rst=weekStats();
    const wtgt=prefWaterTarget();
    const figs=[
      ["lf1",String(rst.doneC),"/"+rst.totC,"chores done",rst.totC?rst.doneC/rst.totC:0],
      ["lf2",rst.avgL.toFixed(1),"L","water a day",Math.min(1,rst.avgL/wtgt)],
      ["lf3",String(rst.logged),"/7","days logged",rst.logged/7]
    ];
    const rfg=mk("div","ltr-figs");
    figs.forEach(function(f){
      const fw=mk("div","ltr-fig "+f[0]);
      const fn=mk("div","n");tx(fn,f[1]);
      const fe=mk("em","");tx(fe,f[2]);fn.appendChild(fe);
      const fb=mk("div","bar");
      const fi=mk("i","");fi.style.width=Math.round(Math.max(0,Math.min(1,f[4]))*100)+"%";
      fb.appendChild(fi);
      const fl=mk("div","l");tx(fl,f[3]);
      ap(fw,fn,fb,fl);rfg.appendChild(fw);
    });
    rin.appendChild(rfg);

    if(S.reflectLoading){
      const lp=mk("div","ltr-body");
      const lpp=mk("p","");tx(lpp,"Reading back over your week\u2026");
      lp.appendChild(lpp);rin.appendChild(lp);
    } else {
      const lines=String(S.reflectText||"").split("\n")
        .map(function(l){return l.trim();}).filter(Boolean);
      const said=[];
      function upper1(t){return t?t.charAt(0).toUpperCase()+t.slice(1):t;}
      /* tolerate older cached text that carried an "Insight:" line */
      lines.forEach(function(l){
        if(/^insight\s*:/i.test(l))return;
        said.push(l);
      });
      if(said.length){
        const rbody=mk("div","ltr-body");
        const pp=mk("p","");tx(pp,upper1(said[0]));
        rbody.appendChild(pp);rin.appendChild(rbody);
      }
      const rtm=mk("div","ltr-tmr");
      tx(rtm,"Log in tomorrow and register what you have done \u2014 start the week on the right foot.");
      rin.appendChild(rtm);
    }

    const rsg=mk("div","ltr-sign");
    const rnm=mk("div","ltr-name");tx(rnm,"\u2014 Jarvis");
    rsg.appendChild(rnm);rin.appendChild(rsg);

    const rcl=mk("button","ltr-btn");tx(rcl,"Thank you, Jarvis");
    rcl.addEventListener("click",function(){set({reflectOpen:false});});
    rin.appendChild(rcl);

    rcard.appendChild(rin);
    rov.appendChild(rcard);
    root.appendChild(rov);
  }
  if(S.healthModal){
    const ov=mk("div","health-modal-overlay");
    ov.addEventListener("click",function(){
      if(S.backToSettings)set({healthModal:false,backToSettings:false,settingsMenu:true});
      else set({healthModal:false});
    });
    ov.appendChild(buildHealthModalContent());
    root.appendChild(ov);
  }
  if(S.actionMenu)root.appendChild(renderActionMenu());
  if(S.confirmMsg)root.appendChild(renderConfirm());
  if(S.toast){const t=mk("div","toast");tx(t,S.toast);root.appendChild(t);}
  if(savedTop>0&&!S.navAnim){const ns=root.querySelector(".scroll");if(ns)ns.scrollTop=savedTop;}
  if(setScrollTop>0){const nsc=root.querySelector(".set-card");if(nsc)nsc.scrollTop=setScrollTop;}
  if(healthScrollTop>0){const nhm=root.querySelector(".health-modal");if(nhm)nhm.scrollTop=healthScrollTop;}
}

let resizeTimer=null;
let lastW=window.innerWidth;
window.addEventListener("resize",function(){
  var w=window.innerWidth;
  var crossed=(lastW<768)!==(w<768)||(lastW<1200)!==(w<1200);
  lastW=w;
  if(!crossed)return;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(render,150);
});

// ── TRUE VIEWPORT HEIGHT ──
// Measure the device's real visible height in pixels and drive all layout from it.
// window.innerHeight is always correct — no vh/dvh guessing, no gaps.
// Rebuild cleanly when returning from another app (iOS restore fix)
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){setTimeout(render,80);}
});
