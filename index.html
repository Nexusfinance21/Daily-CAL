/* ===== YEARLY REPORT (Plus) =====================================
   Issued December\u2013February only. Dec -> the year now ending;
   Jan/Feb -> the year that just ended. Needs >= 6 months of data.
   ================================================================ */

function escH(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* which year a yearly report covers right now, or null if out of window */
function yearlyWindow(){
  var d=new Date(T+"T12:00:00");
  var m=d.getMonth(), y=d.getFullYear();
  if(m===11)return y;
  if(m===0||m===1)return y-1;
  return null;
}
function yearlyOpen(){return yearlyWindow()!==null;}

function buildYearlyReport(){
  var W=yearlyWindow();
  var nowY=new Date(T+"T12:00:00").getFullYear();
  /* in window: that year. Outside: Plus sees this year in progress,
     everyone else sees last complete year as a locked preview. */
  var Y=S.reportYear?S.reportYear:(W!==null)?W:(isPlus()?nowY:nowY-1);

  var MN=["January","February","March","April","May","June",
          "July","August","September","October","November","December"];
  var MI=["J","F","M","A","M","J","J","A","S","O","N","D"];
  var WD=dowLabels("n");
  var SEASON=[
    "linear-gradient(180deg,#7FB6E4,#4A78B8)","linear-gradient(180deg,#7FB6E4,#4A78B8)",
    "linear-gradient(180deg,#6FD4C0,#35A08C)","linear-gradient(180deg,#6FD4C0,#35A08C)",
    "linear-gradient(180deg,#6FD4C0,#35A08C)","linear-gradient(180deg,#F7DE9C,#E09B3C)",
    "linear-gradient(180deg,#F7DE9C,#E09B3C)","linear-gradient(180deg,#F7DE9C,#E09B3C)",
    "linear-gradient(180deg,#E5A06A,#C4653A)","linear-gradient(180deg,#E5A06A,#C4653A)",
    "linear-gradient(180deg,#E5A06A,#C4653A)","linear-gradient(180deg,#7FB6E4,#4A78B8)"
  ];

  function isLeapY(y){return (y%4===0&&y%100!==0)||y%400===0;}
  function dimY(y,m){return [31,isLeapY(y)?29:28,31,30,31,30,31,31,30,31,30,31][m];}
  function kY(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
  var totalDays=isLeapY(Y)?366:365;

  /* ---------- per-month + yearly totals ---------- */
  var mPct=[],mPerfect=[],mHas=[],monthsWithData=0;
  var doneTotal=0,daysLogged=0,perfectTotal=0,ratioSum=0,ratioDays=0;

  for(var m=0;m<12;m++){
    var rs=0,rn=0,pf=0,any=0;
    for(var d=1;d<=dimY(Y,m);d++){
      var k=kY(Y,m,d), dd=S.data[k];
      var sc=monthDayScore(Y,m,d);
      if(sc>0){daysLogged++;any++;}
      if(sc===4){pf++;perfectTotal++;}
      if(dd&&dd.chores&&dd.chores.length){
        var t=dd.chores.length,dn=0;
        for(var i=0;i<t;i++){if(done(k,i))dn++;}
        doneTotal+=dn;rs+=dn/t;rn++;ratioSum+=dn/t;ratioDays++;
      }
    }
    mPct[m]=rn?Math.round(rs/rn*100):0;
    mPerfect[m]=pf;
    mHas[m]=any>0;
    if(any>0)monthsWithData++;
  }
  var yearPct=ratioDays?Math.round(ratioSum/ratioDays*100):0;

  var thinMode=(monthsWithData<6);

  /* ---------- longest streak (same rule as the app's flame chip) ---------- */
  var streak=0,run=0;
  for(var m2=0;m2<12;m2++){
    for(var d2=1;d2<=dimY(Y,m2);d2++){
      if(choreDayComplete(kY(Y,m2,d2))){run++;if(run>streak)streak=run;}
      else run=0;
    }
  }

  /* ---------- best / hardest month ---------- */
  var bestM=-1,worstM=-1;
  for(var m3=0;m3<12;m3++){
    if(!mHas[m3])continue;
    if(bestM<0||mPct[m3]>mPct[bestM])bestM=m3;
    if(worstM<0||mPct[m3]<mPct[worstM])worstM=m3;
  }
  if(bestM<0){bestM=0;worstM=0;}

  /* ---------- weather ---------- */
  var wh=ls("dc2-weather",{});
  var wDays=0,hiV=null,hiD="",loV=null,loD="";
  var bk={clear:0,partly:0,rain:0,storm:0};
  var tSum=[],tN=[];
  for(var z=0;z<12;z++){tSum[z]=0;tN[z]=0;}
  for(var m4=0;m4<12;m4++){
    for(var d4=1;d4<=dimY(Y,m4);d4++){
      var w=wh[kY(Y,m4,d4)];
      if(!w)continue;
      wDays++;tSum[m4]+=w.t;tN[m4]++;
      if(hiV===null||w.hi>hiV){hiV=w.hi;hiD=d4+" "+MN[m4];}
      if(loV===null||w.lo<loV){loV=w.lo;loD=d4+" "+MN[m4];}
      var c=w.c;
      if(c===0)bk.clear++;
      else if(c<=3)bk.partly++;
      else if(c<=77)bk.rain++;
      else bk.storm++;
    }
  }
  var rainDays=bk.rain+bk.storm;
  var tAvgAll=0,tAvgN=0;
  for(var z2=0;z2<12;z2++){if(tN[z2]){tAvgAll+=tSum[z2]/tN[z2];tAvgN++;}}
  var avgT=tAvgN?Math.round(tAvgAll/tAvgN):null;

  /* ---------- mood ---------- */
  var moodM=[],moodSum=0,moodN=0;
  for(var m5=0;m5<12;m5++){
    var ms=0,mn=0;
    for(var d5=1;d5<=dimY(Y,m5);d5++){
      var mv=(S.health.moods||{})[kY(Y,m5,d5)];
      if(mv){ms+=parseInt(mv,10);mn++;moodSum+=parseInt(mv,10);moodN++;}
    }
    moodM[m5]=mn?ms/mn:null;
  }
  var moodAvg=moodN?(moodSum/moodN).toFixed(1):"\u2014";

  /* ---------- water ---------- */
  var wtM=[],wtSum=0,wtN=0;
  for(var m6=0;m6<12;m6++){
    var ws=0,wn=0;
    for(var d6=1;d6<=dimY(Y,m6);d6++){
      var v=S.waterL[kY(Y,m6,d6)];
      if(v){ws+=v;wn++;wtSum+=v;wtN++;}
    }
    wtM[m6]=wn?ws/wn:null;
  }
  var waterAvg=wtN?(wtSum/wtN).toFixed(1):"0.0";
  var firstW=null,firstWM=-1;
  for(var z3=0;z3<12;z3++){if(wtM[z3]!==null){firstW=wtM[z3];firstWM=z3;break;}}

  /* ---------- habits ---------- */
  var hm={};
  for(var m7=0;m7<12;m7++){
    for(var d7=1;d7<=dimY(Y,m7);d7++){
      var k7=kY(Y,m7,d7),dd7=S.data[k7];
      if(!dd7||!dd7.chores)continue;
      dd7.chores.forEach(function(c7,i7){
        if(!hm[c7])hm[c7]={d:0,t:0};
        hm[c7].t++;
        if(done(k7,i7))hm[c7].d++;
      });
    }
  }
  var habits=Object.keys(hm).map(function(n){
    return {n:n,p:Math.round(hm[n].d/hm[n].t*100)};
  }).sort(function(a,b){return b.p-a.p;}).slice(0,6);

  /* ---------- weekday rhythm ---------- */
  var wdS=[0,0,0,0,0,0,0],wdN=[0,0,0,0,0,0,0];
  for(var m8=0;m8<12;m8++){
    for(var d8=1;d8<=dimY(Y,m8);d8++){
      var k8=kY(Y,m8,d8),dd8=S.data[k8];
      if(!dd8||!dd8.chores||!dd8.chores.length)continue;
      var t8=dd8.chores.length,dn8=0;
      for(var i8=0;i8<t8;i8++){if(done(k8,i8))dn8++;}
      var wd=dowIdx(new Date(Y,m8,d8));
      wdS[wd]+=dn8/t8;wdN[wd]++;
    }
  }
  var wdP=[],bW=0,wW=0;
  for(var q=0;q<7;q++)wdP[q]=wdN[q]?Math.round(wdS[q]/wdN[q]*100):0;
  for(var q2=1;q2<7;q2++){if(wdP[q2]>wdP[bW])bW=q2;if(wdP[q2]<wdP[wW])wW=q2;}

  /* ---------- reflections: up to 4, spread across the year ---------- */
  var diary=ls("dc2-diary",{}),all=[];
  for(var m9=0;m9<12;m9++){
    for(var d9=1;d9<=dimY(Y,m9);d9++){
      var e=diary[kY(Y,m9,d9)];
      if(e&&e.a)all.push({d:d9,m:m9,q:e.q,a:e.a});
    }
  }
  var refl=[];
  if(all.length<=4)refl=all;
  else{
    for(var r=0;r<4;r++)refl.push(all[Math.floor(r*(all.length-1)/3)]);
  }

  /* ---------- builders ---------- */
  function arcHTML(){
    var maxP=1;
    for(var a=0;a<12;a++)if(mPerfect[a]>maxP)maxP=mPerfect[a];
    var h='<table class="arctbl"><tr>';
    for(var a2=0;a2<12;a2++){
      var op=(0.34+(mPerfect[a2]/maxP)*0.55).toFixed(2);
      h+='<td><span class="barpct">'+(mHas[a2]?mPct[a2]:"")+'</span>'+
         '<span class="bartrack">'+(mHas[a2]
           ?'<span class="bar" style="height:'+Math.max(3,mPct[a2])+'%;background:'+SEASON[a2]+'"></span>'
           :'<span class="bar ghost" style="height:100%"></span>')+
         '</span><span class="barlab">'+MI[a2]+'</span>'+
         '<span class="pd" style="opacity:'+(mPerfect[a2]?op:0)+'">'+(mPerfect[a2]||"")+'</span></td>';
    }
    return h+'</tr></table>';
  }

  function polyline(vals,lo,hi,W,H){
    var pts=[],n=vals.length,seen=0;
    for(var i=0;i<n;i++){
      if(vals[i]===null||vals[i]===undefined)continue;
      var x=(n>1?i/(n-1):0)*W;
      var yy=H-((vals[i]-lo)/((hi-lo)||1)*H);
      pts.push(x.toFixed(1)+","+Math.max(2,Math.min(H-2,yy)).toFixed(1));
      seen++;
    }
    return seen>1?pts.join(" "):"";
  }

  var tVals=[];
  for(var z4=0;z4<12;z4++)tVals[z4]=tN[z4]?tSum[z4]/tN[z4]:null;
  var tMin=null,tMax=null;
  for(var z5=0;z5<12;z5++){
    if(tVals[z5]===null)continue;
    if(tMin===null||tVals[z5]<tMin)tMin=tVals[z5];
    if(tMax===null||tVals[z5]>tMax)tMax=tVals[z5];
  }

  var wthHTML;
  if(wDays>0){
    var rows=[["Clear",bk.clear,"linear-gradient(90deg,#F5D083,#E8A03C)"],
              ["Partly cloudy",bk.partly,"linear-gradient(90deg,#E0A552,#C98A5E)"],
              ["Rainy",bk.rain,"linear-gradient(90deg,#5D9BD1,#3B7BC4)"],
              ["Stormy",bk.storm,"linear-gradient(90deg,#C4553A,#8E3B2C)"]];
    var maxB=Math.max(1,bk.clear,bk.partly,bk.rain,bk.storm);
    var rH="";
    rows.forEach(function(rr){
      rH+='<div class="wrow"><span class="wname">'+rr[0]+'</span>'+
        '<span class="wtrack"><span class="wfill" style="width:'+
        Math.round(rr[1]/maxB*100)+'%;background:'+rr[2]+'"></span></span>'+
        '<span class="wn">'+rr[1]+'</span></div>';
    });
    var curveP=polyline(tVals,(tMin===null?0:tMin-1),(tMax===null?1:tMax+1),520,74);
    var curveH=curveP
      ?'<div class="curve"><svg width="100%" height="74" viewBox="0 0 520 74" preserveAspectRatio="none" aria-hidden="true">'+
        '<defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">'+
        '<stop offset="0%" stop-color="#7FB6E4"/><stop offset="25%" stop-color="#4FC3A8"/>'+
        '<stop offset="55%" stop-color="#F0C067"/><stop offset="80%" stop-color="#D4763F"/>'+
        '<stop offset="100%" stop-color="#7FB6E4"/></linearGradient></defs>'+
        '<polyline points="'+curveP+'" fill="none" stroke="url(#tg)" stroke-width="2.5" '+
        'stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        '<div class="curvelbl"><span>'+(tVals[0]!==null?"JAN "+fmtTemp(tVals[0])+"\u00b0":"")+'</span>'+
        '<span>AVG '+(avgT===null?"\u2014":fmtTemp(avgT)+"\u00b0")+'</span>'+
        '<span>'+(tVals[11]!==null?"DEC "+fmtTemp(tVals[11])+"\u00b0":"")+'</span></div></div>'
      :'';
    wthHTML='<div class="slab"><div class="slabin">'+
      '<div class="slabtag">\u25c8 Recorded across '+wDays+' day'+(wDays===1?"":"s")+'</div>'+
      '<div class="extremes">'+
      '<div class="ex hot"><div class="t">'+fmtTemp(hiV)+'<small>'+tempUnit()+'</small></div><div class="d">'+hiD+'</div><div class="l">Hottest</div></div>'+
      '<div class="ex cold"><div class="t">'+fmtTemp(loV)+'<small>'+tempUnit()+'</small></div><div class="d">'+loD+'</div><div class="l">Coldest</div></div>'+
      '<div class="ex rain"><div class="t">'+rainDays+'<small> days</small></div><div class="d">'+
        Math.round(rainDays/Math.max(1,wDays)*100)+'% of recorded days</div><div class="l">Rainfall</div></div>'+
      '</div>'+curveH+rH+
      '<div class="slabline">Weather was recorded on '+wDays+' of your '+daysLogged+' logged days.</div>'+
      '</div></div>';
  } else {
    wthHTML='<div class="slab"><div class="slabin">'+
      '<div class="slabtag">\u25c8 Monthly weather report</div>'+
      '<div class="slabline" style="margin-top:0;padding-top:0;border:none">'+
      'No weather was recorded for '+Y+'. Daily starts logging the sky the first time you open it each day.'+
      '</div></div></div>';
  }

  var habitHTML="";
  habits.forEach(function(hh){
    habitHTML+='<div class="hrow"><span class="hname">'+escH(hh.n)+'</span>'+
      '<span class="hbar"><i style="width:'+hh.p+'%"></i></span>'+
      '<span class="hpct">'+hh.p+'%</span></div>';
  });
  if(!habitHTML)habitHTML='<div class="hrow"><span class="hname" style="color:rgba(255,255,255,.4)">—</span>'+
    '<span class="hbar"><i style="width:0%"></i></span><span class="hpct">0%</span></div>';

  var moodP=polyline(moodM,1,5,520,62);
  var moodHTML=moodP
    ?'<div style="position:relative;z-index:1">'+
      '<svg width="100%" height="62" viewBox="0 0 520 62" preserveAspectRatio="none" aria-hidden="true">'+
      '<defs><linearGradient id="mgy" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0%" stop-color="#4A78B8"/><stop offset="45%" stop-color="#4FC3A8"/>'+
      '<stop offset="100%" stop-color="#F0C067"/></linearGradient></defs>'+
      '<polyline points="'+moodP+'" fill="none" stroke="url(#mgy)" stroke-width="2.5" '+
      'stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '<div class="curvelbl" style="color:rgba(255,255,255,.32)">'+
      '<span>JAN</span><span>AVG '+moodAvg+'</span><span>DEC</span></div></div>'
    :'<div style="position:relative;z-index:1">'+
      '<svg width="100%" height="62" viewBox="0 0 520 62" preserveAspectRatio="none" aria-hidden="true">'+
      '<line x1="0" y1="61" x2="520" y2="61" stroke="rgba(255,255,255,.16)" stroke-width="2.5" stroke-linecap="round"/>'+
      '</svg>'+
      '<div class="curvelbl" style="color:rgba(255,255,255,.32)">'+
      '<span>JAN</span><span>AVG 0.0</span><span>DEC</span></div></div>';

  var reflHTML="";
  refl.forEach(function(rr){
    reflHTML+='<div class="ref"><div class="refmeta">'+rr.d+' '+MN[rr.m]+'</div>'+
      '<div class="refq">'+escH(rr.q)+'</div>'+
      '<div class="refa">'+escH(rr.a)+'</div></div>';
  });
  if(!reflHTML)reflHTML='<div class="ref"><div class="refa" style="color:rgba(255,255,255,.3)">—</div></div>';

  var yGoals=goalsInWindow(function(by){return by.slice(0,4)===String(Y);});
  var yGoalsHTML=yGoals.length
    ?('<div class="sec"><span>The year\u2019s goals</span></div>'+goalRowsHTML(yGoals))
    :'';

  /* ---------- Gideon letter ---------- */
  var lowH=habits.length?habits[habits.length-1]:null;
  var L=[];
  L.push('<p>You finished '+Y+' at <b>'+yearPct+'%</b> across '+daysLogged+
    ' logged days. '+MN[bestM]+' was your strongest month at <b>'+mPct[bestM]+'%</b>'+
    (mPerfect[bestM]?' with '+mPerfect[bestM]+' perfect day'+(mPerfect[bestM]===1?'':'s'):'')+
    '; '+MN[worstM]+' was the hardest at '+mPct[worstM]+'%. Both are part of the same year.</p>');
  if(streak>1){
    L.push('<p>Your longest unbroken run was <b>'+streak+' days</b> \u2014 every chore, every day. '+
      'That is the clearest evidence you have of what you can hold when the conditions are right.</p>');
  }
  if(lowH){
    L.push('<p><b>'+escH(lowH.n)+'</b> finished at '+lowH.p+
      '%, the lowest of your habits. It is the one that did not yield this year, and probably still the lever.</p>');
  }
  L.push('<p>'+perfectTotal+' day'+(perfectTotal===1?'':'s')+' this year you finished whole'+
    (wdP[bW]>0?', and '+WD[bW]+' carried you more than any other day of the week':'')+
    '. Whatever next year asks, you now have evidence of what you are capable of.</p>');

  /* ---------- Plus, but outside the December\u2013February window ---------- */
  if(W===null&&isPlus()&&!thinMode){
    var soon='<div class="wrap"><div class="page">'+
      '<div class="head"><div class="mark">'+DOC_LOGO_LIGHT+'<span class="wordmark">Daily</span></div>'+
      '<div class="kicker">Yearly Report<span class="plus">Plus</span></div></div>'+
      '<div class="yearblock">'+
        '<svg class="yearsvg" viewBox="0 0 280 88" role="img" aria-label="'+Y+'">'+
        '<defs><linearGradient id="yng" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0%" stop-color="#8FB8E4"/><stop offset="40%" stop-color="#EFEFF6"/>'+
        '<stop offset="100%" stop-color="#F0C067"/></linearGradient></defs>'+
        '<text x="0" y="70" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="86" '+
        'font-weight="200" letter-spacing="-3" fill="url(#yng)">'+Y+'</text></svg>'+
        '<div class="yearlbl">Still being written</div>'+
        '<div class="theme">Your yearly report is issued each December. Everything you log '+
        'between now and then becomes part of it.</div>'+
      '</div>'+
      '<div class="sec"><span>'+Y+' so far</span></div>'+
      '<div class="figs">'+
        '<div class="fig"><div class="rule"></div><div class="n">'+doneTotal.toLocaleString()+'</div><div class="l">Chores<br>completed</div></div>'+
        '<div class="fig"><div class="rule"></div><div class="n">'+daysLogged+'</div><div class="l">Days<br>logged</div></div>'+
        '<div class="fig"><div class="rule"></div><div class="n gold">'+perfectTotal+'</div><div class="l">Perfect<br>days</div></div>'+
        '<div class="fig"><div class="rule"></div><div class="n">'+streak+'</div><div class="l">Longest<br>streak</div></div>'+
      '</div>'+
      '<div class="sec"><span>Your arc so far</span></div>'+
      '<div class="arc">'+arcHTML()+'</div>'+
      '<div class="coverage">Yearly reports are issued <span style="color:#F0C067;font-weight:600">Dec to Feb</span>.</div>'+
      '<div class="foot">\u2726 DAILY \u00b7 '+Y+'</div>'+
    '</div></div>';
    openMonthlyDoc(soon,YEARLY_CSS,"yearly-report-"+Y+"-progress.html",
      {forceOpen:true,toast:"Your year is still being written \u2726"});
    return;
  }

  /* ---------- assemble ---------- */
  var covered=monthsWithData===12
    ? 'This report covers all 12 months of '+Y+'.'
    : 'This report covers '+monthsWithData+' of 12 months of '+Y+' \u2014 only the months you logged.';

  var inner='<div class="wrap">'+

  /* ---- page 1 ---- */
  '<div class="page">'+
    '<div class="head"><div class="mark">'+DOC_LOGO_LIGHT+'<span class="wordmark">Daily</span></div>'+
    '<div class="kicker">Yearly Report<span class="plus">Plus</span></div></div>'+
    '<div class="yearblock">'+
      '<svg class="yearsvg" viewBox="0 0 280 88" role="img" aria-label="'+Y+'">'+
      '<defs><linearGradient id="yng" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0%" stop-color="#8FB8E4"/><stop offset="40%" stop-color="#EFEFF6"/>'+
      '<stop offset="100%" stop-color="#F0C067"/></linearGradient></defs>'+
      '<text x="0" y="70" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="86" '+
      'font-weight="200" letter-spacing="-3" fill="url(#yng)">'+Y+'</text></svg>'+
      '<div class="yearlbl">'+(totalDays===366?"Three hundred and sixty-six days":"Three hundred and sixty-five days")+'</div>'+
      '<div class="theme">A year of being alive is not a small thing. Here is what you did with yours.</div>'+
    '</div>'+
    '<div class="sec"><span>The year in figures</span></div>'+
    '<div class="figs">'+
      '<div class="fig"><div class="rule"></div><div class="n">'+doneTotal.toLocaleString()+'</div><div class="l">Chores<br>completed</div></div>'+
      '<div class="fig"><div class="rule"></div><div class="n">'+daysLogged+'<em>/'+totalDays+'</em></div><div class="l">Days<br>logged</div></div>'+
      '<div class="fig"><div class="rule"></div><div class="n gold">'+perfectTotal+'</div><div class="l">Perfect<br>days</div></div>'+
      '<div class="fig"><div class="rule"></div><div class="n">'+streak+'</div><div class="l">Longest<br>streak</div></div>'+
    '</div>'+
    '<div class="sec"><span>Your arc</span></div>'+
    '<div class="lead">Twelve months, each carrying its own season. Height is how much of the month you completed; '+
      'the gold numeral beneath is how many days you finished whole \u2014 brighter where there were more.</div>'+
    '<div class="arc">'+arcHTML()+
      '<div class="arckey">'+MN[bestM]+' was your strongest month at <b>'+mPct[bestM]+'%</b>, '+
      MN[worstM]+' your hardest at <b>'+mPct[worstM]+'%</b>. Across the year you held <b>'+yearPct+'%</b>.'+
      '<div class="seasonkey">'+

function playChime(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [523.25,659.25,783.99].forEach(function(f,i){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      const t=ctx.currentTime+i*0.09;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.16,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.62);
      o.start(t);o.stop(t+0.68);
    });
  }catch(e){}
}

/* ===== GOALS =========================================================
   A goal is the year-sized sibling of a target: longer horizon, looser
   cadence (weekly or monthly rather than daily), and it closes with an
   honest outcome instead of just expiring.
   ==================================================================== */
function goals(){var g=ls("dc2-goals",[]);return Array.isArray(g)?g:[];}
function saveGoals(g){ss("dc2-goals",g);}
/* days of the month a goal runs on. Older goals stored a single dom. */
function goalDoms(g){
  if(g.doms&&g.doms.length)return g.doms;
  return [g.dom||1];
}
function goalDue(g){return !g.outcome&&g.by&&g.by<=T;}
function dueGoals(){return goals().filter(goalDue);}
function daysLeft(iso){
  if(!iso)return null;
  return Math.ceil((new Date(iso+"T12:00:00")-new Date(T+"T12:00:00"))/86400000);
}
function fmtWhen(iso){
  if(!iso)return "";
  var d=new Date(iso+"T12:00:00");
  return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
}
var MONTHNAMES=["january","february","march","april","may","june","july",
  "august","september","october","november","december"];
function lastDayOf(y,m){return new Date(y,m+1,0).getDate();}
/* Understands "december", "end of year", "in 6 months", "march 2027",
   "31/12/2026" and plain ISO. Returns YYYY-MM-DD or null. */
function parseWhen(text){
  var s=String(text||"").toLowerCase().trim();
  if(!s)return null;
  var now=new Date(T+"T12:00:00"),y=now.getFullYear();
  var m;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){
    /* 2026-02-30 is well-formed but does not exist — reject rather than store it */
    var iy=+m[1],im=+m[2],id=+m[3];
    if(im<1||im>12||id<1||id>lastDayOf(iy,im-1))return null;
    return s;
  }
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    var yy=parseInt(m[3],10); if(yy<100)yy+=2000;
    return yy+"-"+z(parseInt(m[2],10))+"-"+z(parseInt(m[1],10));
  }
  if(/^tomorrow$|^tmr$/.test(s))return addDays(T,1);
  if(/^(the )?day after tomorrow$/.test(s))return addDays(T,2);
  if(/next week/.test(s))return addDays(T,7);
  if(/^(in )?a (week|fortnight)$/.test(s))return addDays(T,/fortnight/.test(s)?14:7);
  if(/end of (the )?week/.test(s))return pad(weekOf(T)[6]);
  if(/end of (the )?year|this year|by december|year end/.test(s))return y+"-12-31";
  if(/end of (the )?month/.test(s))return y+"-"+z(now.getMonth()+1)+"-"+z(lastDayOf(y,now.getMonth()));
  m=s.match(/in\s+(\d{1,3})\s*(day|week|month|year)s?/);
  if(m){
    var n=parseInt(m[1],10),d=new Date(now);
    if(m[2]==="day")d.setDate(d.getDate()+n);
    if(m[2]==="week")d.setDate(d.getDate()+n*7);
    if(m[2]==="month")d.setMonth(d.getMonth()+n);
    if(m[2]==="year")d.setFullYear(d.getFullYear()+n);
    return pad(d);
  }
  if(/next year/.test(s))return (y+1)+"-12-31";
  if(/next month/.test(s)){
    var nm=new Date(now);nm.setMonth(nm.getMonth()+1);
    return nm.getFullYear()+"-"+z(nm.getMonth()+1)+"-"+z(lastDayOf(nm.getFullYear(),nm.getMonth()));
  }
  /* a month name, with an optional year and an optional day */
  for(var i=0;i<12;i++){
    if(s.indexOf(MONTHNAMES[i])>=0||s.indexOf(MONTHNAMES[i].slice(0,3))===0||
       new RegExp("\\b"+MONTHNAMES[i].slice(0,3)+"\\b").test(s)){
      var ym=s.match(/(20\d{2})/);
      var yr=ym?parseInt(ym[1],10):y;
      if(!ym&&i<now.getMonth())yr=y+1;           /* a month already gone means next year */
      var dm=s.match(/\b(\d{1,2})(st|nd|rd|th)?\b/);
      var day=(dm&&parseInt(dm[1],10)<=lastDayOf(yr,i))?parseInt(dm[1],10):lastDayOf(yr,i);
      return yr+"-"+z(i+1)+"-"+z(day);
    }
  }
  return null;
}
/* put the working sessions on the calendar, like a target but sparser */
function goalSchedule(g){
  if(!g.cadence)return 0;
  var d=Object.assign({},S.data);
  var cur=new Date(T+"T12:00:00");cur.setDate(cur.getDate()+1);
  var end=new Date(g.by+"T12:00:00");
  var count=0;
  while(cur<=end&&count<120){
    var hit=false;
    if(g.cadence==="weekly")hit=(g.days||[]).indexOf(cur.getDay())>=0;
    if(g.cadence==="monthly")hit=goalDoms(g).indexOf(cur.getDate())>=0;
    if(hit){
      var k=pad(cur);
      if(!d[k])d[k]={chores:defaultsFor(k),schedule:[],journal:"",temp:"--"};

/* ---- Weather -----------------------------------------------------------
   One fetch gets current conditions AND a 7-day forecast, because the Week
   view plans around it. The base location is whatever geolocation gives us;
   a place looked up by hand is held separately and never overwrites it. */
function wIcon(code){
  return code===0?"\u2600\ufe0f":code<=3?"\u26c5":code<=67?"\ud83c\udf27\ufe0f":code<=77?"\u2744\ufe0f":"\ud83c\udf29\ufe0f";
}
function wCond(code){
  return code===0?"Clear sky":code<=3?"Partly cloudy":code<=67?"Rainy":code<=77?"Snowy":"Stormy";
}
const WX_URL="https://api.open-meteo.com/v1/forecast";
function wxQuery(lat,lon){
  return WX_URL+"?latitude="+lat+"&longitude="+lon+
    "&current=temperature_2m,weathercode"+
    "&daily=sunrise,sunset,weathercode,temperature_2m_max,temperature_2m_min"+
    "&forecast_days=7&temperature_unit=celsius&timezone=auto";
}
/* shape the daily arrays into something the views can read directly */
function wxDaily(wD){
  var out=[];
  if(!wD||!wD.daily||!wD.daily.time)return out;
  var d=wD.daily;
  for(var i=0;i<d.time.length;i++){
    out.push({
      day:d.time[i],
      code:d.weathercode?d.weathercode[i]:0,
      hi:d.temperature_2m_max?Math.round(d.temperature_2m_max[i]):null,
      lo:d.temperature_2m_min?Math.round(d.temperature_2m_min[i]):null
    });
  }
  return out;
}
function applyWeather(wD,city,isBase){
  var temp=Math.round(wD.current.temperature_2m);
  var code=wD.current.weathercode;
  if(isBase&&wD.daily&&wD.daily.sunrise&&wD.daily.sunset){
    SUN.rise=wD.daily.sunrise[0];SUN.set=wD.daily.sunset[0];
  }
  var w={temp:temp,city:city,icon:wIcon(code),cond:wCond(code),
         ok:true,rawCode:code,daily:wxDaily(wD),base:!!isBase};
  if(isBase){
    BASE_WEATHER=w;
    try{ss("dc2-weather-base",w);}catch(e){}
    /* record today's real weather so the reports can summarise history */
    try{
      var wh=ls("dc2-weather",{});
      var ex=wh[T];
      wh[T]={t:temp,c:code,hi:(ex&&ex.hi>temp)?ex.hi:temp,lo:(ex&&ex.lo<temp)?ex.lo:temp};
      ss("dc2-weather",wh);
    }catch(e){}
  }
  set({weather:w});
}
var BASE_WEATHER=ls("dc2-weather-base",null);
function fetchWeather(){
  /* show the last known reading immediately rather than an empty header */
  if(BASE_WEATHER&&BASE_WEATHER.ok)set({weather:BASE_WEATHER});
  if(!navigator.geolocation){set({weatherDenied:true});return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    const lat=pos.coords.latitude,lon=pos.coords.longitude;
    Promise.all([
      fetch(wxQuery(lat,lon)),
      fetch("https://nominatim.openstreetmap.org/reverse?lat="+lat+"&lon="+lon+"&format=json")
    ]).then(function(rs){return Promise.all(rs.map(function(r){return r.json();}));}).then(function(data){
      const wD=data[0],gD=data[1];
      const a=gD.address||{};
      const city=a.city||a.town||a.village||a.suburb||a.county||"Your location";
      applyWeather(wD,city,true);
    }).catch(function(){});
  },function(){
    /* denied or unavailable — the app still works, it just has to ask */
    set({weatherDenied:true});
  },{timeout:10000,maximumAge:300000});
}
/* Look up any place by name. Never becomes the base location. */
function lookupPlace(name){
  set({placeBusy:true,placeErr:""});
  return fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(name))
    .then(function(r){return r.json();})
    .then(function(g){
      if(!g.results||!g.results.length){
        set({placeBusy:false,placeErr:"No place by that name"});return;
      }
      var p=g.results[0];
      return fetch(wxQuery(p.latitude,p.longitude)).then(function(r){return r.json();})
        .then(function(wD){
          applyWeather(wD,p.name,false);
          set({placeBusy:false,placeErr:"",placePick:false});
        });
    })
    .catch(function(){set({placeBusy:false,placeErr:"Couldn't reach the weather service"});});
}

/* Drag the page between menus — the content follows the finger and settles
   on whichever menu you let go nearest. Uses transforms and transitions,
   never CSS animations (those are blanket-disabled inside #main). */
var dragBusy=false;
function addPageDrag(el){
  var x0=null,y0=null,dx=0,dragging=false,decided=false;
  function reset(){el.style.transition="";el.style.transform="";}
  el.addEventListener("touchstart",function(e){
    if(dragBusy||e.touches.length!==1)return;
    /* leave the sideways strips, the week grid and any text field alone */
    if(e.target.closest(".qbtns,.ideas,.week-cube-grid,.warp,input,textarea"))return;
    var t=e.touches[0];x0=t.clientX;y0=t.clientY;
    dx=0;dragging=false;decided=false;
    el.style.transition="none";
  },{passive:true});
  el.addEventListener("touchmove",function(e){
    if(x0===null||dragBusy)return;
    var t=e.touches[0];
    var mx=t.clientX-x0,my=t.clientY-y0;
    if(!decided){
      if(Math.abs(mx)<7&&Math.abs(my)<7)return;
      decided=true;
      dragging=Math.abs(mx)>Math.abs(my)*1.25;
      if(!dragging){el.style.transition="";return;}
    }
    if(!dragging)return;
    var i=TABS.indexOf(S.nav);
    /* rubber-band when there is nothing further to go to */
    if((i<=0&&mx>0)||(i>=TABS.length-1&&mx<0))mx*=0.3;
    dx=mx;
    el.style.transform="translate3d("+dx.toFixed(1)+"px,0,0)";
    el.style.opacity=String(Math.max(.55,1-Math.abs(dx)/900));
  },{passive:true});
  el.addEventListener("touchend",function(){
    if(x0===null)return;
    x0=null;
    if(!dragging){reset();el.style.opacity="";return;}
    var w=el.getBoundingClientRect().width||320;
    var i=TABS.indexOf(S.nav);
    var dir=dx<0?1:-1;
    var j=i+dir;
    var commit=Math.abs(dx)>Math.min(84,w*0.22)&&j>=0&&j<TABS.length;
    var ease="transform .24s cubic-bezier(.25,.6,.3,1),opacity .24s ease";
    if(commit){
      dragBusy=true;
      el.style.transition=ease;
      el.style.transform="translate3d("+(dir>0?-w:w)+"px,0,0)";
      el.style.opacity="0";
      setTimeout(function(){
        navTo(TABS[j]);
        var ns=document.querySelector(".scroll");
        if(!ns){dragBusy=false;return;}
        ns.style.transition="none";
        ns.style.transform="translate3d("+(dir>0?w*0.5:-w*0.5)+"px,0,0)";
        ns.style.opacity="0";
        requestAnimationFrame(function(){
          ns.style.transition="transform .28s cubic-bezier(.25,.6,.3,1),opacity .24s ease";
          ns.style.transform="translate3d(0,0,0)";
          ns.style.opacity="1";
          setTimeout(function(){ns.style.transition="";dragBusy=false;},300);
        });
      },170);
    } else {
      el.style.transition=ease;
      el.style.transform="translate3d(0,0,0)";
      el.style.opacity="1";
      setTimeout(function(){if(el.parentNode)reset();},260);
    }
    dx=0;dragging=false;
  },{passive:true});
}

function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}

function ap(p){for(let i=1;i<arguments.length;i++){if(arguments[i])p.appendChild(arguments[i]);}return p;}

var SUN={rise:null,set:null};
function minsNow(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function minsOf(iso){if(!iso)return null;const t=iso.split("T")[1];if(!t)return null;const p=t.split(":");return parseInt(p[0])*60+parseInt(p[1]);}
function getTheme(code,hour){
  const now=minsNow();
  const rise=minsOf(SUN.rise), set=minsOf(SUN.set);
  let phase; // day / sunrise / sunset / dusk / night
  if(rise!=null&&set!=null){
    if(now>=rise-35&&now<rise+35)phase="sunrise";
    else if(now>=set-40&&now<set+15)phase="sunset";
    else if(now>=set+15&&now<set+75)phase="dusk";
    else if(now<rise-35||now>=set+75)phase="night";
    else phase="day";
  } else {
    // fallback to clock if sun times not loaded yet
    if(hour>=5&&hour<7)phase="sunrise";
    else if(hour>=19&&hour<20)phase="sunset";
    else if(hour>=20&&hour<21)phase="dusk";
    else if(hour<5||hour>=21)phase="night";
    else phase="day";
  }
  if(phase==="sunrise")return"sunrise";
  if(phase==="sunset")return"sunset";
  if(phase==="dusk")return"dusk";
  if(phase==="night")return"clear-night";
  // daytime — weather-driven
  const daylight=true;
  if(code===0)return"clear-day";
  if(code<=2)return"sun-clouds";
  if(code===3)return"cloudy";
  if(code<=55)return"sun-shower";
  if(code<=67)return"rainy";
  if(code<=77)return"snowy";
  if(code<=82)return"heavy-rain";
  return"stormy";
}

    wrap.appendChild(mk("div","sun-glow"));
  }
  if(theme==="clear-night"){
    const sl=mk("div","star-layer");
    for(let i=0;i<70;i++){
      const s=mk("div","star");const size=Math.random()*2+0.5;
      s.style.cssText="width:"+size+"px;height:"+size+"px;left:"+Math.random()*100+"%;top:"+Math.random()*70+"%;animation-duration:"+(Math.random()*3+2)+"s;animation-delay:"+(Math.random()*3)+"s";
      sl.appendChild(s);
    }
    wrap.appendChild(sl);
  }
  const cl=mk("div","cloud-layer");
  ["c1","c2","c3","c4","c5"].forEach(function(c){cl.appendChild(mk("div","cloud "+c));});
  if(theme==="stormy"||theme==="cloudy"){
    for(let i=0;i<(theme==="stormy"?4:2);i++){

      cl.appendChild(sc);
    }

  wrap.appendChild(cl);

    const rl=mk("div","rain-layer rain-drizzle");
    for(let i=0;i<(theme==="sun-shower"?22:30);i++){
      const r=mk("div","raindrop");const h=Math.random()*30+15;
      r.style.cssText="left:"+Math.random()*100+"%;height:"+h+"px;animation-duration:"+(Math.random()*0.6+0.9)+"s;animation-delay:"+(Math.random()*3)+"s";
      rl.appendChild(r);

    const rl=mk("div","rain-layer rain-rain");

      const r=mk("div","raindrop");const h=Math.random()*50+30;
      r.style.cssText="left:"+Math.random()*100+"%;height:"+h+"px;animation-duration:"+(Math.random()*0.3+0.5)+"s;animation-delay:"+(Math.random()*2)+"s";
      rl.appendChild(r);
    }
    wrap.appendChild(rl);
  }
  if(theme==="heavy-rain"||theme==="stormy"){
    const rl=mk("div","rain-layer rain-heavy");
    const count=theme==="stormy"?90:70;
    for(let i=0;i<count;i++){
      const r=mk("div","raindrop");const h=Math.random()*80+50;
      r.style.cssText="left:"+Math.random()*100+"%;height:"+h+"px;animation-duration:"+(Math.random()*0.2+0.3)+"s;animation-delay:"+(Math.random()*1.5)+"s";
      rl.appendChild(r);
    }
    wrap.appendChild(rl);
    if(theme==="stormy")wrap.appendChild(mk("div","lightning"));
  }
  if(theme==="snowy"){
    const sl2=mk("div","snow-layer");
    for(let i=0;i<40;i++){
      const s=mk("div","snowflake");const size=Math.random()*4+2;
      s.style.cssText="width:"+size+"px;height:"+size+"px;left:"+Math.random()*100+"%;animation-duration:"+(Math.random()*4+4)+"s;animation-delay:"+(Math.random()*4)+"s";

function addSimpleRipple(wrap){
  wrap.addEventListener("touchstart",function(e){
    const t=e.touches[0];
    const r=mk("div","touch-ripple");
    r.style.cssText="width:60px;height:60px;left:"+(t.clientX-30)+"px;top:"+(t.clientY-30)+"px";
    wrap.appendChild(r);setTimeout(function(){if(r.parentNode)r.parentNode.removeChild(r);},700);
    wrap.querySelectorAll(".cloud").forEach(function(c){
      const rect=c.getBoundingClientRect();
      const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
      const dx=cx-t.clientX,dy=cy-t.clientY;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      const force=Math.min(140/dist,25);
      c.style.transform="translate("+(dx/dist*force)+"px,"+(dy/dist*force)+"px)";
      setTimeout(function(){c.style.transform="";},500);
    });
  },{passive:true});
}

let clockTimer=null;
function startClock(){
  if(clockTimer)clearInterval(clockTimer);
  clockTimer=setInterval(function(){
    const el2=document.getElementById("lock-clock");
    if(!el2)return;
    const n=new Date();
    let h=n.getHours();const ampm=h>=12?"PM":"AM";
    h=h%12;if(h===0)h=12;
    const timeEl=el2.querySelector(".lock-clock-time");
    const ampmEl=el2.querySelector(".lock-clock-ampm");
    if(timeEl)timeEl.textContent=z(h)+":"+z(n.getMinutes());
    if(ampmEl)ampmEl.textContent=ampm;
  },1000);
}

function buildWaterBar(parent){
  const MAX=3;
  const cur=S.waterL[T]||0;
  const wrap=mk("div","wbar-wrap");
  function fmt(n){
    const v=Math.round(n*20)/20;
    let s=v.toFixed(2);
    s=s.replace(/0$/,"").replace(/\.0$/,"").replace(/\.$/,"");
    return s;
  }
  const val=mk("div","wbar-val");
  const num=mk("span","");tx(num,fmt(cur));
  const unit=mk("span","wbar-unit");tx(unit,"L");
  ap(val,num,unit);
  const bar=mk("div","wbar");
  const fill=mk("div","wbar-fill");
  const thumb=mk("div","wbar-thumb");
  function setUI(n){
    const p=Math.max(0,Math.min(1,n/MAX));
    fill.style.width=(p*100)+"%";
    thumb.style.left=(p*100)+"%";
    tx(num,fmt(n));
  }
  setUI(cur);
  function xToVal(clientX){
    const r=bar.getBoundingClientRect();
    let n=(clientX-r.left)/r.width*MAX;
    n=Math.max(0,Math.min(MAX,n));
    return Math.round(n*20)/20;
  }
  let dragging=false;
  bar.addEventListener("touchstart",function(e){
    dragging=true;setUI(xToVal(e.touches[0].clientX));
    if(navigator.vibrate)navigator.vibrate(4);
  },{passive:true});
  bar.addEventListener("touchmove",function(e){
    if(dragging)setUI(xToVal(e.touches[0].clientX));
  },{passive:true});
  bar.addEventListener("touchend",function(e){
    dragging=false;
    setWaterL(xToVal(e.changedTouches[0].clientX));
  },{passive:true});
  bar.addEventListener("mousedown",function(e){setUI(xToVal(e.clientX));});
  bar.addEventListener("click",function(e){setWaterL(xToVal(e.clientX));});
  ap(bar,fill,thumb);
  const scale=mk("div","wbar-scale");
  [[0,"0"],[1,"1L"],[1.5,"1.5L"],[2,"2L"],[3,"3L"]].forEach(function(pair,idx,arr){
    const s=mk("button","wbar-tick");tx(s,pair[1]);
    s.style.left=(pair[0]/MAX*100)+"%";
    s.style.transform=idx===0?"translateX(0)":idx===arr.length-1?"translateX(-100%)":"translateX(-50%)";
    s.addEventListener("click",function(){setUI(pair[0]);setWaterL(pair[0]);});
    scale.appendChild(s);
  });
  ap(wrap,val,bar,scale);
  parent.appendChild(wrap);
}

var MOODFACES=[["1","😫"],["2","😕"],["3","😐"],["4","🙂"],["5","😄"]];
var MOODWORD={"1":"Very bad","2":"Bad","3":"Okay","4":"Good","5":"Great"};
/* mood can be logged whenever — not only during the morning ritual */
/* ---- 24-hour day view -------------------------------------------------
   Events store a start and an optional end. Anything without an end is
   drawn as one hour, which is a guess — that is why the end field exists. */
function evMins(t){
  if(!t)return null;
  var p=String(t).split(":");
  var h=parseInt(p[0],10),m=parseInt(p[1],10);
  if(isNaN(h)||isNaN(m))return null;
  return h*60+m;
}
function fmtMins(n){return z(Math.floor(n/60)%24)+":"+z(n%60);}
/* side-by-side placement for anything that overlaps */
function packEvents(list){
  var out=list.slice().sort(function(a,b){return a.s-b.s;});
  var groups=[],cur=[];
  out.forEach(function(e){
    if(!cur.length){cur=[e];groups.push(cur);return;}
    var overlaps=cur.some(function(o){return e.s<o.e&&o.s<e.e;});
    if(overlaps)cur.push(e);else{cur=[e];groups.push(cur);}
  });
  groups.forEach(function(g){
    g.forEach(function(e,i){e.col=i;e.cols=g.length;});
  });
  return out;
}


/* ===== WEEK TO-DO =====================================================
   A loose list for the week. A day is optional and a time is optional on
   top of that — pick a day and it also lands on that day's schedule. */
function todos(){var t=ls("dc2-todos",[]);return Array.isArray(t)?t:[];}
function saveTodos(t){ss("dc2-todos",t);}
function weekKeyOf(dateKey){return pad(weekOf(dateKey)[0]);}
/* a monthly list is the same object keyed by month instead of the Monday */
function monthKeyOf(dateKey){return String(dateKey).slice(0,7);}
function monthTodos(dateKey){
  var mk2=monthKeyOf(dateKey);
  return todos().filter(function(t){return t.week===mk2;});
}
/* a single day's list — every item lands on that day as an event */
function dayTodos(dateKey){
  return todos().filter(function(t){
    return t.week==="d:"+dateKey;
  });
}
function weekTodos(dateKey){
  var wk=weekKeyOf(dateKey);
  return todos().filter(function(t){return t.week===wk;});
}
/* a to-do can sit on several days at once. Older items stored a single
   `day` string, so read through todoDays() and never touch t.day directly. */
function todoDays(t){
  if(t.days&&t.days.length)return t.days.slice();
  return t.day?[t.day]:[];
}
function todoLayEvents(item){
  var d=Object.assign({},S.data);
  todoDays(item).forEach(function(k){
    ensure(k);
    var ev={time:item.time||"",label:item.text};
    if(item.time)ev.end="";
    d[k]=Object.assign({},day(k),{
      schedule:day(k).schedule.concat([ev]).sort(function(a,b){
        if(!a.time&&!b.time)return 0;
        if(!a.time)return 1;
        if(!b.time)return -1;
        return a.time.localeCompare(b.time);
      })});
    S.data=d;
  });
  ss("dc2-data",d);S.data=d;
}
function todoClearEvents(item){
  var d=Object.assign({},S.data);
  todoDays(item).forEach(function(k){
    if(!d[k]||!d[k].schedule)return;
    var dropped=false;
    d[k]=Object.assign({},d[k],{
      schedule:d[k].schedule.filter(function(ev){
        if(!dropped&&ev.label===item.text){dropped=true;return false;}
        return true;
      })});
  });
  ss("dc2-data",d);S.data=d;
}
function todoAdd(text,daysArr,time){
  var all=todos();
  var list=Array.isArray(daysArr)?daysArr.slice():(daysArr?[daysArr]:[]);
  var scope=S.todoScope;
  var bucket=(scope==="month")?monthKeyOf(S.planDay||S.sel||T)
            :(scope==="day")?("d:"+(S.planDay||S.sel||T))
            :weekKeyOf(S.sel||T);
  var item={id:Date.now(),text:String(text).trim(),week:bucket,
            days:list.sort(),time:time||"",done:false};
  todoLayEvents(item);
  all.push(item);saveTodos(all);
}
function todoEdit(id,daysArr,time){
  var all=todos();
  var t=all.filter(function(x){return x.id===id;})[0];
  if(!t)return;
  /* clear the old days before laying the new ones, or orphans are left behind */
  todoClearEvents(t);
  t.days=(Array.isArray(daysArr)?daysArr.slice():[]).sort();
  t.day="";
  t.time=time||"";
  todoLayEvents(t);
  saveTodos(all);
}
function todoToggle(id){
  saveTodos(todos().map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t;}));
  render();
}
function todoRemove(id){
  var t=todos().filter(function(x){return x.id===id;})[0];
  /* ticking one off leaves its events in place — they are a record.
     Deleting it removes them from every day it was on. */
  if(t)todoClearEvents(t);
  saveTodos(todos().filter(function(x){return x.id!==id;}));
  render();
}
function todoWhen(t){
  var ds=todoDays(t);
  if(!ds.length)return {txt:"Any day",none:true};
  if(ds.length===1){
    var d=new Date(ds[0]+"T12:00:00");
    var lbl=DAYS[d.getDay()]+" "+d.getDate();
    return {txt:t.time?(lbl+" \u00b7 "+t.time):lbl,none:false};
  }
  var names=ds.map(function(k){return DAYS[new Date(k+"T12:00:00").getDay()];}).join(" ");
  return {txt:t.time?(names+" \u00b7 "+t.time):names,none:false};
}
var lastPlanDay=null;
/* The day panel is a schedule, not a to-do list: each thing you add is a
   timed event on that day, so it lands on the calendar and in the day-ahead
   panel. Adding opens the same event composer the schedule tab uses (time,
   label, optional end). Keeps the warm day-card design. */
function buildDaySchedule(parent){
  var dk=S.planDay||S.sel||T;
  var dObj=new Date(dk+"T12:00:00");
  var orig=day(dk).schedule||[];
  var sched=orig.slice().sort(function(a,b){
    if(!a.time&&!b.time)return 0;
    if(!a.time)return 1;
    if(!b.time)return -1;
    return a.time.localeCompare(b.time);
  });
  var card=mk("div","todo-card tc-day");
  var badge=mk("div","tc-badge");
  var bn=mk("span","n");tx(bn,String(dObj.getDate()));
  var bm=mk("span","m");tx(bm,DAYFULL[dObj.getDay()]+", "+MONTHS[dObj.getMonth()]);
  ap(badge,bn,bm);card.appendChild(badge);

function buildWeekTodo(parent,scope){
  var monthly=(scope==="month"), daily=(scope==="day");
  if(daily){buildDaySchedule(parent);return;}
  var list=daily?dayTodos(S.planDay||S.sel||T)
          :monthly?monthTodos(S.planDay||S.sel||T)
          :weekTodos(S.sel||T);
  var open=list.filter(function(t){return !t.done;}).length;
  var card=mk("div","todo-card"+(daily?" tc-day":""));
  if(daily){
    var dk=S.planDay||S.sel||T;
    var dObj2=new Date(dk+"T12:00:00");
    var badge=mk("div","tc-badge");
    var bn=mk("span","n");tx(bn,String(dObj2.getDate()));
    var bm=mk("span","m");
    tx(bm,DAYFULL[dObj2.getDay()]+", "+MONTHS[dObj2.getMonth()]);
    ap(badge,bn,bm);card.appendChild(badge);
    /* only move when the day actually changed, not on every render */
    if(lastPlanDay!==dk){
      lastPlanDay=dk;
      card.classList.add("tc-enter");
      requestAnimationFrame(function(){
        card.classList.add("tc-settle");card.classList.remove("tc-enter");
      });
    }
  }
  var q=mk("div","todo-q");
  tx(q,daily?"What do you have this day?"
    :monthly?"What do you need to do this month?"
    :"What do you need to do this week?");
  var e=mk("em","");tx(e,open?(open+" open"):(list.length?"all done":"nothing yet"));
  q.appendChild(e);card.appendChild(q);

  list.forEach(function(t){
    var row=mk("div","todo-item"+(t.done?" done":""));
    var chk=mk("button","todo-chk");tx(chk,t.done?"\u2713":"");
    chk.addEventListener("click",function(){todoToggle(t.id);});
    var txt=mk("span","todo-t");tx(txt,t.text);
    var w=todoWhen(t);
    var when=mk("button","todo-when"+(w.none?" none":""));tx(when,w.txt);
    when.addEventListener("click",function(){
      set({todoWhen:{id:t.id,text:t.text,days:todoDays(t),time:t.time||""}});
    });
    var x=mk("button","todo-x");tx(x,"\u00d7");
    x.addEventListener("click",function(){todoRemove(t.id);});
    ap(row,chk,txt,when,x);card.appendChild(row);
  });
  if(!list.length){
    var em=mk("div","todo-empty");
    tx(em,daily?"Whatever this day needs — each one lands on the calendar."
      :monthly?"Anything this month, with no fixed day."
      :"Add anything that needs to happen before Sunday.");
    card.appendChild(em);
  }

  var row2=mk("div","todo-row");row2.style.marginTop="12px";
  var inp=mk("input","todo-inp");inp.type="text";inp.placeholder="Add something\u2026";
  inp.value=S.todoDraft||"";
  inp.addEventListener("input",function(ev){S.todoDraft=ev.target.value;});
  inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")openTodoWhen();});
  var add=mk("button","todo-add");tx(add,"Add");
  function openTodoWhen(){
    var v=(S.todoDraft||"").trim();
    if(!v){showToast("Type it first");return;}
    S.todoScope=daily?"day":monthly?"month":"week";
    if(daily){
      /* a day list already knows its day — no picker, straight on */
      todoAdd(v,[S.planDay||S.sel||T],"");
      S.todoDraft="";render();showToast("Added ✦");
      return;
    }
    set({todoWhen:{text:v,days:[],time:"",scope:S.todoScope}});
  }
  add.addEventListener("click",openTodoWhen);
  ap(row2,inp,add);card.appendChild(row2);
  parent.appendChild(card);
}

/* the day/time question — both optional, undetermined is the default */
function renderTodoWhen(){
  var tw=S.todoWhen;
  var editing=!!tw.id;
  if(!tw.days)tw.days=[];
  var ov=mk("div","ritual-overlay daypick-ov");
  ov.addEventListener("click",function(){set({todoWhen:null});});
  var card=mk("div","ritual-card");
  card.addEventListener("click",function(e){e.stopPropagation();});
  var st=mk("div","ritual-step");tx(st,editing?"\u25c8 Edit to-do":"\u25c8 New to-do");card.appendChild(st);
  var q=mk("div","ritual-q");tx(q,"\u201c"+tw.text+"\u201d");card.appendChild(q);
  var h=mk("div","ghint");
  tx(h,"Which day? Pick more than one if it spans days, or leave it undetermined.");
  card.appendChild(h);

  var monthly=(tw.scope==="month");
  var wd;
  if(monthly){
    /* the whole month to choose from, so a monthly item can land anywhere in it */
    var mk3=monthKeyOf(S.planDay||S.sel||T);
    var yy=+mk3.slice(0,4), mm=+mk3.slice(5,7)-1;
    var dim=new Date(yy,mm+1,0).getDate();
    wd=[];for(var di=1;di<=dim;di++)wd.push(new Date(yy,mm,di));
  } else wd=weekOf(S.sel||T);
  var chips=mk("div","tchips");
  if(monthly)chips.style.cssText="max-height:168px;overflow-y:auto;scrollbar-width:none";
  var none=mk("button","tchip"+(tw.days.length?"":" on"));tx(none,"Undetermined");
  none.addEventListener("click",function(){tw.days=[];tw.time="";render();});
  chips.appendChild(none);
  wd.forEach(function(d){
    var k=pad(d);
    var on=tw.days.indexOf(k)>=0;
    var c=mk("button","tchip"+(on?" on":""));
    tx(c,monthly?String(d.getDate()):(DAYS[d.getDay()]+" "+d.getDate()));
    c.addEventListener("click",function(){
      var i=tw.days.indexOf(k);
      if(i>=0)tw.days.splice(i,1);else tw.days.push(k);
      render();
    });
    chips.appendChild(c);
  });
  card.appendChild(chips);

  if(tw.days.length){
    var tl=mk("div","ghint");
    tx(tl,tw.days.length>1?"A time, if it matters \u2014 the same on each day."
      :"A time, if it matters \u2014 otherwise leave it blank.");
    card.appendChild(tl);
    var ti=mk("input","minput");ti.type="time";ti.value=tw.time||"";
    ti.addEventListener("input",function(e){tw.time=e.target.value;});
    card.appendChild(ti);
  }

  var go=mk("button","ritual-next");tx(go,editing?"Save":"Add it");
  go.addEventListener("click",function(){
    var n=tw.days.length;
    if(editing)todoEdit(tw.id,tw.days,tw.time);
    else {todoAdd(tw.text,tw.days,tw.time);S.todoDraft="";}
    set({todoWhen:null});
    showToast(!n?(editing?"Moved to any day":"Added \u2726")
      :(n===1?(editing?"Moved to ":"Added to ")+DAYS[new Date(tw.days[0]+"T12:00:00").getDay()]+" \u2726"
             :n+" days \u2726"));
  });
  card.appendChild(go);
  var cx=mk("button","ritual-skip");tx(cx,"Cancel");
  cx.addEventListener("click",function(){set({todoWhen:null});});
  card.appendChild(cx);
  ov.appendChild(card);
  return ov;
}

function buildGoalsView(root){
  var all=goals();

  var ov=mk("div","gv-ov");

  var due=live.filter(goalDue);

      [["achieved","\u2713  Achieved it","win"],["progress","Made progress",""],
       ["missed","Didn\u2019t get there",""]].forEach(function(o){

        b.addEventListener("click",function(){goalResolve(g.id,o[0]);});
        row.appendChild(b);
      });
      c.appendChild(row);
      body.appendChild(c);
    });
  }

  var open=live.filter(function(g){return !goalDue(g);});
  var ol=mk("div","gv-lbl");tx(ol,"In progress");body.appendChild(ol);
  if(!open.length){
    var em=mk("div","gv-empty");
    tx(em,"No goals yet. What do you want this year to be about?");
    body.appendChild(em);
  }
  open.forEach(function(g){
    var c=mk("div","gcard");
    var t=mk("div","gt");tx(t,g.title);c.appendChild(t);
    var left=daysLeft(g.by);
    var total=Math.max(1,Math.ceil((new Date(g.by+"T12:00:00")-new Date(g.created+"T12:00:00"))/86400000));
    var gone=Math.max(0,Math.min(100,Math.round((total-left)/total*100)));
    var m=mk("div","gm");
    tx(m,"By "+fmtWhen(g.by)+" \u00b7 "+left+" day"+(left===1?"":"s")+" left");
    c.appendChild(m);
    var bar=mk("div","gbar");
    var fill=mk("i",left<=30?"warn":"");fill.style.width=gone+"%";
    bar.appendChild(fill);c.appendChild(bar);
    var foot=mk("div","gfoot");
    if(g.cadence){
      var ch=mk("span","gchip on");
      tx(ch,g.cadence==="weekly"
        ?((g.days||[]).length+"\u00d7 a week")
        :(goalDoms(g).length+"\u00d7 a month"));
      foot.appendChild(ch);
      var cs=mk("span","gchip");tx(cs,(g.sessions||0)+" sessions booked");foot.appendChild(cs);
    } else {
      var cn=mk("span","gchip");tx(cn,"No fixed rhythm");foot.appendChild(cn);
    }
    c.appendChild(foot);
    var del=mk("button","gdel");tx(del,"\u00d7");
    del.addEventListener("click",function(){
      confirmDelete('Remove "'+g.title+'" and its sessions?',function(){goalDelete(g.id);});
    });
    c.appendChild(del);
    body.appendChild(c);
  });

  var nb=mk("button","gv-new");tx(nb,"\u26F0  Set a new goal");
  nb.addEventListener("click",function(){
    set({goalsOpen:false,goalWiz:0.5,gHorizon:"",gTyped:false,gTitle:"",gWhenText:"",gBy:"",gCadence:"",gDays:[],gDoms:[1]});
  });
  body.appendChild(nb);

  buildGoalNotes(body);

  if(closed.length){
    var cl=mk("div","gv-lbl");tx(cl,"Closed");body.appendChild(cl);
    closed.slice().reverse().forEach(function(g){
      var c=mk("div","gcard");
      var t=mk("div","gt");tx(t,g.title);c.appendChild(t);
      var m=mk("div","gm");tx(m,fmtWhen(g.by));c.appendChild(m);
      var o=mk("div","gfoot");
      var b=mk("span","gout "+(g.outcome==="achieved"?"won":g.outcome==="progress"?"part":"miss"));
      tx(b,g.outcome==="achieved"?"Achieved":g.outcome==="progress"?"Progress made":"Not achieved");
      o.appendChild(b);c.appendChild(o);
      var del2=mk("button","gdel");tx(del2,"\u00d7");
      del2.addEventListener("click",function(){
        confirmDelete('Remove "'+g.title+'"?',function(){goalDelete(g.id);});
      });
      c.appendChild(del2);
      body.appendChild(c);
    });
  }

  sheet.appendChild(body);ov.appendChild(sheet);root.appendChild(ov);
}

  sc.appendChild(grid);ov.appendChild(sc);root.appendChild(ov);

/* ---- Report period picker ---------------------------------------------
   Each report asks which period before it opens. Free covers a recent
   window; anything older is Plus. The windows: Daily = this week and last,
   Monthly = this month and last, Yearly = this year only. */
function dailyFreeFrom(){
  /* start of last week, so this week and last are free */
  return pad(addDaysD(weekOf(T)[0],-7));
}
function addDaysD(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function dayIsFree(k){return k>=dailyFreeFrom()&&k<=T;}
function monthIsFree(mk2){
  var now=T.slice(0,7);
  var d=new Date(T+"T12:00:00");d.setDate(1);d.setMonth(d.getMonth()-1);
  var prev=pad(d).slice(0,7);
  return mk2===now||mk2===prev;
}
function yearIsFree(y){return String(y)===T.slice(0,4);}

function openPeriodPicker(kind){

function renderPeriodPicker(){
  var pp=S.periodPick, kind=pp.kind;
  var ov=mk("div","pp-ov");
  ov.addEventListener("click",function(){set({periodPick:null,exportMenu:true});});
  var card=mk("div","pp-card");
  card.addEventListener("click",function(e){e.stopPropagation();});

  var x=mk("button","pp-x");tx(x,"\u00d7");
  x.addEventListener("click",function(){set({periodPick:null,exportMenu:true});});
  card.appendChild(x);

  var lbl=mk("div","pp-lbl");
  tx(lbl,kind==="daily"?"\u25CB Daily report":kind==="monthly"?"\u25CB Monthly report":"\u25CB Yearly report");
  card.appendChild(lbl);
  var q=mk("div","pp-q");
  tx(q,kind==="daily"?"Which day?":kind==="monthly"?"Which month?":"Which year?");
  card.appendChild(q);
  var sub=mk("div","pp-sub");
  tx(sub,kind==="daily"?"This week and last are free. Anything older needs Plus."
    :kind==="monthly"?"This month and last are free. Anything older needs Plus."
    :"This year is free. Earlier years need Plus.");
  card.appendChild(sub);

  var locked=false;

  if(kind==="daily"){
    /* two weeks of days, this week and last, then the older weeks behind Plus */
    for(var wOff=-3;wOff<=0;wOff++){
      var wStart=addDaysD(weekOf(T)[0],wOff*7);
      var head=mk("div","pp-week");
      tx(head,wOff===0?"This week":wOff===-1?"Last week":
        (pad(wStart)+" \u2192 "+pad(addDaysD(wStart,6))));
      card.appendChild(head);
      var grid=mk("div","pp-grid");
      for(var i=0;i<7;i++){
        (function(d){
          var k=pad(d);
          if(k>T)return;                       /* no reports for days that have not happened */
          var free=dayIsFree(k), sel=(pp.day===k);
          var c=mk("button","pp-cell"+(sel?" on":"")+((!free&&!isPlus())?" locked":"")+(k===T?" today":""));
          tx(c,DAYS[d.getDay()]+" "+d.getDate());
          c.addEventListener("click",function(){
            pp.day=k;render();
          });
          grid.appendChild(c);
        })(addDaysD(wStart,i));
      }
      card.appendChild(grid);
    }
    locked=!dayIsFree(pp.day)&&!isPlus();
  }

  if(kind==="monthly"){
    var grid2=mk("div","pp-grid");
    /* chronological, like a calendar — earliest on the left */
    for(var mo=-11;mo<=0;mo++){
      (function(off){
        var d=new Date(T+"T12:00:00");d.setDate(1);d.setMonth(d.getMonth()+off);
        var mk2=pad(d).slice(0,7);
        var free=monthIsFree(mk2), sel=(pp.month===mk2);
        var c=mk("button","pp-cell"+(sel?" on":"")+((!free&&!isPlus())?" locked":""));
        tx(c,MONTHS[d.getMonth()].slice(0,3)+" "+d.getFullYear());
        c.addEventListener("click",function(){
          pp.month=mk2;render();
        });
        grid2.appendChild(c);
      })(mo);
    }
    card.appendChild(grid2);
    locked=!monthIsFree(pp.month)&&!isPlus();
  }

  if(kind==="yearly"){
    var grid3=mk("div","pp-grid");
    var thisY=parseInt(T.slice(0,4),10);
    for(var yo=-3;yo<=0;yo++){
      (function(y){
        var free=yearIsFree(y), sel=(pp.year===y);
        var c=mk("button","pp-cell"+(sel?" on":"")+((!free&&!isPlus())?" locked":""));
        tx(c,String(y));
        c.addEventListener("click",function(){
          pp.year=y;render();
        });
        grid3.appendChild(c);
      })(thisY+yo);
    }
    card.appendChild(grid3);
    locked=!yearIsFree(pp.year)&&!isPlus();
  }

  var go=mk("button","pp-go");
  tx(go,locked?"See what's inside →":"Open the report");
  go.addEventListener("click",function(){
    /* a locked period still opens — the report shows its own blurred
       preview with the paywall over it, which sells better than a wall */
    if(kind==="daily"){S.sel=pp.day;set({periodPick:null});buildDailyReport();}
    if(kind==="monthly"){S.planMonth=pp.month;set({periodPick:null});buildMonthlyReport();}
    if(kind==="yearly"){S.reportYear=pp.year;set({periodPick:null});buildYearlyReport();}
  });
  card.appendChild(go);

  var note=mk("div","pp-note");
  tx(note,"Tap outside or \u00d7 to go back.");
  card.appendChild(note);

  ov.appendChild(card);
  return ov;
}

  }
  }

  // BMI — the golden free service
  const w=parseFloat(h.weight),ht=heightCm(h.height);
  const bmiV=bmiOf(h.weight,h.height);
  if(bmiV){

    const bv=mk("div","");bv.style.cssText="font-family:'DM Mono',monospace;font-size:34px;color:#fff;letter-spacing:-1px;line-height:1";tx(bv,bmi.toFixed(1));
    ap(bmiCard,bl,bv);
    if(healthy){
      const bc=mk("div","");
      bc.style.cssText="display:inline-block;margin-top:10px;padding:5px 14px;border-radius:14px;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;background:#8BA888;color:#fff";

  const moodCard=mk("div","hmood-card");

  moodCard.appendChild(ml);
  const moodRow=mk("div","hmood-row");
  const todayMood=h.moods&&h.moods[today()];
  [["1","😫"],["2","😕"],["3","😐"],["4","🙂"],["5","😄"]].forEach(function(m){
    const btn=mk("button","hmood-btn"+(todayMood===m[0]?" on":""));tx(btn,m[1]);
    btn.addEventListener("click",function(){setMood(m[0]);});
    moodRow.appendChild(btn);
  });
  moodCard.appendChild(moodRow);modal.appendChild(moodCard);

  const up=mk("div","hupsell");
  const upl=mk("div","hup-lbl");tx(upl,"Go further");
  const upt=mk("div","hup-title");tx(upt,"Personalised nutrition & gym plans");
  /* This does not exist yet, so it asks rather than promising a booking. */
  const ups=mk("div","hup-sub");
  tx(ups,"Coming soon — a nutritionist you can book, and a training plan built around your goals. Want to be told when it's ready?");
  const upb=mk("div","hup-btns");
  const wl=waitlist();
  [["nutrition","Nutrition plan"],["gym","Gym program"]].forEach(function(o,i){
    const on=wl.indexOf(o[0])>=0;
    const btn=mk("button","hup-btn"+((i===0&&!on)?" solid":"")+(on?" hup-on":""));
    tx(btn,on?("✓ "+o[1]):o[1]);
    btn.addEventListener("click",function(){toggleWaitlist(o[0],o[1]);});
    upb.appendChild(btn);
  });
  ap(up,upl,upt,ups,upb);
  if(wl.length){
    const note=mk("div","hup-note");
    tx(note,"You're on the list. We'll tell you the moment it opens.");
    up.appendChild(note);
  }
  modal.appendChild(up);
  return modal;
}

/* Interest is recorded locally for now and rides along with the backup, so
   it survives until there is a server to send it to. */
function waitlist(){var w=ls("dc2-waitlist",[]);return Array.isArray(w)?w:[];}
function toggleWaitlist(key,label){
  var w=waitlist(), i=w.indexOf(key);
  if(i>=0){
    w.splice(i,1);ss("dc2-waitlist",w);
    showToast("Removed from the list");set({healthModal:true});return;
  }
  w.push(key);ss("dc2-waitlist",w);
  /* the email is asked for HERE, where it earns itself — there is
     something to be told about. Never on first launch. */
  if(!ls("dc2-email","")){set({emailAsk:{reason:label}});return;}
  showToast(label+" — you're on the list ✦");
  set({healthModal:true});
}
function saveEmail(v){
  var e=String(v||"").trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(e))return false;
  ss("dc2-email",e);return true;
}
function isTablet(){return window.matchMedia("(min-width:768px)").matches;}
function isDesktop(){return window.matchMedia("(min-width:1200px)").matches;}

function renderRitual(){
  const ov=mk("div","ritual-overlay");

  function backTo(step){
    const b=mk("button","ritual-skip");tx(b,"← Back");
    b.addEventListener("click",function(){set({ritual:step});});
    return b;
  }
  const stepNames={0.9:"Welcome",1:"Step 1 · Feeling",1.5:"Step 1 · Feeling",1.6:"Step 1 · Support",1.7:"Gideon · Here with you",2:"Step 2 · Hydration",3:"Step 3 · Today's chores"};

  if(S.ritual===0.9){
    const q=mk("div","ritual-q");tx(q,"Welcome. What should I call you?");card.appendChild(q);
    const inp=mk("input","minput");inp.type="text";inp.placeholder="Your name";inp.value=S.userName||"";

    card.appendChild(inp);
    const nxt=mk("button","ritual-next");tx(nxt,"Continue →");
    nxt.addEventListener("click",function(){
      const nm=(nd||"").trim()||"friend";
      ss("dc2-name",nm);ss("dc2-nameok","1");
      set({userName:nm,ritual:1});
    });
    card.appendChild(nxt);
    const back=mk("button","ritual-skip");tx(back,"← Back to lock screen");
    back.addEventListener("click",function(){set({ritual:0,view:"lock"});});
    card.appendChild(back);
    setTimeout(function(){inp.focus();},140);
  }

  if(S.ritual===1.6){
    const q=mk("div","ritual-q");tx(q,"Do you want to talk about it?");card.appendChild(q);
    const sub=mk("div","ritual-sub");
    const b1=mk("button","ritual-sub-btn");tx(b1,"💬 Talk with Team");
    b1.style.cssText="background:#5B4FE9;color:#fff;border-color:#5B4FE9";
    b1.addEventListener("click",function(){
      set({ritual:1.7,supportMsg:null,supportLoading:true,teamMode:true,teamSent:false});
      fetchSupportMsg();
    });
    const b2=mk("button","ritual-sub-btn");tx(b2,"I'm okay, continue →");
    b2.addEventListener("click",function(){logSupport(false);
      set(S.moodOnly?{ritual:0,moodOnly:false}:{ritual:2});});
    ap(sub,b1,b2);card.appendChild(sub);
    card.appendChild(backTo(1.5));
  }

  if(S.ritual===1.7){
    // One caring message from Gideon
    const box=mk("div","jchat-box");
    const jb=mk("div","jmsg a");
    tx(jb,S.supportLoading?"…":(S.supportMsg||""));
    box.appendChild(jb);
    card.appendChild(box);

    // Optional one-time message to the team
    if(S.teamSent){
      const okLine=mk("div","");
      okLine.style.cssText="font-size:12px;color:#8BA888;font-weight:600;margin-bottom:10px";
      tx(okLine,"✓ Your message was sent to the team.");
      card.appendChild(okLine);
    } else if(S.teamMode){
      const ta=mk("textarea","support-ta");ta.placeholder="Write a short message for the team…";ta.value=S.teamDraft;
      ta.addEventListener("input",function(e){S.teamDraft=e.target.value;});
      card.appendChild(ta);
      const send=mk("button","support-send");tx(send,"Send to team");
      send.addEventListener("click",sendTeamMsg);
      card.appendChild(send);

      const teamBtn=mk("button","ritual-sub-btn");tx(teamBtn,"✉ Leave a message for the team");
      teamBtn.style.cssText="font-size:11px;padding:9px 16px";
      teamBtn.addEventListener("click",function(){set({teamMode:true});});
      card.appendChild(teamBtn);
    }

    // Warm suggestion — their own contacts, not us
    const reach=mk("div","support-reach");
    tx(reach,"If it feels heavy, open your Contacts and call someone you trust — a familiar voice helps more than we think. You don't have to carry this alone.");
    card.appendChild(reach);

    const nxt=mk("button","ritual-next");tx(nxt,"Continue →");
    nxt.addEventListener("click",function(){logSupport(true);
      set(S.moodOnly?{ritual:0,moodOnly:false}:{ritual:2});});
    card.appendChild(nxt);
    card.appendChild(backTo(1.6));
  }

  if(S.ritual===1){
    const q=mk("div","ritual-q");tx(q,"How are you feeling today"+(S.userName?", "+S.userName:"")+"?");card.appendChild(q);
    const row=mk("div","ritual-moods");
    [["1","😞","Very bad"],["2","😕","Bad"],["3","😐","I'm okay"],["4","🙂","Good"],["5","😄","Great"]].forEach(function(m){
      const b=mk("button","ritual-mood");
      const f=mk("span","face");tx(f,m[1]);
      const l=mk("span","lbl");tx(l,m[2]);
      ap(b,f,l);
      b.addEventListener("click",function(){
        const h=Object.assign({},S.health);
        const moods=Object.assign({},h.moods);moods[T]=m[0];h.moods=moods;
        ss("dc2-health",h);S.health=h;
        if(m[0]==="1"||m[0]==="2"){set({ritual:1.5,ritualMood:m[0]});}
        else{set({ritual:2});}
      });
      row.appendChild(b);
    });
    card.appendChild(row);
    if(ls("dc2-nameok","")){
      const mback=mk("button","ritual-skip");tx(mback,"← Back");
      mback.addEventListener("click",function(){set({ritual:0.9});});
      card.appendChild(mback);
    }
  }

  if(S.ritual===1.5){
    const q=mk("div","ritual-q");tx(q,"I'm sorry. What's weighing on you?");card.appendChild(q);
    const sub=mk("div","ritual-sub");
    ["Sickness","Stress","Sad","Other"].forEach(function(r){
      const b=mk("button","ritual-sub-btn");tx(b,r);
      b.addEventListener("click",function(){ritualMoodNote(r);});
      sub.appendChild(b);
    });
    card.appendChild(sub);
    card.appendChild(backTo(1));
  }

  if(S.ritual===2){
    const q=mk("div","ritual-q");tx(q,"How much water so far?");card.appendChild(q);
    buildWaterBar(card);
    const fb2=waterFeedback(S.waterL[T]||0);
    const note2=mk("div","");
    note2.style.cssText="text-align:center;font-size:12px;font-family:'DM Sans',sans-serif;margin-bottom:12px;font-style:italic;color:"+fb2.col;
    tx(note2,fb2.msg);
    card.appendChild(note2);
    const nxt=mk("button","ritual-next");tx(nxt,"Log & continue →");
    nxt.addEventListener("click",function(){set({ritual:3});});
    card.appendChild(nxt);
    const wskip=mk("button","ritual-skip");wskip.style.cssText="margin-top:10px;opacity:.75";tx(wskip,"Skip · I'll log later");
    wskip.addEventListener("click",function(){set({ritual:3});});
    card.appendChild(wskip);
    card.appendChild(backTo(1));
  }

  if(S.ritual===3){
    const q=mk("div","ritual-q");tx(q,"Today's chores");card.appendChild(q);
    const list=mk("div","ritual-chores");
    const dd=day(T);
    dd.chores.forEach(function(c,i){
      const row=mk("div","citem"+(done(T,i)?" done":""));
      row.addEventListener("click",function(){toggleDone(T,i);});

      const ctxt=mk("span","ctxt");tx(ctxt,c);
      ap(row,chk,ctxt);list.appendChild(row);
    });
    card.appendChild(list);
    const nxt=mk("button","ritual-next");tx(nxt,"Start my day →");
    nxt.addEventListener("click",finishRitual);
    card.appendChild(nxt);
    card.appendChild(backTo(2));
  }

  const dots=mk("div","ritual-dots");
  [1,2,3].forEach(function(n){
    const d=mk("div","ritual-dot"+(Math.floor(S.ritual)>=n?" on":""));dots.appendChild(d);
  });
  card.appendChild(dots);
  const skip=mk("button","ritual-skip");tx(skip,"Skip for today");
  skip.addEventListener("click",finishRitual);
  card.appendChild(skip);
  ov.appendChild(card);
  return ov;
}

function buildBaselineArt(wrap){
  const art=mk("div","");art.id="baseline-art";
  function group(styleStr,colors){
    const g=mk("div","bl-col");g.style.cssText+=styleStr;
    const widths=["92%","82%","72%"];const ops=[".95",".65",".4"];
    colors.forEach(function(c,i){
      const l=mk("div","bl-line");
      l.style.cssText="width:"+widths[i]+";background:"+c+";opacity:"+ops[i];
      g.appendChild(l);
    });
    art.appendChild(g);
  }
  if(isDesktop()){
    group("left:0;width:260px",["#26395F","#1A2947","#111C34"]);
    group("left:260px;right:300px",["#EFE8DC","#CFC7BA","#ABA294"]);
    group("right:0;width:300px",["#E0D8CC","#C2B9AC","#9C9285"]);
  }else if(isTablet()){
    group("left:0;width:240px",["#26395F","#1A2947","#111C34"]);
    group("left:240px;right:0",["#EFE8DC","#CFC7BA","#ABA294"]);
  }else{
    group("left:0;right:0",["#EFE8DC","#CFC7BA","#ABA294"]);
  }
  wrap.appendChild(art);
}

          chip.style.borderLeft="3px solid "+blockColors[bi%blockColors.length];

      const foot=mk("div","wc-footer");
      if(data.journal)foot.appendChild(mk("div","wc-intent-dot"));

      if((data.chores||[]).length){
        const cp=mk("span","wc-chore-pill");tx(cp,dnCnt+"/"+(data.chores||[]).length);
        foot.appendChild(cp);

      grid.appendChild(cube);
    });
    scroll.appendChild(grid);
    buildWeekTodo(scroll);
  }

  // PLAN VIEW
  if(nav==="plan"){
    const mkey=S.planMonth;
    const mDate=new Date(mkey+"-15T12:00:00");

    // Targets
    const targets=ls("dc2-targets",[]).filter(function(t){return t.deadline>=T;});
    if(targets.length){
      const tlbl=mk("div","slbl");tx(tlbl,"targets");scroll.appendChild(tlbl);
      targets.forEach(function(t){

        const tt=mk("div","tc-title");tx(tt,TMARK+"  "+t.title);
        const daysLeft=Math.ceil((new Date(t.deadline+"T12:00:00")-new Date(T+"T12:00:00"))/86400000);
        const tm=mk("div","tc-meta");tx(tm,t.sessions+" sessions · "+daysLeft+" days left · until "+t.deadline);
        const del=mk("button","tc-del");tx(del,"×");
        del.addEventListener("click",function(e){e.stopPropagation();

        tc.style.cursor="pointer";
        tc.addEventListener("click",function(){
